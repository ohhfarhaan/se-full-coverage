<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="395 MCQs for Software Engineering Units 3 and 4, with a reason for every option."><meta property="og:title" content="Full Coverage SE Quiz"><meta property="og:description" content="395 MCQs for Software Engineering Units 3 and 4, with a reason for every option."><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' rx='2' fill='%232c4fe0'/%3E%3Crect x='9' width='7' height='7' rx='2' fill='%230c8a5f'/%3E%3Crect y='9' width='7' height='7' rx='2' fill='%23f0a020'/%3E%3Crect x='9' y='9' width='7' height='7' rx='2' fill='%232c4fe0'/%3E%3C/svg%3E"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style><title>Full Coverage SE Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: tabs for each unit with question counts, a grid of topic cards in the first screen, then a question with a numbered palette beside it. */
:root{
  --bg:#f1f3f9; --dot:#dde2ef; --surface:#ffffff; --sunk:#e8ecf5; --line:#d3d9e8;
  --ink:#131a35; --muted:#566083;
  --u3:#2c4fe0; --u3-ink:#2343c4; --u3-on:#ffffff; --u4:#f0a020; --u4-ink:#8a5200; --u4-on:#241500;
  --pass:#0c8a5f; --pass-bg:#e2f5ec; --fail:#cf3148; --fail-bg:#fdeaec; --mark-on:#ffffff;
  --shadow:0 1px 2px rgb(19 26 53 / .06),0 14px 34px -18px rgb(19 26 53 / .28);
  --display:"Bricolage Grotesque","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1023; --dot:#1a2142; --surface:#141a36; --sunk:#0f1530; --line:#2a3360;
  --ink:#ebeffc; --muted:#9aa6cd;
  --u3:#7f9cff; --u3-ink:#a3b8ff; --u3-on:#0c1023; --u4:#ffb84d; --u4-ink:#ffc76f; --u4-on:#241500;
  --pass:#3ed6a0; --pass-bg:#10302f; --fail:#ff7283; --fail-bg:#371a30; --mark-on:#0c1023;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 18px 40px -18px rgb(0 0 0 / .7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1023; --dot:#1a2142; --surface:#141a36; --sunk:#0f1530; --line:#2a3360;
  --ink:#ebeffc; --muted:#9aa6cd;
  --u3:#7f9cff; --u3-ink:#a3b8ff; --u3-on:#0c1023; --u4:#ffb84d; --u4-ink:#ffc76f; --u4-on:#241500;
  --pass:#3ed6a0; --pass-bg:#10302f; --fail:#ff7283; --fail-bg:#371a30; --mark-on:#0c1023;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 18px 40px -18px rgb(0 0 0 / .7);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);
  font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin-inline:auto;padding-block:20px 64px}
h1,h2,h3,p,fieldset,legend,ul,ol,pre{margin:0;padding:0}
fieldset{border:0;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible+label{outline:3px solid var(--u3);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.u3{--uc:var(--u3);--ui:var(--u3-ink);--uo:var(--u3-on)} .u4{--uc:var(--u4);--ui:var(--u4-ink);--uo:var(--u4-on)}
.ux{--uc:var(--ink);--ui:var(--ink);--uo:var(--bg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.note{font-size:.93rem;color:var(--muted)}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 18px;font-weight:600;line-height:1.2;transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--ink)} .btn:active{transform:translateY(1px)}
.btn.go{background:var(--u3);border-color:var(--u3);color:var(--u3-on)} .btn.go:hover{filter:brightness(1.08)}
.btn.big{padding:15px 26px;font-size:1.08rem}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.bare{background:none;border-color:transparent;color:var(--muted);padding-inline:8px;font-weight:500} .btn.bare:hover{color:var(--ink);text-decoration:underline;border-color:transparent}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 32px;padding-block:10px 22px}
.top h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:800;letter-spacing:-.035em}
.top p{margin-top:6px;font-size:1.04rem;color:var(--muted)}
.done{min-width:min(100%,230px);font-size:.92rem;color:var(--muted)} .done b{color:var(--ink)}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:6px}
.meter span{display:block;height:100%;transition:width .3s} .meter .ok{background:var(--pass)} .meter .no{background:var(--fail)} .meter .had{background:var(--u3)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 18px;text-align:left;transition:border-color .12s,background .15s}
.tab b{display:block;font:700 1.22rem/1.2 var(--display);letter-spacing:-.015em}
.tab span{font-size:.93rem;color:var(--muted)}
.tab:hover{border-color:var(--uc)}
.tab[aria-selected="true"]{background:var(--uc);border-color:var(--uc);color:var(--uo)}
.tab[aria-selected="true"] span{color:inherit;opacity:.88}

.panel{padding-top:20px}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.filter legend,.filter>span{font-size:.95rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills label{border:1.5px solid var(--line);border-radius:9px;padding:7px 14px;font-size:.95rem;font-weight:500;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
.pills label:hover{border-color:var(--muted)}
.pills input:checked+label{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* topic cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,256px),1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 17px;min-height:132px;transition:border-color .12s,transform .12s,box-shadow .15s}
.card:hover:not([disabled]){border-color:var(--uc);transform:translateY(-2px);box-shadow:var(--shadow)}
.card[disabled]{opacity:.45;cursor:not-allowed}
.card .name{font-weight:700;font-size:1.05rem;line-height:1.28}
.card .ct{color:var(--muted);font-size:.95rem}
.card .cells{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.cells i{width:9px;height:9px;border-radius:2.5px;background:color-mix(in oklab,var(--uc) var(--a,38%),var(--surface))}
.cells i.ok{background:var(--pass)} .cells i.no{background:var(--fail)}
.d-e{--a:24%} .d-m{--a:42%} .d-h{--a:74%}
.card .act{margin-top:auto;padding-top:9px;font-weight:600;font-size:.95rem;color:var(--ui)}
.card .act::after{content:" →"}
.card.all{background:var(--uc);border-color:var(--uc);color:var(--uo)}
.card.all .ct,.card.all .act{color:inherit} .card.all .ct{font-size:1rem}
.card.all .name{font:700 1.28rem/1.2 var(--display)}
.key{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:16px;font-size:.86rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px} .key i{width:10px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--uc) var(--a),var(--surface))}
.key i.ok{background:var(--pass)} .key i.no{background:var(--fail)}

.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;background:var(--surface);border:1.5px solid var(--u3);border-radius:14px;padding:13px 18px;margin-bottom:14px}
.resume b{font-weight:700}

.box{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px;max-width:660px;display:grid;gap:20px}
.box h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.box legend{font-size:.93rem;font-weight:600;margin-bottom:8px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 28px;margin-top:36px;font-size:.89rem;color:var(--muted)}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:0 36px;align-items:start}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:6px}
.bar .btn{padding:9px 14px;font-size:.95rem}
.bar .where{flex:1;min-width:0;font-weight:700;font-size:1.02rem;color:var(--ui)}
.quiz>.meter{grid-column:1/-1;margin:8px 0 26px}
.q{min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:.93rem;color:var(--muted);margin-bottom:12px}
.meta .tp{color:var(--ink);font-weight:700}
.lvl{display:inline-flex;align-items:flex-end;gap:3px}
.lvl i{width:5px;border-radius:1.5px;background:var(--line)} .lvl i:nth-child(1){height:7px} .lvl i:nth-child(2){height:11px} .lvl i:nth-child(3){height:15px}
.lvl i.x{background:var(--uc)} .lvl em{font-style:normal;margin-left:5px;line-height:1}
.q h2{font-size:clamp(1.28rem,3vw,1.66rem);font-weight:600;letter-spacing:-.012em;line-height:1.28;text-wrap:pretty}
.code{margin-top:16px;background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;overflow-x:auto;padding:13px 16px;font:400 .87rem/1.62 var(--mono);font-variant-ligatures:none;tab-size:2}
.hint{margin-top:18px;font-size:.94rem;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:12px;list-style:none;padding:0}
.opt{position:relative;width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 14px;text-align:left;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:13px 18px 13px 13px;transition:border-color .12s,background .2s}
.opt .k{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);font:600 .95rem/1 var(--mono)}
.opt .tx{padding-top:5px;font-weight:500;font-size:1.04rem;line-height:1.42;overflow-wrap:anywhere}
.opt:not(.lock):hover,.opt.sel{border-color:var(--uc)}
.opt:not(.lock):hover .k,.opt.sel .k{background:var(--uc);color:var(--uo)}
.opt .why{grid-column:2;font-size:.97rem;line-height:1.5;color:var(--muted);padding-top:3px}
.opt .why b{display:block;font-size:.86rem;font-weight:700}
.opt.good{scroll-margin-block:20px 100px;border-color:var(--pass);background:var(--pass-bg)} .opt.good .k{background:var(--pass);color:var(--mark-on)}
.opt.good .why{color:var(--ink)} .opt.good .why b{color:var(--pass)}
.opt.bad{border-color:var(--fail);background:var(--fail-bg)} .opt.bad .k{background:var(--fail);color:var(--mark-on)}
.opt.bad .why{color:var(--ink)} .opt.bad .why b{color:var(--fail)}
.fresh.good{animation:hit .5s} .fresh.bad{animation:miss .4s}
@keyframes hit{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--pass) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes miss{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.dock{position:sticky;bottom:0;margin-top:16px;padding-block:18px max(14px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:linear-gradient(transparent,var(--bg) 22%)}
.dock .nx{min-width:150px}
.verdict{flex:1;min-width:0;text-align:center;line-height:1.2}
.verdict b{font:700 1.1rem var(--display)} .verdict.ok b{color:var(--pass)} .verdict.no b{color:var(--fail)}
.pal{position:sticky;top:20px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.pal h3{font-size:1.02rem;font-weight:700}
.pal p{font-size:.89rem;color:var(--muted);margin-top:3px}
.pal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin:12px -4px;padding:4px;max-height:min(52vh,440px);overflow-y:auto;position:relative}
.pal .grid button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;height:34px;padding:0;font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}
.pal .grid button:hover{border-color:var(--ink)}
.pal .ok{background:var(--pass)!important;border-color:var(--pass)!important;color:var(--mark-on)}
.pal .no{background:var(--fail)!important;border-color:var(--fail)!important;color:var(--mark-on)}
.pal .had{background:var(--u3)!important;border-color:var(--u3)!important;color:var(--u3-on)}
.pal .cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pal .btn{width:100%}
.pal-t{display:none}
.keys{margin-top:4px;font-size:.83rem;color:var(--muted)} .keys kbd{font:600 .78rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
@media (hover:none){.keys{display:none}}

/* results */
.rep{max-width:860px;margin-inline:auto}
.score{display:flex;flex-wrap:wrap;gap:8px 34px;align-items:center;padding-block:20px 26px}
.score .big{font:800 clamp(4.2rem,13vw,6.6rem)/.9 var(--display);letter-spacing:-.05em}
.score .big small{font-size:.38em;color:var(--muted);letter-spacing:-.02em;font-weight:600}
.score>div:last-child{flex:1 1 300px;min-width:0}
.score h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em} .score p{font-size:1.04rem;color:var(--muted);margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:38px}
.rep h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.rows{display:grid;gap:11px;margin:14px 0 38px}
.row{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 4rem;gap:16px;align-items:center;font-size:.95rem}
.row .meter{margin:0;height:11px} .row .num{text-align:right;color:var(--muted)}
.rev-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.rev details{border-top:1.5px solid var(--line)} .rev details:last-child{border-bottom:1.5px solid var(--line)}
.rev summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:13px 4px;cursor:pointer;list-style:none;font-weight:500}
.rev summary::-webkit-details-marker{display:none} .rev summary:hover{color:var(--u3-ink)}
.tag{font-size:.8rem;font-weight:700;line-height:1;padding:6px 9px;border-radius:6px;align-self:start;min-width:5em;text-align:center}
.tag.ok{background:var(--pass-bg);color:var(--pass)} .tag.no{background:var(--fail-bg);color:var(--fail)} .tag.sk{background:var(--sunk);color:var(--muted)}
.rev .in{padding:0 4px 22px}

@media (max-width:900px){
  .quiz{grid-template-columns:minmax(0,1fr)}
  .pal{position:static;display:none;grid-row:3;margin-bottom:22px} .pal.open{display:block}
  .pal-t{display:inline-block}
}
@media (max-width:640px){
  .wrap{padding-block:10px 48px}
  .top{padding-block:8px 16px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .tab{padding:10px 14px} .tab b{font-size:1.1rem}
  .top{gap:10px} .top h1{font-size:min(1.72rem,7.1vw)} .top p{font-size:.98rem} .done{min-width:100%}
  .resume{padding:11px 14px;flex-wrap:nowrap;font-size:.95rem;line-height:1.35}
  .filter>span{display:none} .pills label{padding:7px 10px;font-size:.9rem} .pills{gap:5px}
  .cards{gap:9px} .card{min-height:0;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 14px;align-items:center}
  .card .name,.card .cells{grid-column:1/-1} .card .cells{grid-row:3;margin-top:8px}
  .card .act{padding:0;margin:0;text-align:right;font-size:.92rem;max-width:11.5em}
  .box{padding:18px 16px}
  .opt{padding:11px;grid-template-columns:30px minmax(0,1fr);gap:4px 12px} .opt .k{width:30px;height:30px} .opt .tx{padding-top:3px}
  .dock{gap:8px} .dock .btn{padding-inline:13px} .dock .nx{min-width:0} .verdict b{font-size:.98rem}
  .bar .where{order:3;flex-basis:100%} .bar .pal-t{margin-left:auto}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px} .row .meter{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

<script>window.BANK=[{"u":3,"t":"ai","d":"e","s":"13","q":"In the lecture's framing, what does AI change about the software development lifecycle?","o":[["It speeds up subtasks, while the lifecycle itself stays in charge","\"SDLC still governs the process\": AI accelerates and automates subtasks but the overarching lifecycle is unchanged."],["It merges design, coding and testing into one prompt-driven phase","The phases all remain. The slides list AI help inside each phase separately."],["It removes the need for requirements and design before coding","Requirements and architecture still exist; AI only drafts them and humans validate."],["It shifts accountability from engineers to the AI tool vendor","Human accountability is named explicitly as something AI does not remove."]],"id":"3ai01"},{"u":3,"t":"ai","d":"m","s":"10","q":"Which contrast between software engineering and machine learning does the lecture draw about evaluation?","o":[["SE checks functional correctness; ML checks accuracy","The slide says the concept of evaluation is very different: functional correctness vs accuracy."],["SE checks accuracy; ML checks functional correctness","This is the right pair swapped round. ML offers no correctness guarantee."],["SE is evaluated once; ML is never evaluated","ML is evaluated continuously with accuracy, precision and recall."],["SE checks precision; ML checks recall","Precision and recall are both ML metrics, so this mixes one discipline's metrics into the other."]],"id":"3ai02"},{"u":3,"t":"ai","d":"m","s":"31","q":"Arrange these AI-generated-code weaknesses from MOST to LEAST often insecure, using the figures in the slides.","o":[["Log injection, XSS, SQL injection, cryptographic","Log injection 88%, XSS 86%, SQL injection 20%, cryptographic weaknesses 14%."],["XSS, log injection, cryptographic, SQL injection","XSS (86%) is just below log injection (88%), and SQL injection (20%) is above crypto (14%)."],["SQL injection, XSS, log injection, cryptographic","SQL injection is only 20%. The slide notes models handle it somewhat better."],["Log injection, SQL injection, XSS, cryptographic","XSS at 86% is far above SQL injection at 20%."]],"id":"3ai03"},{"u":3,"t":"ai","d":"h","s":"22","q":"An AI assistant produces this function. What is the most serious problem, and the best fix?","c":["void process_event_name(char *input) {","  char event_name[50];","  strcpy(event_name, input);","  printf(\"Processing event: %s\\n\", event_name);","}"],"o":[["Buffer overflow; use a length-bounded copy and check input for NULL","strcpy keeps copying past 50 bytes if input is longer. A bounded copy plus a NULL check closes it."],["Format string attack; pass event_name to printf on its own","The printf here is safe because the format string is a literal. Passing event_name alone would create the bug."],["Memory leak; free event_name before the function returns","event_name is a stack array, so there is nothing to free. Calling free on it would be an error."],["Dangling pointer; make event_name static so it outlives the call","The pointer is never returned. Making it static would keep the overflow and add shared state."]],"id":"3ai04"},{"u":3,"t":"ai","d":"h","s":"24","q":"These are AI-generated tests for an event app. Which important risk do they leave untested?","c":["register_event(\"Spring Fest\", \"JohnDoe\") == True","register_event(\"\", \"JohnDoe\") == False","register_event(\"Spring Fest\", \"\") == False","register_event(\"x\" * 500, \"JohnDoe\") == False"],"o":[["The same user registering twice for a full event","The set covers only a happy path and blank or long inputs. Business rules such as duplicates, capacity and unknown events are missing."],["An empty event name being passed to the function","Test 2 already does this."],["An empty user name being passed to the function","Test 3 already does this."],["A long event name, such as 500 characters, being passed in","Test 4 already does this with 500 characters."]],"id":"3ai05"},{"u":3,"t":"ai","d":"m","s":"35","q":"\"Type checking Java code\" is the slide's example for rejecting an LLM under which consideration?","o":[["Alternative solutions","A compiler type-checks deterministically and gives better results, so an LLM adds nothing."],["Risk tolerance","The slide's example for risk tolerance is answering emergency medical questions."],["Error probability","The slide's example for error probability is grading mathematical proofs."],["Risk mitigation strategies","The slide's example for mitigation is unit test generation."]],"id":"3ai06"},{"u":3,"t":"ai","d":"h","s":"35","q":"Why does unit test generation score comparatively well under the \"Consider the following\" framework?","o":[["Its output can be verified by running it, so mistakes are cheap to catch","This is the \"risk mitigation\" question: can you verify outputs or minimise the cost of errors? Tests can simply be executed."],["LLMs produce correct unit tests with near-zero error probability","No such guarantee is claimed. Verification is what makes the errors tolerable."],["No deterministic alternative exists for producing any kind of test","Test generators and fuzzers existed before LLMs, so this is not the reason given."],["Faulty tests have no effect on the quality of the shipped product","Bad tests create false confidence, which is a real cost. They still need review."]],"id":"3ai07"},{"u":3,"t":"ai","d":"m","s":"32","q":"Which is given as a root cause of security faults in AI-generated code?","o":[["Training on public repositories that contain vulnerable examples","The model learns insecure patterns from the public code it was trained on."],["Compilers optimising away checks that the model had inserted","Compilers do remove some code, but the faults here come from what the model learned and from its weak grasp of context."],["Developers writing prompts that are longer than the context window","Prompt length is not listed. The causes are training data and weak contextual understanding."],["Models being trained only on proprietary, closed-source systems","It is the reverse: publicly available code is the stated source."]],"id":"3ai08"},{"u":3,"t":"ai","d":"m","s":"29","q":"In the Copilot study shown in class (Yetistiren et al.), what was the LARGEST share of generations?","o":[["Partially correct, about 51%","The chart shows 51.2% partially correct, 28.7% correct and 20.1% incorrect."],["Fully correct, about 51%","Only 28.7% were fully correct."],["Incorrect, about 51%","Incorrect generations were the smallest slice at 20.1%."],["Fully correct, about 80%","You reach about 80% only by adding the correct and partially correct slices."]],"id":"3ai09"},{"u":3,"t":"ai","d":"h","s":"31","q":"One study examined 1,689 Copilot-generated programs. Using the reported rate, about how many had exploitable bugs or design flaws?","o":[["676","40% of 1,689 is 675.6, so about 676 programs."],["236","This is about 14%, which is the cryptographic weakness figure."],["338","This is about 20%, which is the SQL injection figure."],["1,453","This is about 86%, which is the XSS figure."]],"id":"3ai10"},{"u":3,"t":"ai","d":"h","s":"18","q":"An AI proposes a client talking directly to one monolithic server that handles events, registration, notifications and storage. Which critique is strongest?","o":[["One failure or spike in any feature can take every feature down","The server is a single point of failure, and features such as notifications cannot be scaled or isolated separately."],["Client-server architectures cannot be used with mobile clients","They are used with mobile clients all the time; that part of the proposal is fine."],["Monoliths cannot store persistent data without a second server","A monolith can persist data. The concern is coupling and scaling."],["The design must be rejected since AI may not propose architecture","AI may suggest; engineers weigh trade-offs and peer review. Rejecting it for being AI-made is not the point."]],"id":"3ai11"},{"u":3,"t":"ai","d":"m","s":"26","q":"With AI-assisted deployment, what does the lecture say the team must STILL define for itself?","o":[["Service-level objectives and rollback policies","The \"fundamental\" note: you still set SLOs, define rollback policies and keep a \"you broke it, you fix it\" culture."],["Pipeline optimisations based on past run data","This is listed as something AI can suggest."],["Anomaly detection rules for every dashboard","Predictive anomaly detection is listed on the AI side."],["Deployment scripts written by hand for each release","Hand-written scripts are the \"old-fashioned\" approach."]],"id":"3ai12"},{"u":3,"t":"ai","d":"m","s":"27","q":"Which maintenance activity does the lecture keep on the HUMAN side even with AI?","o":[["Prioritising fixes against new feature work","Strategic road-mapping and balancing short-term fixes with long-term code health need human oversight."],["Routing incoming bugs to the right owner","Bug-triage assistants classify and route issues."],["Predicting technical-debt hotspots","Code-health dashboards predict these."],["Suggesting method or module extraction","Automated refactoring suggestions cover this."]],"id":"3ai13"},{"u":3,"t":"ai","d":"e","s":"25","q":"Using ML to decide which tests to run first in a pipeline is an example of:","o":[["Intelligent orchestration","The slide defines it as using ML to prioritise and orchestrate test execution efficiently."],["Automated elicitation","Elicitation belongs to requirements engineering."],["Predictive rollback","Rollback support belongs to deployment and DevOps."],["Gap analysis","Gap analysis compares new requirements against past projects."]],"id":"3ai14"},{"u":3,"t":"ml","d":"m","s":"47","q":"In the photo gallery example, how do the ML model and the ML system relate?","o":[["Object detection is one box among UI, payment, storage and logging","The model is a single component. The system also has user management, database, cloud processing, logging and monitoring."],["The ML system is the notebook in which the model gets trained","The notebook is the model side of the picture."],["The ML model contains the user interface and the database as layers","Those are non-ML components outside the model."],["The two are identical once the model has been deployed to the cloud","Deployment does not turn a model into a whole system."]],"id":"3ml01"},{"u":3,"t":"ml","d":"m","s":"52","q":"Which step belongs to the \"in production\" part of the typical ML pipeline?","o":[["Selecting production data for retraining","Production steps: evaluate on production data and monitor, select data for retraining, update the model regularly."],["Splitting data into training and evaluation sets","This is a static-phase step."],["Extracting features from the raw labelled data","Feature engineering is a static-phase step."],["Collecting, cleaning and labelling the first dataset","Data preparation is a static-phase step."]],"id":"3ml02"},{"u":3,"t":"ml","d":"m","s":"53","q":"What is the main message of the Sculley et al. diagram shown in class?","o":[["ML code is a tiny box surrounded by much larger infrastructure","Configuration, data collection, verification, serving and monitoring dwarf the ML code box."],["ML code is most of the system, so it carries most of the debt","The diagram makes exactly the opposite point."],["Monitoring can be dropped once the model reaches its accuracy goal","Monitoring is one of the large required boxes."],["Hidden technical debt appears only in projects without DevOps","The paper is about ML systems generally; no such condition is made."]],"id":"3ml03"},{"u":3,"t":"ml","d":"m","s":"55","q":"Which pairing correctly separates DevOps from MLOps as defined in class?","o":[["DevOps: continuous delivery. MLOps: automating the ML pipeline","MLOps covers training, evaluation, versioning and deployment, and is a specialised subset of DevOps."],["DevOps: model versioning. MLOps: server provisioning","Model versioning belongs to MLOps."],["DevOps: a subset of MLOps. MLOps: the larger general discipline","The relationship is the other way round."],["DevOps: manual releases on request. MLOps: automated model releases","DevOps itself relies on heavy automation."]],"id":"3ml04"},{"u":3,"t":"ml","d":"h","s":"66-68","q":"Why is a function such as detectObjects(image) said to \"break modular reasoning\"?","o":[["No precise specification exists that callers could rely on","You can specify sum() exactly, but for detectObjects the contract is \"????\", so you cannot reason about callers from the contract alone."],["Its input is a file, and files cannot be passed between modules","File parameters are ordinary. The missing contract is the issue."],["Its source code is usually kept private by the model vendor","Closed source does not stop you reasoning from a specification; a missing specification does."],["It runs on a GPU, so its timing depends on another module","Hardware timing is not the argument in this part of the lecture."]],"id":"3ml05"},{"u":3,"t":"ml","d":"h","s":"44","q":"Engineers see 63 failing cases in an LLM evaluation and demand a 100% pass rate. What does the lecture say is wrong here?","o":[["They are treating a statistical evaluation like a set of unit tests","The quote from Nahar et al. says it is OK that there are failures, because model evaluation measures accuracy, not correctness."],["They should delete the failing cases until the suite goes green","That hides information and is metric gaming."],["They should have used a bigger model until failures reached zero","Growing the model until errors vanish is not a strategy; mistakes must be planned for."],["They are running the evaluation too early in the project lifecycle","Timing is not the complaint; the mindset about pass rates is."]],"id":"3ml06"},{"u":3,"t":"ml","d":"m","s":"79","q":"Which smart-toaster safeguard is \"IN the model\"?","o":[["Predicting doneness from heat and past outputs","This relies on the model, and the slide notes guarantees are hard to make there."],["A simple code check on the maximum toasting time","Listed as outside the model."],["A non-ML rule that shuts the toaster down when hot","Listed as outside the model."],["A thermal fuse built into the hardware","Listed as outside the model."]],"id":"3ml07"},{"u":3,"t":"ml","d":"h","s":"79","q":"A team must GUARANTEE a toaster never exceeds a safe temperature. Why choose a thermal fuse over retraining the model?","o":[["The fuse bounds the hazard even when the model is wrong","Safety outside the model does not depend on the model being right. Inside the model, guarantees are hard to make."],["The fuse makes the model's predictions more accurate","A fuse does nothing to the model's accuracy."],["Retraining is impossible after a device has been shipped","Models can be updated after shipping; updates simply give no guarantee."],["The fuse lets the team skip hazard analysis altogether","Hazard analysis is how you decide that the fuse is needed."]],"id":"3ml08"},{"u":3,"t":"ml","d":"m","s":"80","q":"A second component checks every output of the ML component and switches to a backup when it looks wrong. Which strategy is this?","o":[["Mistake detection and recovery","Monitoring, doer-checker, fail-over and redundancy are all listed under this heading."],["Undoable actions for the user","Undo lets the user reverse an action after it has happened."],["Human in the loop for approval","No person makes the decision in this scenario."],["Containment and isolation","Isolation limits how far damage spreads; it does not check each output."]],"id":"3ml09"},{"u":3,"t":"ml","d":"m","s":"86","q":"Which set of questions belongs to hazard analysis as described in the lecture?","o":[["What is the worst that can happen? Is there a backup? Can it be undone?","Hazard analysis anticipates mistakes and their consequences, including non-technical compensation."],["How big is the model? How often is it updated? What does it cost?","These are considerations for where the model should live."],["Which API does each component publish, and who may access it?","This is an architecture decision question."],["How much data do we need, and how should it be labelled?","These are data collection questions."]],"id":"3ml10"},{"u":3,"t":"ml","d":"h","s":"93","q":"In the AR glasses analysis, Bluetooth latency is 40-200 ms and 4G latency is 90-160 ms. What is the one-way network delay from glasses to cloud over 4G?","o":[["130-360 ms","The path is glasses to phone (40-200) then phone to cloud (90-160). Adding gives 130 to 360 ms."],["90-160 ms","This leaves out the Bluetooth hop between the glasses and the phone."],["50-400 ms","This adds nothing meaningful; the minimums sum to 130 and the maximums to 360."],["260-720 ms","This is the round trip, double the one-way figure."]],"id":"3ml11"},{"u":3,"t":"ml","d":"h","s":"93","q":"Glasses stream camera frames to a cloud model. With Bluetooth at 3 Mbit/s, 4G at 60 Mbit/s and Wi-Fi at 90 Mbit/s, which change helps bandwidth most?","o":[["Running the model on the glasses or sending far less data","Every frame must cross the 3 Mbit/s Bluetooth link first, so that hop is the bottleneck."],["Moving from 4G to Wi-Fi for the phone-to-cloud connection","The phone-to-cloud link is already 20 times faster than Bluetooth."],["Adding more cloud servers to speed up the model's inference","Server count does not change link bandwidth."],["Choosing a more accurate object detection model in the cloud","Accuracy has no effect on how much data must be sent."]],"id":"3ml12"},{"u":3,"t":"ml","d":"m","s":"92","q":"Which consideration most directly favours running a model on the DEVICE instead of in the cloud?","o":[["The app must keep working when the user is offline","\"What happens if users are offline?\" is one of the listed considerations, and only on-device inference survives it."],["The model is huge and gets updated several times a day","A large, frequently updated model is costly to distribute, which favours the cloud."],["The device has a small battery and the model is power hungry","Heavy on-device execution drains the battery, which favours the cloud."],["The model needs a very large shared database as its input","Centralised data favours server-side inference."]],"id":"3ml13"},{"u":3,"t":"ml","d":"m","s":"87","q":"\"Synchronous or asynchronous calls?\" belongs to which architecture question?","o":[["How do components communicate?","The slide lists synchronous vs asynchronous under component communication."],["Where do the components live?","That one is about monolith vs microservices."],["Where does the ML inference happen?","That one is about client-side vs server-side."],["How large should the user database be?","That one is about centralised vs decentralised storage."]],"id":"3ml14"},{"u":3,"t":"ml","d":"m","s":"88","q":"Which quality requirements does the slide single out as ML-specific?","o":[["Accuracy, ability to collect data, training latency","These appear on the line labelled \"ML\" in the quality requirements slide."],["Scalability, availability, throughput","These apply to every system."],["Security, safety, usability","These apply to every system."],["Development cost, operating cost, time to release","These are general business qualities."]],"id":"3ml15"},{"u":3,"t":"ml","d":"e","s":"81","q":"AI cancer-diagnosis systems that assist pathologists without replacing them are the lecture's example of:","o":[["Humans in the loop","The expert stays responsible for the decision and the AI assists."],["Guardrails","Guardrails are fixed rules, such as a maximum toasting time."],["Undoable actions","Undo is about reversing an action later."],["Redundancy","Redundancy duplicates components so one can take over."]],"id":"3ml16"},{"u":3,"t":"ml","d":"m","s":"95","q":"Which statement agrees with the summary of the SE4AI lecture?","o":[["Failures are inevitable, so design for graceful degradation","The summary also says accuracy isn't everything and safety requires multiple layers."],["A sufficiently accurate model makes extra safety layers redundant","\"Never rely solely on the model.\""],["Where components live matters little once accuracy is high","\"Architecture matters\": location affects system behaviour."],["An ML system is the model together with its training data","ML systems are not ML models; the model is just one component."]],"id":"3ml17"},{"u":3,"t":"code","d":"e","s":"101-102","q":"Which \"programming personality\" wrote this line?","c":["int f(int n){return n<2?n:f(n-1)+f(n-2);}"],"o":[["The Cryptic Ninja","Dense, clever, one-letter names and no spacing."],["The Verbose Novelist","That one uses very long names and a comment on every line."],["The Chaos Demon","That one has inconsistent layout and formatting."],["The Professional","That one is compact but readable, with a clear function name and layout."]],"id":"3code01"},{"u":3,"t":"code","d":"m","s":"106","q":"A module does almost nothing itself and hands every job to other modules. Which programmer type does this suggest?","o":[["CIO type","The slide describes CIO types as passing responsibility to other modules."],["Faker","Fakers have repetitive code."],["Multitasker","Multitaskers use wrappers and glue instead of rewriting."],["Dynamic type","Dynamic types create variables on the fly."]],"id":"3code02"},{"u":3,"t":"code","d":"m","s":"111","q":"According to the \"cost of fixing a bug\" chart, a bug is most expensive when found by:","o":[["The end user, after production","The bar for post-production is by far the tallest."],["The developer, in unit testing","This is the cheapest point."],["A team mate, during integration","This is only slightly more than unit testing."],["The QA team, in system testing","This costs more than integration but far less than post-release."]],"id":"3code03"},{"u":3,"t":"code","d":"m","s":"118","q":"Following the class naming conventions, which casing is used for METHOD names?","o":[["Camel casing, as in backColor","The slide lists camel casing for method names."],["Pascal casing, as in BackColor","Pascal is for class and variable names and method parameters."],["Underscore prefix, as in _backColor","This is for internal use inside a class or method."],["All capitals, as in BACKCOLOR","All capitals is common for constants elsewhere, but the slide lists only Pascal, camel and underscore prefix."]],"id":"3code04"},{"u":3,"t":"code","d":"m","s":"118","q":"Which identifier breaks a stated naming rule?","o":[["q","Names should have at least 2-3 characters, and this one has one."],["backColor","This is valid camel casing."],["EventName","This is valid Pascal casing."],["maxSeats","This is valid and descriptive."]],"id":"3code05"},{"u":3,"t":"code","d":"h","s":"126","q":"Given k = 0 and o = 0, what are their values after this C code runs with ch = 12?","c":["if (ch >= 3)","if (ch <= 10)","    k++;","else","    o++;"],"o":[["k = 0, o = 1","else pairs with the NEAREST if. 12 >= 3 is true, 12 <= 10 is false, so o++ runs."],["k = 0, o = 0","You would get this if else belonged to the outer if, which is how the author may have meant it."],["k = 1, o = 0","k++ needs ch <= 10, which is false for 12."],["k = 1, o = 1","k++ and o++ are on opposite branches, so both can never run."]],"id":"3code06"},{"u":3,"t":"code","d":"h","s":"126","q":"k and o start at 0. Which value of ch leaves BOTH of them at 0 in this C code?","c":["if (ch >= 3)","if (ch <= 10)","    k++;","else","    o++;"],"o":[["2","The outer condition fails, and the else belongs to the inner if, so nothing executes."],["3","3 >= 3 and 3 <= 10 are true, so k becomes 1."],["10","Both conditions hold, so k becomes 1."],["11","The outer condition holds and the inner fails, so o becomes 1."]],"id":"3code07"},{"u":3,"t":"code","d":"m","s":"124","q":"A code reviewer sees a routine with seven formal parameters. What do the style guidelines advise?","o":[["Examine it, since it has more than five","The \"don'ts\" list says to examine routines that have more than five formal parameters."],["Accept it, since up to ten is the limit","No limit of ten is given."],["Split it, since more than three is banned","No limit of three is given, and the advice is to examine."],["Convert all the parameters to global variables","Globals make the code harder to follow and test."]],"id":"3code08"},{"u":3,"t":"code","d":"h","s":"129","q":"Two users register at the same moment when one seat is left, and both succeed. What is this failure called in the slides?","o":[["TOCTOU race condition","Time-of-check to time-of-use: both read the count before either writes."],["Interleaved write corruption","That mangles rows in the file. Here both rows may be written perfectly."],["Delimiter injection","That needs a comma or newline in the input."],["Buffer truncation","That needs a line longer than the buffer."]],"id":"3code09"},{"u":3,"t":"code","d":"h","s":"129","q":"The helper counts registrations using strstr(line, event_name). Which input makes the count for \"Tech\" wrong?","o":[["A row for the event \"TechFest\"","strstr finds \"Tech\" inside \"TechFest\", so the row is counted by mistake. \"Biotech\" in lower case would not even match."],["A row for the event \"Art Show\"","\"Tech\" does not occur in this row unless it is in the user name."],["An empty registrations.txt file","The loop body never runs, so the count is correctly 0."],["Two rows for the event \"Tech\"","Both are genuine matches, so the count is right."]],"id":"3code10"},{"u":3,"t":"code","d":"h","s":"131","q":"In register_for_event, the file is opened BEFORE the capacity check. Besides a needless open when the event is full, what serious defect remains?","o":[["If fopen returns NULL, fclose(NULL) is undefined behaviour","Neither function checks for NULL, and passing NULL to fclose can crash the program."],["Opening in append mode erases the earlier registrations","Mode \"a\" appends. Mode \"w\" would erase."],["The file is closed twice when the event is full","Each path closes it once; the full path closes it just before return 0."],["The capacity check can never evaluate to true","It works when current_count is less than max_capacity."]],"id":"3code11"},{"u":3,"t":"code","d":"m","s":"132","q":"A user registers with the name \"eve,HackCon\\nadmin\". What kind of damage does this cause?","o":[["It injects extra columns and records into the CSV","Commas and newlines are not sanitised, so the CSV structure is altered."],["It overflows the 100-character line buffer","The string is far shorter than 100 characters."],["It makes the whole file read-only for later users","User input does not change file permissions."],["It causes a deadlock between two processes","No locks exist in the code, so there is nothing to deadlock on."]],"id":"3code12"},{"u":3,"t":"code","d":"m","s":"134","q":"\"Access is denied unless a permission explicitly allows it\" describes which secure coding practice?","o":[["Default deny","Access decisions are based on permission, not exclusion."],["Least privilege","That limits how much access a process has while it runs."],["Validate input","That checks data arriving from untrusted sources."],["Sanitise data","That cleans data before sending it to other subsystems."]],"id":"3code13"},{"u":3,"t":"code","d":"m","s":"134","q":"A backup service runs as root all day but needs root for only 10 seconds a night. Which advice does it ignore?","o":[["Hold elevated permissions for the least time","Under least privilege, elevated permissions should be held for the least amount of time."],["Compile at the highest warning level","That is about compiler warnings."],["Sanitise data sent to other systems","That is about outgoing data."],["Use dynamic analysis to find extra flaws","That is about tooling."]],"id":"3code14"},{"u":3,"t":"code","d":"m","s":"109","q":"Which item should be settled BEFORE the implementation phase starts?","o":[["A configuration management plan","Language choice, development environment and a CM plan come before implementation."],["Unit-tested, peer-reviewed code","This is delivered during the phase."],["A completed sprint burndown chart","This tracks work while it is happening."],["A release-tested build","This comes much later."]],"id":"3code15"},{"u":3,"t":"code","d":"m","s":"113","q":"A language feature that lets a concern such as logging be written separately from the code it applies to is called:","o":[["Aspect orientation support","Aspect orientation allows separation of aspects during development."],["Object orientation","That lets you code in terms of objects."],["Procedural abstraction","That gives a modest level of abstraction over the layer beneath."],["Assembly mapping","That maps directly onto the CPU architecture."]],"id":"3code16"},{"u":3,"t":"code","d":"m","s":"115","q":"An analytics dashboard needs statistics, charts and a prototype in 6 weeks. Which selection factor should weigh most?","o":[["Development speed and library support","The short timeline and statistical needs make ecosystem and speed decisive."],["Raw execution speed on one CPU core","Nothing in the scenario demands extreme performance."],["Direct access to hardware registers","That suits embedded or assembly work."],["Compatibility with iOS app packaging","The scenario is a reporting dashboard for college staff."]],"id":"3code17"},{"u":3,"t":"code","d":"e","s":"107","q":"According to the lecture, implementation itself usually takes about what share of project effort?","o":[["40-50%","The slide says 40-50% of project effort goes into implementation."],["5-10%","Implementation is a major phase. The slide puts it at 40-50% of project effort."],["80%","80% is the share of development time spent reading existing code."],["95%","This leaves no effort for testing, design or requirements."]],"id":"3code18"},{"u":3,"t":"code","d":"m","s":"127","q":"What is the key difference between the class's coding STANDARDS and coding GUIDELINES?","o":[["Standards are rules; guidelines are generic suggestions","Standards set things such as headers and naming. Guidelines are described as generic suggestions that improve readability."],["Standards are for testers; guidelines are for developers","Both are aimed at developers writing code."],["Standards cover comments; guidelines cover error handling","Error and exception handling conventions are listed under standards."],["Standards are optional; guidelines are enforced by tools","This reverses how firm the two are."]],"id":"3code19"},{"u":3,"t":"rev","d":"m","s":"141","q":"Code that returns known, fixed values in place of a function that is not under test is a:","o":[["Test stub","The slide defines stubs as code returning known, fixed values to emulate functions not being tested."],["Test harness","A harness drives modules as part of the complete system."],["Test point","A test point sets or retrieves current module status."],["Assertion","An assertion flags out-of-range values."]],"id":"3rev01"},{"u":3,"t":"rev","d":"m","s":"141","q":"What does a test harness do that a test stub does not?","o":[["It drives the module under test","A harness is code written to drive objects, modules or components. A stub is called BY the module."],["It returns fixed values when called","That is the stub's job."],["It logs execution messages","That is instrumenting."],["It ships inside the product","Harnesses and stubs are both scaffolding: code that supports testing and never ships with the application."]],"id":"3rev02"},{"u":3,"t":"rev","d":"m","s":"143","q":"A card is picked up on Monday and finished on Thursday. Which metric records this three-day span?","o":[["Cycle time","The total time from when work starts on an item until it is complete."],["Throughput","Units of work completed in a period."],["Team velocity","Amount of stories completed in a sprint."],["Sprint burndown","Work remaining across the sprint."]],"id":"3rev03"},{"u":3,"t":"rev","d":"h","s":"144","q":"A burndown chart stays flat for four days, then falls steeply. What can you conclude for certain?","o":[["No remaining work was marked complete on those days","The chart shows work remaining. A flat line means story points were not burned, whatever the reason."],["The team did not do any work at all on those four days","Work may have been in progress but not completed."],["The team spent fewer hours in those four days","The chart does not show time spent."],["The sprint goal has been missed","The later steep fall may still reach zero in time."]],"id":"3rev04"},{"u":3,"t":"rev","d":"h","s":"145","q":"Why might a team design and build the test harness BEFORE the code (test-first)?","o":[["It makes expected behaviour and interfaces clear early","Writing the test first makes you pin down what the code must do, and gives instant feedback once code exists."],["It removes the need for any later integration testing work","Unit-level tests do not check combinations of modules."],["It makes the production code run faster after release","Test order has no effect on runtime performance."],["It guarantees that the finished code has no defects","Testing shows presence, never absence, of defects."]],"id":"3rev05"},{"u":3,"t":"rev","d":"m","s":"145","q":"Executing code one statement at a time while watching variables and control flow is called:","o":[["Code stepping","This is the slide's definition of code stepping."],["Code inspection","Inspection is a formal peer review without execution."],["Static analysis","Static analysis examines code without running it."],["Pair programming","Pair programming is two developers working on the same code."]],"id":"3rev06"},{"u":3,"t":"rev","d":"m","s":"150","q":"Which activity had the HIGHEST average defect detection rate in the data shown?","o":[["Code inspections, 60%","Design inspections were 55%, code inspections 60%, integration testing 45% and unit testing 25%."],["Integration testing, 45%","This is below both kinds of inspection."],["Design inspections, 55%","This is close, but code inspections were higher."],["Unit testing, 25%","This was the lowest of the four."]],"id":"3rev07"},{"u":3,"t":"rev","d":"h","s":"150","q":"Eleven programs averaged 4.5 errors per 100 LOC without reviews and 0.82 with reviews. Roughly how large was the reduction?","o":[["82%","(4.5 - 0.82) / 4.5 = 0.818, so about 82%."],["18%","This is the share of errors REMAINING, since 0.82 / 4.5 is about 18%."],["90%","This is AT&T's reported decrease in defects."],["55%","This is the design inspection detection rate."]],"id":"3rev08"},{"u":3,"t":"rev","d":"m","s":"155","q":"\"Each change is reviewed before it is committed, with sign-off from a committer\" describes which review style?","o":[["Incremental","Incremental review is the common form for code reviews."],["Holistic","Holistic review looks at the goal, architecture or a whole component."],["Walkthrough","A walkthrough is a static testing technique and is not described this way."],["Acceptance","Acceptance is about customers accepting the system."]],"id":"3rev09"},{"u":3,"t":"rev","d":"h","s":"154","q":"In a holistic review, what must the author address afterwards?","o":[["All comments, including those never raised in the meeting","The slide says the author addresses all issues in comments, not just those raised in the meeting."],["Only the issues that were discussed at the meeting","This is exactly what the slide warns against."],["Only the issues marked as critical by the team lead","Severity helps order the work, but the slide asks the author to address all issues in comments."],["Nothing, since holistic reviews are advisory","The author is expected to respond to issues."]],"id":"3rev10"},{"u":3,"t":"rev","d":"h","s":"158","q":"Which comment best follows the principles for constructive code reviews?","o":[["\"This loop rescans the file on every call, which slows sign-up. Could we cache the count?\"","It is about the code, explains why, asks a question and suggests an improvement."],["\"You always write slow loops. Please be more careful with file access next time.\"","It criticises the coder, not the code."],["\"This is wrong. Rewrite the whole function before asking for a review again.\"","It gives no reason and no suggestion."],["\"Looks slow, but I guess it is fine for now, so I will approve this.\"","It neither explains the impact nor improves the code."]],"id":"3rev11"},{"u":3,"t":"rev","d":"h","s":"157","q":"A reviewer examines this login code. Which finding should be raised FIRST?","c":["if username == \"admin\" and password == \"123\":","    return True","for user in get_users():","    if user['name'] == username and user['pass'] == password:","        return True"],"o":[["Hard-coded admin password and plain-text comparison","\"Pick your battles\": a security hole like this triggers a \"Do Not Ship\" flag."],["The variable name user is too close to users","This is a naming nit, far less serious."],["The function lacks a comment on each line","Comment style is minor here."],["The loop could be replaced by any() for brevity","This is a stylistic choice."]],"id":"3rev12"},{"u":3,"t":"rev","d":"m","s":"156","q":"\"Does the code behave as the author likely intended?\" belongs to which checklist heading?","o":[["Functionality","Functionality asks whether the code behaves as intended."],["Design","Design asks whether the code is well designed and fits the system."],["Complexity","Complexity asks whether it could be simpler."],["Style","Style asks whether it follows the style guide."]],"id":"3rev13"},{"u":3,"t":"rev","d":"m","s":"152-153","q":"Which company practice is matched correctly?","o":[["Facebook: all submitted versions are kept so reviewers can compare","Reviewers can compare a change to the original or just to the last version they reviewed."],["Google: reviewers click \"Ship It!\" once concerns are addressed","\"Ship It!\" is from Yelp's use of Review Board."],["Yelp: the author or reviewer needs readability in the language","The readability rule is Google's."],["Facebook: an engineer's change is merged before any reviewer sees it","Changes are reviewed first, then merged."]],"id":"3rev14"},{"u":3,"t":"rev","d":"e","s":"149","q":"The \"winning lottery\" benefit of code review is that:","o":[["More than one person has seen every piece of code","If the author disappears, someone else still knows the code."],["Reviewers earn a bonus for each bug they find","No payment scheme is described."],["Authors no longer need to write documentation","Review is a forcing function FOR documentation."],["Junior developers are kept out of reviews","They are paired with experienced developers."]],"id":"3rev15"},{"u":3,"t":"rev","d":"m","s":"160","q":"Which element does the lecture ask for in a good pull request?","o":[["Context, rationale and alternatives considered","Along with a concise title, links to resources and screenshots for UI changes."],["A complete copy of the changed files in the body","The diff already shows the code."],["A promise that it works on the author's machine","\"It works on my machine\" is the joke on the bad-PR slide."],["A restriction on file types that reviewers may open","Reviewers need the full change. The advice is to help them with context, links and screenshots."]],"id":"3rev16"},{"u":3,"t":"arch","d":"m","s":"165","q":"In code archaeology, a \"working model\" of a system is an understanding of:","o":[["Its components and how they interact","Pieces (components) plus the connections between them."],["Every line of code in the repository","\"You will never understand the entire system!\""],["The commit history of its main author","History explains how code came to be. A working model describes how its parts behave now."],["Its test coverage and open bug counts","These measure quality. They do not tell you which components exist or how they connect."]],"id":"3arch01"},{"u":3,"t":"arch","d":"m","s":"167","q":"Which behaviour marks an EXPERT reading unfamiliar code?","o":[["Forming hypotheses and checking consequences","Experts work top down, recognise patterns, form hypotheses and check consequences."],["Reading line by line from the first file on","Listed as novice behaviour."],["Testing only the happy path","Listed as novice behaviour."],["Revisiting the same code again and again","Listed as novice behaviour."]],"id":"3arch02"},{"u":3,"t":"arch","d":"h","s":"174","q":"In the Probe/Understand/Edit table, what can you do with an OPEN-SOURCE binary running locally (not built by you)?","o":[["Probe and understand","Grey-box open source is P+U. You can read the source but have not built it, so no direct edit."],["Probe, understand and edit","P+U+E needs source code built locally (white-box)."],["Probe only","P alone is for closed-source local binaries."],["Understand only","U alone is for open-source apps running remotely."]],"id":"3arch03"},{"u":3,"t":"arch","d":"h","s":"174","q":"An open-source web service runs on someone else's server. Which capability does the table give you?","o":[["Understand only","You can read its source, but you cannot probe or edit the running remote instance."],["Probe only","P alone is for a closed-source binary on your machine."],["Probe and understand","P+U is for an open-source binary running locally."],["None of the three","That is the closed-source remote case (\"Talk to NSA\")."]],"id":"3arch04"},{"u":3,"t":"arch","d":"m","s":"173","q":"Why can you inspect the client side of a web app but not its server side?","o":[["Client code is downloaded and run in your browser","JavaScript source is sent to the browser, visible in dev tools. Server code runs remotely and only outputs are visible."],["Server code is always compiled to a binary","Much server code is interpreted. The issue is where it runs."],["Client code is always open source by law","Visibility is not the same as an open-source licence."],["HTTP requests are blocked on the server side","Servers receive HTTP requests; that is how they work."]],"id":"3arch05"},{"u":3,"t":"arch","d":"m","s":"179","q":"\"Delete debugging\" is listed in the lecture as a kind of:","o":[["Probe","Probes observe, control or lightly manipulate execution, such as print, logging, debuggers and delete debugging."],["Static analysis","Deleting code and rerunning it is dynamic."],["Documentation","It produces no documentation."],["Code review","It needs no reviewer."]],"id":"3arch06"},{"u":3,"t":"arch","d":"m","s":"178","q":"Which loop does the lecture give for dynamic information gathering?","o":[["Build, run, change, run again, compare","\"Build it. Run it. Change it. Run it again. How did the behaviour change?\""],["Read, comment, commit, push, then review","This is a commit flow."],["Plan, design, code, test, release","This is a whole software lifecycle, not the quick feedback loop used to probe unfamiliar code."],["Clone, lint, format, merge, deploy","This is a delivery pipeline. It never asks how a change altered the behaviour."]],"id":"3arch07"},{"u":3,"t":"arch","d":"h","s":"183-184","q":"Redis crashes on ZADD with huge sorted sets. Following the lecture, what is the right tracing order?","o":[["server.c command table, zaddCommand in t_zset.c, memory code","Start at how commands are mapped, move to the handler, then inspect allocation in insert and modify functions."],["zmalloc internals, then networking.c, then the command table","The advice is to start with the failing command and go inwards."],["config.c options, then rdb.c, then zaddCommand in t_zset.c","Configuration and persistence files are not on the path given."],["adlist.c lists, then ae.c events, then db.c key lookups","These are unrelated data and event files for this bug."]],"id":"3arch08"},{"u":3,"t":"arch","d":"m","s":"183","q":"Redis sorted sets are backed by which data structures, according to the walkthrough?","o":[["A skiplist and a dict","Both are named as the backing for sorted sets."],["A heap and a queue","Neither is mentioned."],["A B-tree and an array","Neither is mentioned."],["A linked list and a stack","Lists live in t_list.c and are a different type."]],"id":"3arch09"},{"u":3,"t":"arch","d":"m","s":"185","q":"Which tool does the walkthrough pair with a debug build of Redis for memory checks?","o":[["valgrind","Build with debug flags and use valgrind."],["grep","Useful for searching, but it does not check memory."],["Wireshark","It captures network packets."],["SonarQube","It is shown for automated code review."]],"id":"3arch10"},{"u":3,"t":"arch","d":"e","s":"180","q":"When documenting findings about a codebase, the lecture advises including:","o":[["Negative results too","\"Include negative results, too!\" saves others from repeating dead ends."],["Only confirmed bugs","Dead ends are useful as well."],["Only public API names","Nothing limits documentation to APIs."],["Only code you wrote yourself","The whole point is documenting code you did not write."]],"id":"3arch11"},{"u":3,"t":"stat","d":"e","s":"140","q":"Static analysis is best described as:","o":[["Examining source code without running it","It is done automatically on the source, and is treated as a form of white-box testing."],["Running code under a debugger with test data","Debugging runs the program, so it is dynamic analysis."],["Scanning a live application for vulnerabilities","The slide calls that dynamic, black-box scanning."],["Measuring how fast code runs under load","That is performance testing."]],"id":"3stat01"},{"u":3,"t":"stat","d":"m","s":"191","q":"Why can a static analyser not decide, in general, whether a loop terminates?","o":[["It would mean solving the halting problem","Reasoning about termination is impossible in general."],["Loops are removed before analysis starts","Analysers do consider loops."],["Type information is lost inside nested loops","Types remain available in loops."],["Loop bounds are always set by the user","Many are constants, and the limit is theoretical."]],"id":"3stat02"},{"u":3,"t":"stat","d":"m","s":"192","q":"An analyser reports that an index \"MAY be out of bounds\". Why does it say MAY?","o":[["It approximates values conservatively","Exact values are hard, so conservative abstraction over-approximates and can only say maybe."],["It ran the code once and saw one failure","Static analysis does not run the code."],["It found a syntax error it could not parse","A syntax error would be reported as such."],["It only checks code style and formatting","That would be a linter."]],"id":"3stat03"},{"u":3,"t":"stat","d":"h","s":"195","q":"Which call makes this function loop forever?","c":["def n2s(n: int, b: int):","    if n <= 0: return '0'","    r = ''","    while n > 0:","        u = n % b","        if u >= 10: u = chr(ord('A') + u - 10)","        n = n // b","        r = str(u) + r","    return r"],"o":[["n2s(5, 1)","n // 1 is n, so n never shrinks and the loop never ends."],["n2s(5, 0)","5 % 0 raises ZeroDivisionError at once."],["n2s(0, 1)","n <= 0 returns '0' before the loop."],["n2s(255, 16)","This returns 'FF' normally."]],"id":"3stat04"},{"u":3,"t":"stat","d":"h","s":"195","q":"This loop runs while n > 0, adding each digit u to r. When can r contain a minus sign?","c":["u = n % b","if u >= 10: u = chr(ord('A') + u - 10)","n = n // b","r = str(u) + r"],"o":[["When b is negative, since Python's % takes the divisor's sign","For example 5 % -2 is -1, so u is negative and str(u) is \"-1\"."],["When n is negative, since the loop then runs on negatives","n <= 0 returns '0' first."],["When b is larger than n, since u then goes below zero","With a positive b, u is simply n."],["Never, since the remainder of a division is non-negative","True for a positive b only. Python's remainder follows the divisor's sign."]],"id":"3stat05"},{"u":3,"t":"stat","d":"m","s":"195","q":"What can a static analyser say about the type of u in n2s?","c":["u = n % b","if u >= 10:","    u = chr(ord('A') + u - 10)"],"o":[["It is int or str, depending on the path taken","u starts as an int and may be reassigned a str, so the analyser must report both."],["It is always int, since n and b are ints","The chr() assignment makes it a str on one path."],["It is always str, since r is a str","r is built from str(u), which says nothing about u."],["It has no type until the program is run","The set of possible types can be computed statically."]],"id":"3stat06"},{"u":3,"t":"stat","d":"m","s":"198","q":"Analysing only the changed lines of a pull request is called:","o":[["Diff-based analysis","The slide calls diff-based even better than whole-codebase analysis in CI."],["Data-flow analysis","That tracks values through a program."],["Pattern-based analysis","That matches known bug patterns."],["Mutation analysis","That changes code to assess tests."]],"id":"3stat07"},{"u":3,"t":"stat","d":"m","s":"198","q":"Why should a static analysis tool keep false positives low?","o":[["Developers start ignoring its warnings","Once warnings are ignored, quality declines."],["It would otherwise fail to compile the code","Analysers do not compile the product."],["Each false positive deletes a true positive","They are independent."],["Linters are not allowed to report any","Linters can report false positives too. The concern is that people stop trusting any noisy tool."]],"id":"3stat08"},{"u":3,"t":"stat","d":"m","s":"199","q":"A tool checks that a @NonNull parameter is never passed a nullable value. Which class of tool is it?","o":[["Type-annotation validator","It checks conformance to user-defined types such as Nullable."],["Linter","A linter does shallow style checks."],["Pattern-based bug detector","These use simple syntax or API rules."],["Profiler","A profiler measures running code."]],"id":"3stat09"},{"u":3,"t":"stat","d":"m","s":"199","q":"\"Can this array index be out of bounds?\" is best answered by:","o":[["Data-flow analysis or abstract interpretation","This deep analysis finds complex error conditions."],["A linter enforcing naming conventions","This is shallow syntax only."],["A type checker that looks only at signatures","It never looks inside implementations."],["A formatter that fixes indentation","This changes layout only."]],"id":"3stat10"},{"u":3,"t":"stat","d":"m","s":"200","q":"What is the lecture's advice on style checks?","o":[["Let linters enforce them, not reviewers","\"Don't rely on manual inspection during code review!\""],["Leave them until after the release","Style affects how easily code is read from day one."],["Let the most senior reviewer enforce them","This is exactly the manual effort to avoid."],["Skip them, since compilers ignore style","Readers do not ignore style, and most time goes into reading."]],"id":"3stat11"},{"u":3,"t":"stat","d":"h","s":"205","q":"A type-based checker misses a bug inside a method that is called. Which limitation explains this?","o":[["It looks at signatures and annotations, not implementations","It does not look at the implementation of methods being called."],["It only ever runs after the program has been deployed","It is static and runs before deployment."],["It can analyse only dynamically generated code","Dynamically generated code is what it handles badly."],["It never produces any false positives","It can produce them, and that would not explain a miss."]],"id":"3stat12"},{"u":3,"t":"stat","d":"m","s":"204","q":"The Mars Climate Orbiter appears in the type-annotation section because:","o":[["Unit types could have flagged newtons vs pound-force","A mismatch between metric and imperial force units caused the loss. Types for units catch this."],["Its code had a null dereference on landing","The cause was a unit mismatch."],["Its linter had been switched off before launch","A linter checks style and would not know newtons from pound-force."],["It overflowed a 16-bit integer","That was Ariane 5."]],"id":"3stat13"},{"u":3,"t":"stat","d":"h","s":"208","q":"Which statement about static vs dynamic analysis is correct?","o":[["Static may give false positives; dynamic may give false negatives","Static reasons conservatively over all paths. Dynamic sees only the executions you run."],["Static may give false negatives only; dynamic gives false positives","Dynamic problems are real, since they are observed with a witness input."],["Both need a successful build and good test inputs","Static needs only source code."],["Static observes single executions; dynamic covers all paths","This is reversed. Dynamic analysis observes single runs; static analysis reasons over all paths."]],"id":"3stat14"},{"u":3,"t":"stat","d":"h","s":"215-216","q":"What happens in this code when maxlen is 0?","c":["void copy_string(char *dest, const char *src, int maxlen) {","  strncpy(dest, src, maxlen);","  dest[maxlen - 1] = '\\0';","}"],"o":[["It writes to dest[-1], outside the buffer","maxlen - 1 is -1. The missing check for maxlen <= 0 is one of the listed issues."],["It safely copies nothing and returns","strncpy copies nothing, but the next line still writes."],["It copies the whole of src into dest","A length of 0 copies no characters."],["It raises an exception that the caller catches","C has no exceptions, so an out-of-bounds write silently corrupts memory."]],"id":"3stat15"},{"u":3,"t":"stat","d":"h","s":"227","q":"What does this function return for a = \"ab\", b = \"cd\", out_size = 5?","c":["if (strlen(a) + strlen(b) + 1 >= out_size) return -2;","snprintf(out, out_size, \"%s%s\", a, b);","return 0;"],"o":[["-2, though \"abcd\" would fit in 5 bytes","2 + 2 + 1 = 5 and 5 >= 5 is true. \"abcd\" plus the null is exactly 5 bytes, so the check is one byte too strict."],["0, with \"abcd\" written to out","This would need > in place of >=."],["0, with \"abc\" written because snprintf truncates","The early return happens before snprintf."],["-1, since out_size is too small","-1 is for null pointers or a size of 0."]],"id":"3stat16"},{"u":3,"t":"stat","d":"m","s":"223-225","q":"Which change best removes the command injection risk?","c":["sprintf(command, \"rm -f %s\", filename);","system(command);"],"o":[["Call unlink(filename) directly","No shell is involved, so metacharacters have no effect."],["Enlarge command to 1024 bytes","This helps the overflow only, not injection."],["Print the command before running it","Logging does not stop the attack."],["Use strcat in place of sprintf","The string still goes to a shell."]],"id":"3stat17"},{"u":3,"t":"stat","d":"m","s":"219-220","q":"Which issue does this function have?","c":["strcat(first_name, \" \");","strcat(first_name, last_name);"],"o":[["It modifies its input and may overflow the buffer","strcat writes into the caller's first_name with no size check."],["It leaks memory by allocating a new string","Nothing is allocated."],["It returns a pointer to a local variable","The function has no return value at all. It changes first_name in place."],["It executes shell commands taken from the user","No shell call is made."]],"id":"3stat18"},{"u":3,"t":"stat","d":"h","s":"235","q":"What does the improved function return for [2, -2]?","c":["def normalize_scores(scores):","    if not scores or sum(scores) == 0:","        return []","    return [s / sum(scores) for s in scores]"],"o":[["[]","The sum is 0, so the guard returns an empty list and avoids ZeroDivisionError."],["[1.0, -1.0]","This would need a non-zero total."],["ZeroDivisionError","This is what the ORIGINAL version does."],["[2, -2], changed in place","The improved version never changes its input."]],"id":"3stat19"},{"u":3,"t":"stat","d":"m","s":"218","q":"Which incident does the lecture link to poor error signalling?","o":[["Apple \"goto fail\"","Listed next to Heartbleed, with poor error signalling as the cause."],["Heartbleed","That was an unchecked length leading to an information leak."],["Shellshock","That is listed under command injection."],["Microsoft GDI corruption","That is listed under the mutation and buffer example."]],"id":"3stat20"},{"u":3,"t":"stat","d":"m","s":"207","q":"A team wants tricky, deep bugs found and accepts high cost and some expertise. Which tool type fits?","o":[["Deep analysis tools","They find tricky issues but can be costly and need some awareness of the analysis."],["Linters","These are fast and cheap but shallow."],["Pattern-based detectors","Intuitive, but limited to known patterns."],["Formatters","These only alter layout."]],"id":"3stat21"},{"u":3,"t":"cicd","d":"e","s":"246","q":"What is the lecture's approach to everything that happens after code is written?","o":[["Automate what we can, review what we cannot","This is the exact approach on the slide. Problems that can't be automated go to code review."],["Review what we can, automate what we cannot","Automation comes first."],["Test by hand first, automate after release","The slide says none of the tasks should be manual."],["Deploy first, then fix what users report","CI exists to catch mistakes before shipping."]],"id":"3cicd01"},{"u":3,"t":"cicd","d":"e","s":"247","q":"What is the order of stages in the basic CI/CD pipeline overview?","o":[["Code edit, tests run, code merged, code deployed","The diagram runs in exactly this order."],["Code edit, code merged, tests run, code deployed","Tests run before the merge."],["Tests run, code edit, code deployed, code merged","You cannot test an edit before making it."],["Code edit, code deployed, tests run, code merged","Deployment is the last stage, after tests pass and the code is merged."]],"id":"3cicd02"},{"u":3,"t":"cicd","d":"m","s":"249","q":"\"Integrate often\" in 1999 came from which source?","o":[["Extreme Programming","XP's rule from 1999. Martin Fowler's CI blog followed in 2000."],["Hudson, later Jenkins","Hudson/Jenkins dates from 2005."],["Travis CI's blog","Travis CI dates from 2011."],["GitHub Actions","GitHub Actions dates from 2019."]],"id":"3cicd03"},{"u":3,"t":"cicd","d":"h","s":"257","q":"Tasks: B needs A; C needs A; D needs B and C; E needs D. Which is a valid build order?","o":[["A, C, B, D, E","A has indegree 0. B and C are free in either order after A, then D, then E."],["A, B, D, C, E","D needs C, which has not been built yet."],["B, A, C, D, E","B depends on A, so B cannot be built first."],["A, B, C, E, D","E depends on D, so E cannot come before D."]],"id":"3cicd04"},{"u":3,"t":"cicd","d":"h","s":"257","q":"Tasks: B needs A; C needs A; D needs B and C; E needs D. What is D's indegree at the start?","o":[["2","Indegree counts incoming edges, and D depends on B and C."],["0","Only A has indegree 0."],["1","E has indegree 1 (from D)."],["3","A is an indirect dependency, so it adds no edge into D."]],"id":"3cicd05"},{"u":3,"t":"cicd","d":"h","s":"257","q":"A build tool reports that it cannot order the tasks at all. What must be true of the dependency graph?","o":[["It contains a cycle","Topological sort needs a directed ACYCLIC graph. A cycle means no task in it can go first."],["It contains two tasks with indegree 0","Several free tasks are fine and can run in parallel."],["It contains a task no one depends on","Final artifacts are normally like this."],["It has more edges than nodes","A DAG can have many more edges than nodes."]],"id":"3cicd06"},{"u":3,"t":"cicd","d":"m","s":"254","q":"A good build system recompiles:","o":[["Only what is needed","\"Compile only what is needed\" gives efficiency."],["Everything, on each commit","This wastes time on large systems."],["Only files that failed before","Changed files matter, whether or not they failed earlier."],["Only external libraries","Your own changed code has to be rebuilt too."]],"id":"3cicd07"},{"u":3,"t":"cicd","d":"m","s":"258","q":"Which situation is listed as a DISADVANTAGE of continuous integration?","o":[["Development and target platforms differ","System tests may then be impossible in the developer's private workspace."],["Problems between developers are found too early","Early discovery is the advantage."],["The mainline holds the definitive working system","This is an advantage."],["Change sets become small and incremental","Small, incremental change sets are listed among the benefits of CI."]],"id":"3cicd08"},{"u":3,"t":"cicd","d":"h","s":"268-270","q":"Every commit that passes tests reaches a staging area ready to ship, but a manager clicks \"Release\" on Fridays. Which practice is this?","o":[["Continuous delivery","The build is always ready, but release needs a trigger."],["Continuous deployment","That pushes validated changes to production immediately and autonomously."],["Continuous integration only","CI ends with a merged, built and tested mainline; here it is ready to ship as well."],["Continuous testing only","Testing is one part; this pipeline goes on to delivery."]],"id":"3cicd09"},{"u":3,"t":"cicd","d":"h","s":"270","q":"Which organisation, per the slides, typically uses continuous deployment?","o":[["A highly mature DevOps team","The slide says it is typically used in highly mature DevOps teams."],["A team that is just starting with version control","It needs strong automation and testing first."],["A team with a separate approval board for releases","Approval gates contradict autonomous deployment."],["A team with mostly manual testing","It relies on automated-test-validated products."]],"id":"3cicd10"},{"u":3,"t":"cicd","d":"m","s":"267","q":"Checking that a new executable compiles fully, resolves dependencies and starts is:","o":[["Sanity testing","The executable is run with some sanity tests to confirm it is in an executable state."],["Soak testing","That applies load for a long time."],["Regression testing","That checks that old features still work."],["Acceptance testing","That is done by customers."]],"id":"3cicd11"},{"u":3,"t":"cicd","d":"m","s":"269","q":"What is the entry criterion for continuous testing by the QE group?","o":[["Successful unit and integration tests","The slide says so directly."],["A signed release note from the client","Client sign-off belongs to acceptance. QE testing starts when unit and integration tests have passed."],["A completed soak test in production","This comes much later, at release milestones."],["An approved change request
