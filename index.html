 form","This belongs to change management."]],"id":"3cicd12"},{"u":3,"t":"cicd","d":"m","s":"271-272","q":"Which contrast between Agile and DevOps matches the comparison tables?","o":[["Agile targets software development; DevOps targets end-to-end delivery","DevOps gives end-to-end business solutions and fast delivery."],["Agile stresses automation; DevOps does not emphasise it","The primary goal of DevOps is automation. Agile does not emphasise it."],["Agile uses large teams; DevOps uses small ones","Agile has small teams; DevOps involves all the stakeholders."],["Agile relies on internal feedback; DevOps on customer feedback","The table says the opposite."]],"id":"3cicd13"},{"u":3,"t":"cicd","d":"m","s":"272","q":"In the comparison table, DevOps and Agile team skills differ in that:","o":[["DevOps spreads skills across dev and ops; Agile members have similar skills","DevOps divides the skillset between teams; in Agile everyone has similar and equal skills."],["DevOps needs only operations skills; Agile needs only coding skills","DevOps covers both groups."],["DevOps members have equal skills; Agile splits skills between teams","This is reversed. Equal skills describe Agile; split skills describe DevOps."],["Both need the same skills in every member","The table lists a difference."]],"id":"3cicd14"},{"u":3,"t":"cicd","d":"m","s":"274","q":"\"Theory of Mind\" in the collaboration pillar means:","o":[["Recognising that others hold different views","You recognise your own perspective and understand that others' come from their own context."],["Knowing which tool each team mate prefers to use","Tools are a separate pillar."],["Predicting how long a colleague's task will take","That is estimation. Theory of Mind is about other people's perspectives."],["Assigning hierarchy levels within a team","Effective teams de-emphasise hierarchy."]],"id":"3cicd15"},{"u":3,"t":"cicd","d":"m","s":"275","q":"Which factor is used to MEASURE affinity?","o":[["Reciprocity of support","Shared time, intensity of relationships, reciprocity of shared stories and of support are the measures."],["Lines of code per developer","This is a productivity metric."],["Number of servers provisioned","This is infrastructure."],["Code coverage percentage","This is a test metric."]],"id":"3cicd16"},{"u":3,"t":"cicd","d":"m","s":"276","q":"What effect do POOR tools have, according to the tools pillar?","o":[["They raise the cost of collaboration","Not investing in tools, or investing in poor ones, raises the cost."],["They have no effect if culture is good","Tools are an accelerator that affects acceptance of the culture."],["They remove the need for affinity","The pillars work together."],["They force a team to shrink","Team size belongs to scaling."]],"id":"3cicd17"},{"u":3,"t":"cicd","d":"m","s":"277","q":"Which situation does the scaling pillar cover?","o":[["Growing, maturing and even shrinking","It covers organisations as they grow, mature and even shrink."],["Adding servers and network capacity","Infrastructure is one part among organisation, teams, complexity and workload."],["Hiring and training more developers","Retention and outsourcing are included as well."],["Growing only, up to a fixed limit","Shrinking is named explicitly."]],"id":"3cicd18"},{"u":3,"t":"cicd","d":"m","s":"278","q":"Which tool group is matched correctly in the DevOps tools table?","o":[["Configuration management: Puppet, SaltStack, Chef","This is the row in the table."],["Monitoring: Jenkins, Ant, Maven","These are in continuous integration."],["Continuous integration: Nagios, Zabbix, Sensu","These are monitoring tools."],["Infrastructure automation: Git, CVS, Subversion","These are revision control."]],"id":"3cicd19"},{"u":3,"t":"cicd","d":"m","s":"280","q":"The DevSecOps motto and the responsibility model it supports are:","o":[["\"Software, safer, sooner\", with shared responsibility","Security is shared by development, security and IT operations."],["\"Secure last\", with a dedicated security silo in charge","A silo at the end is the old approach."],["\"Move fast\", with operations owning security","No single group owns it."],["\"Trust the pipeline\", with QA owning security","DevSecOps makes security a shared responsibility, so QA does not own it alone."]],"id":"3cicd20"},{"u":3,"t":"cicd","d":"h","s":"283","q":"A DevSecOps pipeline breaks every time one scanner goes down. How do the slides describe this?","o":[["A brittle pipeline, from badly configured checks","Improperly configured security testing can make pipelines brittle when a part goes down."],["A shifted-left pipeline, from testing too early","Testing early is the goal."],["A scaled pipeline, from adding too many developers","Scaling is a benefit of automated policy."],["A siloed pipeline, from separating dev and ops","Silos are what DevOps removes."]],"id":"3cicd21"},{"u":3,"t":"cicd","d":"m","s":"282","q":"Shortening the time between detecting and fixing a vulnerability gives which benefit?","o":[["A smaller window of attack opportunity","Attackers have less time to gain access."],["A larger set of security findings","The number of findings is not changed."],["A longer software lifecycle","The goal is not to slow things down."],["A lower count of developers needed","Headcount is not a listed benefit."]],"id":"3cicd22"},{"u":3,"t":"cicd","d":"h","s":"256","q":"In the Event Manager build, which task may run in PARALLEL with the others?","o":[["Static analysis","The slide says static analysis can run in parallel. It needs neither the database nor a running app."],["Running the app before database setup","Database setup must come first."],["Executing tests before dependencies","Dependencies must come before tests."],["Deploying before the tests finish","This would ship untested code."]],"id":"3cicd23"},{"u":3,"t":"test","d":"m","s":"291","q":"Disney+ had problems on launch day mainly because:","o":[["The load hit paths other than the one they tested","The stress was on account creation, logins and browsing old titles."],["They had not expected any spike in traffic at all","They had planned for a spike."],["They never tested concurrent streaming","They tested massive concurrent streaming."],["Their licence for old titles had expired","The outage came from load on sign-up, login and browsing. Browsing old titles was slow, not unlicensed."]],"id":"3test01"},{"u":3,"t":"test","d":"m","s":"292","q":"1,000 tests pass. Which conclusion is justified?","o":[["Those 1,000 cases behave as expected","Testing shows the presence, never the absence, of defects."],["The program has no defects left","No number of passing tests proves this."],["The program meets users' real needs","That is validation, which spec-based tests may not show."],["The remaining risk is under 0.1%","A pass count gives no probability of remaining defects, since the 1,000 tests may miss whole areas."]],"id":"3test02"},{"u":3,"t":"test","d":"h","s":"298","q":"A payroll system matches its specification exactly, but staff find it unusable. Which is true?","o":[["It passed verification but failed validation","Verification: built right against the spec. Validation: the right thing for users."],["It passed validation but failed verification","Users are unhappy, so validation failed."],["It failed both verification and validation","It matches the specification, so verification passed."],["It passed both, so the users are mistaken","Unmet real needs are a validation failure."]],"id":"3test03"},{"u":3,"t":"test","d":"m","s":"295","q":"Finding that 15 of 100 modules hold most bugs illustrates which principle, and how is it used?","o":[["Defect clustering; focus test effort on those modules","10-20% of modules hold about 80% of bugs, a heuristic for focusing effort."],["Pesticide paradox; rerun the same tests on those modules","The paradox says repeated tests lose value."],["Exhaustive testing; test every input of those modules","Exhaustive testing is impossible."],["Context dependence; test those modules like a pacemaker","Context is about risk of the product."]],"id":"3test04"},{"u":3,"t":"test","d":"m","s":"296","q":"Which action directly counters the pesticide paradox?","o":[["Adding variation to the test suite","Rerunning the same suite on a changing program gives a false sense of security."],["Running the same suite more often","This is what causes the paradox."],["Deleting tests that pass","This loses regression protection."],["Testing only after release","This violates early testing."]],"id":"3test05"},{"u":3,"t":"test","d":"m","s":"297","q":"Testing a pacemaker much more rigorously than a food app reflects the principle that testing is:","o":[["Context dependent","Risk and consequences differ."],["Exhaustive","Exhaustive testing is impossible for both."],["Always early","Early testing applies to both."],["Independent of risk","Risk is exactly what drives the difference."]],"id":"3test06"},{"u":3,"t":"test","d":"h","s":"307","q":"A field accepts ages 2 to 17. Which set is the standard BVA selection of VALID values from the slides?","o":[["2, 3, 10, 16, 17","Minimum, min+1, a middle value, max-1 and maximum."],["1, 2, 10, 17, 18","1 and 18 are min-1 and max+1, which are invalid values."],["2, 5, 8, 11, 17","Evenly spread values miss min+1 and max-1."],["0, 1, 2, 17, 18","Three of these are invalid."]],"id":"3test07"},{"u":3,"t":"test","d":"h","s":"303","q":"Using these bus fare rules, what does a 30-year-old pay for a 20-minute ride on Tuesday at 8 am (not a holiday)?","c":["- Under 2: free. Under 18 or over 65: half fare. Others: $3.","- Weekdays 7-9am and 4-6pm: peak surcharge $1.5.","- Weekends: flat $2 for all riders except under 2.","- Trips under 5 min off-peak are free, except on weekends.","- Public holiday: $2 surcharge, ignoring other surcharges and the flat rate."],"o":[["$4.50","Full fare $3 plus the weekday peak surcharge of $1.50."],["$3.00","This leaves out the peak surcharge."],["$5.00","This uses the $2 holiday surcharge in place of $1.50."],["$2.00","This is the weekend flat rate."]],"id":"3test08"},{"u":3,"t":"test","d":"h","s":"303","q":"Using these bus fare rules, what does a 70-year-old pay for a 20-minute ride on a SATURDAY that is a public holiday?","c":["- Under 2: free. Under 18 or over 65: half fare. Others: $3.","- Weekdays 7-9am and 4-6pm: peak surcharge $1.5.","- Weekends: flat $2 for all riders except under 2.","- Trips under 5 min off-peak are free, except on weekends.","- Public holiday: $2 surcharge, ignoring other surcharges and the flat rate."],"o":[["$3.50","Half fare $1.50 plus the $2 holiday surcharge. The weekend flat rate is ignored on a public holiday."],["$2.00","The flat rate does not apply on a public holiday."],["$4.00","This adds the flat rate and the holiday surcharge."],["$5.00","This charges the full fare to a senior."]],"id":"3test09"},{"u":3,"t":"test","d":"h","s":"303","q":"Using these bus fare rules, a 40-year-old takes a 3-minute ride on SUNDAY at noon (not a holiday). What is the fare?","c":["- Under 2: free. Under 18 or over 65: half fare. Others: $3.","- Weekdays 7-9am and 4-6pm: peak surcharge $1.5.","- Weekends: flat $2 for all riders except under 2.","- Trips under 5 min off-peak are free, except on weekends.","- Public holiday: $2 surcharge, ignoring other surcharges and the flat rate."],"o":[["$2.00","The short-trip rule does not apply on weekends, so the flat rate is charged."],["$0.00","The free short trip rule excludes weekends."],["$3.00","The flat rate replaces the full fare at weekends."],["$1.50","No half fare applies at age 40."]],"id":"3test10"},{"u":3,"t":"test","d":"m","s":"308","q":"For the bus fare function, which set of ages covers each age equivalence class exactly once?","o":[["1, 10, 40, 70","The classes are under 2, 2 to 17, 18 to 65, and over 65."],["1, 2, 17, 18","2 and 17 are the same class, and over 65 is missing."],["5, 12, 30, 60","Under 2 and over 65 are missing."],["18, 40, 65, 66","18, 40 and 65 share one class."]],"id":"3test11"},{"u":3,"t":"test","d":"m","s":"309","q":"\"Adults on long trips during public holidays that fall on weekends\" is which kind of interaction?","o":[["4-way","Age, trip duration, public holiday and weekend are four parameters."],["Pairwise","Seniors travelling on weekends is the pairwise example."],["3-way","Seniors on weekends in peak hours is the 3-way example."],["Single-factor","Four conditions must hold together."]],"id":"3test12"},{"u":3,"t":"test","d":"h","s":"309","q":"Parameters have 3, 3 and 2 values. Exhaustive testing needs 18 cases. What is the LEAST number that can cover all pairs?","o":[["9","The two 3-valued parameters alone have 9 pairs, each needing its own test. The third can be fitted into those 9."],["6","6 tests cannot cover 9 pairs of the first two parameters."],["8","This is the sum of values, not the number of pairs."],["18","This is the exhaustive count."]],"id":"3test13"},{"u":3,"t":"test","d":"m","s":"302","q":"Which is an ADVANTAGE of specification-based testing?","o":[["Tests can be written before the implementation","It also avoids implementation bias and needs no familiarity with the code."],["Tests reach every internal branch","It knows nothing about internal branches."],["Tests must change whenever the code changes","It is robust to implementation changes."],["Tests need access to the source code","It does not need the code."]],"id":"3test14"},{"u":3,"t":"test","d":"m","s":"311","q":"In the V-model shown, which plan links architectural design to the testing side?","o":[["Integration test plan","Architectural design pairs with integration testing."],["Unit test plan","This pairs low-level design with unit testing."],["System validation plan","This pairs requirements analysis with system testing."],["Regression test plan","Regression testing reruns old tests after changes. It is not paired with a design stage in the V-model."]],"id":"3test15"},{"u":3,"t":"test","d":"m","s":"315","q":"A test that pushes a form with ever larger inputs to see what it can handle before it breaks is:","o":[["Destructive","Destructive tests cover what the software can handle before it breaks."],["Positive","Positive tests confirm it does what it should."],["Negative","Negative tests confirm it does not do what it should not."],["Usability","Usability is a quality being tested. The three types listed are positive, negative and destructive."]],"id":"3test16"},{"u":3,"t":"test","d":"m","s":"317","q":"Which are the three states of a test suite?","o":[["Active, in-progress, completed","These are the three listed."],["New, assigned, then closed","These are bug statuses."],["Draft, review, then approved","These are states of a document under review. A suite is active, in progress or completed."],["Pass, fail, blocked","These are results of a test run."]],"id":"3test17"},{"u":3,"t":"test","d":"e","s":"318","q":"Software reliability is the probability of:","o":[["Failure-free operation for a given time and environment","Time period and environment are both part of the definition."],["Finding all of the defects before the final release","Testing cannot give this."],["Finishing the project on schedule and within budget","This is project predictability."],["Passing every test in the suite","A pass rate is not reliability."]],"id":"3test18"},{"u":3,"t":"test","d":"m","s":"305","q":"A good test suite must balance which two needs?","o":[["Small enough to finish, large enough to validate","The key problem in choosing a test suite."],["Cheap to write, and impossible to rerun","Reusability is a goal."],["Large enough to be exhaustive, yet random","Exhaustive testing is impractical."],["Transparent to testers, yet hidden from developers","Who can see the tests is a team choice. The slide's balance is between run time and validation value."]],"id":"3test19"},{"u":3,"t":"insp","d":"e","s":"324","q":"Inspections and testing differ in that inspections are:","o":[["Static verification; testing is dynamic verification","Inspections analyse the static representation. Testing exercises the product."],["Dynamic verification; testing is static verification","This is reversed. Inspection is static because nothing is executed."],["Done only on code; testing is done on documents","Inspections apply to any representation, while testing needs something to execute."],["Done by tools only; testing is done by people only","People do inspections, and tests can be automated."]],"id":"3insp01"},{"u":3,"t":"insp","d":"m","s":"325","q":"In the inspections and testing diagram, testing (unlike inspection) can be applied ONLY to:","o":[["The system prototype and the program","Testing needs something executable."],["The requirements specification and program","Requirements can only be inspected."],["UML design models and database schemas","These can only be inspected."],["Software architecture and the prototype","Architecture can only be inspected."]],"id":"3insp02"},{"u":3,"t":"insp","d":"h","s":"327","q":"One bug's bad output hides a second bug during testing. Why does inspection avoid this problem?","o":[["It is static, so errors do not interact","With no execution, one error cannot mask another."],["It is done by a separate release team","Who does it makes no difference to masking."],["It fixes each error before reading on","Inspection records errors; it does not fix them in turn."],["It runs the program more slowly than tests","Inspection does not run the program."]],"id":"3insp03"},{"u":3,"t":"insp","d":"m","s":"327","q":"Why can an INCOMPLETE program be inspected cheaply but not tested cheaply?","o":[["Testing it needs special harnesses for available parts","Inspection of incomplete versions has no additional cost."],["Testing tools refuse to compile partial programs","They can be compiled with scaffolding, which is what costs extra."],["Inspection ignores the missing modules' interfaces","Interfaces can still be reviewed."],["Testing is allowed only after the release date","Testing takes place throughout."]],"id":"3insp04"},{"u":3,"t":"insp","d":"m","s":"330","q":"What should COMPONENT testing focus on?","o":[["Component interfaces","Several units are integrated, so the interface is the focus."],["Functionality of individual methods","This is unit testing."],["Interactions between components","This is system testing."],["The customer's working environment","This is user testing."]],"id":"3insp05"},{"u":3,"t":"insp","d":"h","s":"332","q":"Why does inheritance make object class tests harder to design?","o":[["The information to be tested is not localised","Behaviour is spread over parent classes."],["Child classes cannot be created in a test","They can be created like any class."],["Inherited methods are skipped at run time","They are executed normally."],["Parent classes must be tested in production","Parent classes can be tested anywhere. The difficulty is that behaviour is spread across the hierarchy."]],"id":"3insp06"},{"u":3,"t":"insp","d":"m","s":"332","q":"Complete test coverage of a class includes testing all operations, all attributes and:","o":[["All possible states of the object","The object must be exercised in all possible states."],["All possible subclasses in the system","Subclasses are separate classes."],["All callers of the class","Callers belong to integration tests. Class coverage looks at operations, attributes and states."],["All versions in the repository","Older versions are covered by regression history, not by class coverage."]],"id":"3insp07"},{"u":3,"t":"insp","d":"h","s":"336","q":"A caller assumes a search routine needs an unordered array, but it needs a sorted one. This error is:","o":[["Interface misunderstanding","The caller embeds wrong assumptions about the called component's behaviour."],["Interface misuse by caller","Misuse is an error in using the interface, such as swapped parameters."],["Timing error in interface","Timing needs components working at different speeds."],["Shared memory error","Shared memory is a type of interface, not one of the error classes."]],"id":"3insp08"},{"u":3,"t":"insp","d":"h","s":"336","q":"A producer updates shared data every 10 ms while a consumer reads every 50 ms and acts on stale values. This error is:","o":[["Timing error","Components run at different speeds, so out-of-date information is accessed."],["Interface misuse","No call was made with bad parameters."],["Interface misunderstanding","No wrong assumption about behaviour is described."],["Parameter error","Data is not being passed as a parameter."]],"id":"3insp09"},{"u":3,"t":"insp","d":"m","s":"336","q":"Calling transfer(to, from) when the signature is transfer(from, to) is:","o":[["Interface misuse","Parameters in the wrong order is the slide's example."],["Interface misunderstanding","That is about wrong assumptions on behaviour."],["Timing error","Nothing depends on speed."],["Emergent behaviour","That appears in whole systems."]],"id":"3insp10"},{"u":3,"t":"insp","d":"m","s":"335","q":"One sub-system requests a service from another by sending it a request. Which interface type is it?","o":[["Message passing","Sub-systems request services from other sub-systems."],["Parameter","Data is passed from one method to another."],["Shared memory","A block of memory is shared."],["Procedural","A sub-system encapsulates procedures to be called by others."]],"id":"3insp11"},{"u":3,"t":"insp","d":"m","s":"337","q":"For a SHARED MEMORY system, the interface testing guidelines advise:","o":[["Varying the order of component activation","This exposes hidden ordering assumptions."],["Passing null pointers to every parameter","This is advised for pointer parameters."],["Stress testing with many messages","This is advised for message passing."],["Testing parameters at their extreme ends","This is advised for called procedures."]],"id":"3insp12"},{"u":3,"t":"insp","d":"m","s":"338","q":"Behaviour that appears only when components work together is tested in:","o":[["System testing","System testing tests the emergent behaviour of a system."],["Unit testing","Units are tested in isolation."],["Static testing","Static testing executes nothing, so behaviour that emerges at run time cannot appear."],["Inspection","Inspection reads documents or code, so run-time interactions never take place."]],"id":"3insp13"},{"u":3,"t":"insp","d":"m","s":"340","q":"In automated regression testing, when must the tests pass?","o":[["Before the change is committed","All tests are rerun on every change and must pass before the commit."],["After the release is accepted","By then the broken code is already in the product. The tests run at every change, before the commit."],["Once at the end of each year","Tests are rerun at every change."],["Only when a customer reports a bug","Every change triggers them."]],"id":"3insp14"},{"u":3,"t":"insp","d":"m","s":"346","q":"The primary goal of release testing is to:","o":[["Convince the supplier that it is good enough for use","It shows the specified functionality, performance and dependability."],["Find as many defects as possible during development","This is defect testing by the development team."],["Let users explore the system at home","This is beta testing."],["Measure the code coverage of unit tests","Release testing is black-box."]],"id":"3insp15"},{"u":3,"t":"insp","d":"h","s":"347","q":"How does release testing differ from system testing by developers?","o":[["It is validation by a separate team; theirs is defect testing","Release testing checks that requirements are met and is done by a team not involved in development."],["It is defect testing by developers; theirs is validation","This is reversed. Release testing is validation and is done by a separate team."],["It uses the source code; theirs uses only the specification","Release testing is usually black-box."],["It comes before integration; theirs comes after","Release testing needs a complete system."]],"id":"3insp16"},{"u":3,"t":"insp","d":"m","s":"350","q":"Users test the software AT THE DEVELOPER'S SITE, working with the team. This is:","o":[["Alpha testing","Alpha testing takes place at the developer's site."],["Beta testing","Beta gives a release to users to experiment with."],["Acceptance testing","Customers decide whether to accept the system."],["Release testing","A separate internal team does this."]],"id":"3insp17"},{"u":3,"t":"insp","d":"m","s":"349","q":"Why is user testing essential even after thorough system and release testing?","o":[["The user's real environment cannot be replicated","It strongly affects reliability, performance, usability and robustness."],["Earlier testing does not check any functions","It does check functions."],["Users write better unit tests than developers","Users do not write unit tests."],["It checks that the source code compiles on user machines","User testing is about reliability, usability and robustness in the real environment, not compilation."]],"id":"3insp18"},{"u":3,"t":"insp","d":"h","s":"351","q":"What is the main problem with acceptance testing in agile methods?","o":[["The embedded user may not be typical of everyone","The concern is whether that user can represent everyone's interests."],["Tests written by the user cannot be automated","They are run automatically with the other tests."],["A long separate acceptance phase delays release","There is no separate acceptance process."],["Customers are not allowed on the team","The user is part of the team."]],"id":"3insp19"},{"u":3,"t":"perf","d":"m","s":"353","q":"Why is performance testing harder than functional testing?","o":[["There is no obvious pass or fail threshold","\"Fast = good, slow = bad, but what's the threshold?\" Baselines and reliable measurements are the problem."],["Performance bugs always crash the system","They usually do not crash it."],["Performance cannot be measured by tools","Profilers and logs measure it."],["It must be done by end users only","Developers and testers do it with profilers and logs. The difficulty is setting a baseline."]],"id":"3perf01"},{"u":3,"t":"perf","d":"m","s":"355","q":"Which is true of performance bugs?","o":[["They usually do not give wrong results or crashes","This makes them hard to spot and hard to diagnose."],["They are usually easier to fix than other bugs","Fixing them is usually more difficult."],["They depend only on the source code","System load, hardware, network and workflows matter."],["They have little effect on user experience","They have a big impact."]],"id":"3perf02"},{"u":3,"t":"perf","d":"m","s":"356","q":"Which task is TRACING and not profiling?","o":[["Recording the sequence of function calls in a run","Tracing is about the flow of execution."],["Measuring total time spent in each function","Profiling measures performance of parts."],["Reporting memory used by each module","Measuring memory use of parts of the program is profiling."],["Ranking the slowest functions","Ranking functions by time is profiling. Tracing records the order of events."]],"id":"3perf03"},{"u":3,"t":"perf","d":"m","s":"357","q":"A memory leak appears only after 30 hours of heavy use. Which test is designed to find it?","o":[["Soak testing","Significant load over a significant period."],["Smoke testing","A quick check of the main functions."],["Unit testing","Too short and too isolated."],["Alpha testing","About users at the developer's site."]],"id":"3perf04"},{"u":3,"t":"perf","d":"h","s":"357","q":"When does the lecture advise running soak tests?","o":[["At big release milestones or infrastructure changes","They are time-consuming, so use them at those points."],["On each commit, before the code is merged","Too slow for every commit."],["Only after customers report a crash","They are meant to prevent this."],["Never, since they give the same result as unit tests","They find failures that unit tests cannot."]],"id":"3perf05"},{"u":3,"t":"perf","d":"m","s":"360","q":"Chaos engineering aims to:","o":[["Build confidence that a system survives turbulence","This is the definition quoted on the slide."],["Remove every possible source of failure before launch day","It accepts that failures will happen."],["Replace unit and integration testing in pipelines","Chaos experiments complement earlier tests. They start from a system that already works."],["Randomise test inputs to crash a parser","Random inputs to find crashes is fuzzing. Chaos engineering breaks components of a live system."]],"id":"3perf06"},{"u":3,"t":"perf","d":"h","s":"362","q":"Google turned off a data centre and machines would not come back. Why?","o":[["DHCP leases ran out as machines returned","A large number came back together and IP addresses could not be allocated."],["The disks had been wiped by Chaos Monkey","Chaos Monkey is Netflix's tool."],["Links in Mexico depended on that building","This was the separate Sao Paulo network test."],["Stream starts per second fell to zero","This is Netflix's metric."]],"id":"3perf07"},{"u":3,"t":"perf","d":"h","s":"362","q":"What did terminating the Sao Paulo network reveal?","o":[["A hidden dependency affecting Mexico","It would have stayed undiscovered without the test."],["A shortage of DHCP leases for new machines","This was the data centre test."],["A race condition in the billing service","The finding was about network links: a dependency between Sao Paulo and Mexico."],["That failovers always work correctly","The test showed the opposite."]],"id":"3perf08"},{"u":3,"t":"perf","d":"h","s":"365","q":"Why does Netflix watch stream starts per second, not CPU load, during chaos experiments?","o":[["It shows if customers can use the service","SPS measures availability from the user's side. CPU can look fine while users cannot play anything."],["CPU load cannot be measured on AWS machines","CPU is easy to measure. It simply does not tell you whether customers can play a video."],["It shows how many developers are on call","It counts stream starts."],["It shows which function is the slowest","Finding slow functions is profiling. SPS counts how many streams start each second."]],"id":"3perf09"},{"u":3,"t":"perf","d":"m","s":"364","q":"Which is listed as a failure in microservice architectures?","o":[["A network partition between services","Also: server down, delayed communication, overload and running out of memory or CPU."],["A missing else branch in one function","This is a coding defect."],["A wrong licence in a dependency","This is a compliance issue."],["A naming rule broken in a class","This is a style issue."]],"id":"3perf10"},{"u":3,"t":"dyn","d":"e","s":"371","q":"The lecture links static testing to ____ and dynamic testing to ____.","o":[["verification; validation","\"Static testing is Verification. Dynamic testing is Validation.\""],["validation; verification","This is reversed. Static testing is the verification side."],["unit testing; system testing","Both levels are dynamic."],["users; developers","The split is about whether code is executed, not about who does the testing."]],"id":"3dyn01"},{"u":3,"t":"dyn","d":"m","s":"372","q":"A control flow graph has 11 edges, 9 nodes and 1 connected component. What is its cyclomatic complexity?","o":[["4","M = E - N + 2P = 11 - 9 + 2 = 4."],["2","This forgets to add 2P."],["3","This adds P in place of 2P."],["22","This adds E + N + 2."]],"id":"3dyn02"},{"u":3,"t":"dyn","d":"h","s":"372","q":"A program has TWO separate connected components, with 13 edges and 11 nodes in all. What is M?","o":[["6","M = E - N + 2P = 13 - 11 + 2(2) = 6."],["4","This uses P = 1."],["2","This leaves out 2P."],["3","This is not E - N + 2P for any P here."]],"id":"3dyn03"},{"u":3,"t":"dyn","d":"h","s":"380-381","q":"What is the cyclomatic complexity of this code?","c":["if (y < 0) power = -y;","else power = y;","z = 1;","while (power != 0) { z = z * x; power = power - 1; }","if (y < 0) z = 1 / z;","output(z);"],"o":[["4","Three decisions (if, while, if) plus 1. The slide gets the same from 16 - 14 + 2."],["3","This counts the decisions but forgets to add 1."],["5","else is not a separate decision."],["2","This misses the while and the last if."]],"id":"3dyn04"},{"u":3,"t":"dyn","d":"h","s":"382-383","q":"What is the cyclomatic complexity of this sort?","c":["while (i < n-1) do","  j = i + 1","  while (j < n) do","    if A[i] < A[j] then swap(A[i], A[j])","  end do","  i = i + 1","end do"],"o":[["4","Two whiles and one if give 3 decisions plus 1. E - N + 2 = 9 - 7 + 2 = 4."],["2","9 - 7 leaves out the + 2."],["3","This counts decisions without adding 1."],["8","Nested decisions add, they do not multiply."]],"id":"3dyn05"},{"u":3,"t":"dyn","d":"m","s":"373","q":"In a control flow graph, nodes and edges stand for:","o":[["Basic blocks; control flow","Nodes portray basic blocks and edges portray control flow paths."],["Variables; assignments to them","This would be data flow."],["Functions; parameters passed","This would be a call graph."],["Classes; inheritance","This would be a class diagram."]],"id":"3dyn06"},{"u":3,"t":"dyn","d":"m","s":"384","q":"Which is a stated DISADVANTAGE of cyclomatic complexity?","o":[["It ignores the complexity of the data","Data complexity is not captured."],["It needs the program to be executed first","It is computed from the CFG."],["It cannot be computed if there are loops","Loops are decisions and are counted."],["It grows with the number of comments","Comments have no effect."]],"id":"3dyn07"},{"u":3,"t":"dyn","d":"h","s":"386","q":"How many tests give 100% STATEMENT coverage here, and how many give 100% BRANCH coverage, at minimum?","c":["int f(int x) {","  int y = 0;","  if (x > 0) y = 10;","  return 100 / (y + 1);","}"],"o":[["1 and 2","One test with x > 0 runs every statement. Branch coverage also needs a test with x <= 0."],["2 and 2","One test is enough to run all statements, as there is no else."],["1 and 1","The false branch is never taken by the first test."],["2 and 4","There is only one decision, so two outcomes."]],"id":"3dyn08"},{"u":3,"t":"dyn","d":"m","s":"388","q":"Adding known faults without telling testers, to judge the test process, is:","o":[["Fault seeding","Finding seeded faults calibrates how effective the process and testers are."],["Mutation testing","That checks whether test CASES fail on changed code."],["Error guessing","That uses the tester's experience."],["Fuzzing","That uses random inputs."]],"id":"3dyn09"},{"u":3,"t":"dyn","d":"h","s":"388","q":"20 faults are seeded and testers find 16 of them, plus 40 real faults. Assuming real faults are as findable as seeded ones, about how many real faults REMAIN?","o":[["10","Detection rate is 16/20 = 80%. 40 is 80% of 50, so about 10 real faults remain."],["4","This is the number of SEEDED faults not found."],["24","This is 40 - 16, which means nothing here."],["50","This is the estimated TOTAL of real faults."]],"id":"3dyn10"},{"u":3,"t":"dyn","d":"h","s":"389","q":"Original code: if (age >= 18). The mutant is: if (age > 18). Which test input KILLS the mutant?","o":[["age = 18","18 >= 18 is true, 18 > 18 is false, so the outputs differ."],["age = 17","17 >= 18 and 17 > 18 are both false, so the mutant behaves like the original."],["age = 19","19 >= 18 and 19 > 18 are both true, so the mutant survives."],["age = 65","65 >= 18 and 65 > 18 are both true, so the mutant survives."]],"id":"3dyn11"},{"u":3,"t":"dyn","d":"h","s":"389","q":"After mutation testing, 12 of 60 mutants still pass all tests. What does this show?","o":[["The test suite is not strong enough","Good tests should FAIL on mutants. Those 12 survived."],["The production code has 12 bugs","The bugs were put in on purpose in copies."],["The suite has 80% statement coverage","48 of 60 killed is a mutation score, not coverage."],["The 12 mutants should be released","Mutants are only for judging the tests."]],"id":"3dyn12"},{"u":3,"t":"dyn","d":"m","s":"387","q":"A tester tries leap years and empty files because past projects broke on them. This is:","o":[["Error guessing","Experience and history guide where faults are likely."],["Fault seeding","Fault seeding plants known faults. Here the tester only relies on experience."],["Branch testing","No code structure is used."],["Mutation testing","Mutation testing changes statements in copies of the code. Here the code is untouched."]],"id":"3dyn13"},{"u":3,"t":"dyn","d":"m","s":"386","q":"Which technique selects paths based on the status of variables or data objects?","o":[["Data flow based criteria","They explore sequences of events related to variables."],["Control flow based criteria","They use paths, branches and conditions."],["Usage based testing","It is about how users interact."],["Error guessing","It is about intuition."]],"id":"3dyn14"},{"u":3,"t":"dyn","d":"m","s":"391","q":"Test cases built from knowledge of banking rules for a banking app are:","o":[["Application domain based","They use specific knowledge of the product domain."],["Intuition and experience based","These rely on the tester's experience."],["Usage based","These find defects revealed as users interact."],["Fault based","These use seeded, guessed or mutated faults."]],"id":"3dyn15"},{"u":3,"t":"dyn","d":"m","s":"385","q":"Compared with static testing, dynamic testing's stated disadvantages are:","o":[["Time and budget","It finds difficult and complex defects but costs time and budget."],["False positives and noise","These are linked with static analysis."],["It cannot find complex defects","Finding them is its advantage."],["It needs no working system","It needs the actual system."]],"id":"3dyn16"},{"u":3,"t":"scm","d":"m","s":"404","q":"Keeping a record of how a system has evolved relative to published documents is:","o":[["Configuration status accounting","It keeps a record of evolution and the state of the system."],["Configuration auditing","This determines how far the system reflects its baselines."],["Configuration control","This evaluates and approves change proposals."],["Configuration identification","This defines the baseline components."]],"id":"3scm01"},{"u":3,"t":"scm","d":"h","s":"404","q":"A team checks whether the CURRENT build truly reflects its requirements baseline. Which SCM element is this?","o":[["Configuration auditing","It determines the degree to which the current state reflects its baselines."],["Status accounting","This records history; it does not judge conformity."],["Configuration control","This handles change proposals."],["Configuration identification","This defines the items."]],"id":"3scm02"},{"u":3,"t":"scm","d":"m","s":"407","q":"Who defines procedures for creating promotions and releases?","o":[["Configuration manager","The role identifies configuration items and defines these procedures."],["Auditor","Validates the processes and ensures consistency and completeness."],["Change control board member","Approves or rejects change requests."],["Developer","Creates versions, checks in changes and resolves conflicts."]],"id":"3scm03"},{"u":3,"t":"scm","d":"m","s":"408","q":"SCM planning is done by whom, and when?","o":[["The configuration manager, early in the project","It starts during the early phases and gives the SCM plan."],["The auditor, just before the release date","Auditors validate later."],["The change board, after the first defect is found","The board rules on change requests."],["The developers, at the end of coding","This is far too late."]],"id":"3scm04"},{"u":3,"t":"scm","d":"h","s":"411","q":"A team puts every rough sketch under formal configuration control on day one. What does the lecture predict?","o":[["Too much bureaucracy","Starting too early brings bureaucracy; too late brings chaos."],["Chaos","This is the result of starting too LATE."],["Fewer configuration items","More items would be controlled."],["Faster releases","Bureaucracy slows things down."]],"id":"3scm05"},{"u":3,"t":"scm","d":"h","s":"412","q":"What makes a specification a BASELINE?","o":[["It is formally agreed, and changes only by formal review","It then serves as the basis for later work."],["It is the latest version found in any developer's own branch","No review has taken place."],["It is the first document written in the project","Order of writing is not the criterion."],["It has zero known defects","Being a baseline is about agreement, not perfection."]],"id":"3scm06"},{"u":3,"t":"scm","d":"m","s":"412","q":"\"APIs have been defined; bodies of methods are empty\" is the lecture's example of:","o":[["A baseline","It is Baseline A. Baseline B has data access methods implemented and tested."],["A release","Nothing is distributed to customers."],["A revision","No error is being corrected."],["A codeline","A codeline is a group of files evolving together."]],"id":"3scm07"},{"u":3,"t":"scm","d":"m","s":"413","q":"A group of files that evolve together over an application's life is a:","o":[["Codeline","It may include source, build scripts, images and compiled code."],["Branch","A branch is a copy of all or part of the source."],["Baseline","A baseline is a reviewed and agreed product or specification."],["Configuration item","An item is treated as a single entity."]],"id":"3scm08"},{"u":3,"t":"scm","d":"h","s":"413","q":"Two developers merge their branches once every two months and face huge conflicts. What does the lecture advise?","o":[["Merge frequently","Frequent merging lowers the likelihood and complexity of conflicts."],["Merge only at release time","This makes conflicts larger."],["Ban branches and lock files","Branching supports concurrent work and stability."],["Use a separate repository for each developer","Integration would be even harder."]],"id":"3scm09"},{"u":3,"t":"scm","d":"h","s":"415-416","q":"50 developers, strict release cycles and several versions live in production. Which strategy and branch set fit?","o":[["GitFlow: main, develop, feature, release, hotfix","This is the slide's description of GitFlow."],["Trunk-based: one main branch, feature flags","This suits about 4 people and weekly releases."],["GitFlow: one main branch, feature flags","The strategy is right but the branches belong to trunk-based."],["Trunk-based: main, develop, release, hotfix","These branches belong to GitFlow."]],"id":"3scm10"},{"u":3,"t":"scm","d":"m","s":"416","q":"In trunk-based development, unfinished work is kept out of users' sight by:","o":[["Feature flags","Incomplete work is merged but switched off."],["Long-lived branches","Branches are short-lived."],["Hotfix branches","These are from GitFlow."],["Separate repositories","One main branch is used."]],"id":"3scm11"},{"u":3,"t":"scm","d":"m","s":"418","q":"From v1.0.1, a payment feature is added with no redesign. Which version follows the slide's scheme?","o":[["v1.1.0","A new feature raises the minor number and resets the patch."],["v1.0.2","A patch is for bug fixes."],["v2.0.0","The major number is for things such as a complete UI redesign."],["v1.1.1","The patch resets to 0."]],"id":"3scm12"},{"u":3,"t":"scm","d":"h","s":"425","q":"A team corrects an error in the code without altering documented functionality, then formally ships it to customers. Which terms apply, in order?","o":[["Revision, then release","A revision corrects errors only. A release is a formal distribution of an approved version."],["Version, then revision","Different versions have different functionality."],["Release, then version","The correction is not a release, and shipping is not a version."],["Baseline, then promotion","A promotion moves changes to the master directory."]],"id":"3scm13"},{"u":3,"t":"scm","d":"m","s":"420","q":"Which is a benefit of build management tools such as Make?","o":[["Unchanged sources are not recompiled","This gives a shorter build time."],["Source code is reviewed automatically","Review is done by people or analysis tools. Make only compiles and links."],["Bugs are assigned to developers","This is defect tracking."],["Customers are told about new releases","This is release management."]],"id":"3scm14"},{"u":3,"t":"scm","d":"m","s":"423","q":"Moving a programmer's verified change into the central master directory is:","o":[["Promotion","Changes are promoted according to promotion policies."],["Release","This moves code to the customer."],["Branching","Branching makes a copy to work on. Promotion brings verified work to the master directory."],["Auditing","This checks conformity."]],"id":"3scm15"},{"u":3,"t":"scm","d":"m","s":"424","q":"Where does the lecture say INFORMAL change policies are suitable?","o":[["Research-type environments and promotions","Formal policies suit external items and releases."],["Externally developed items and releases","These need formal policies."],["Safety-critical systems only","These would need formal control."],["Nowhere","Informal policies are allowed."]],"id":"3scm16"},{"u":3,"t":"scm","d":"h","s":"426","q":"What is the correct order in the defect management process?","o":[["Validate, analyze, assign, fix, verify, close","Full order: discover, report, validate, analyze, assign, fix, verify, close, release."],["Analyze, validate, assign, verify, fix, close","Validation comes before analysis, and fix before verify."],["Assign, validate, analyze, fix, close, verify","A bug is validated before it is assigned."],["Validate, assign, analyze, fix, close, verify","Analysis precedes assignment, and verify precedes close."]],"id":"3scm17"},{"u":3,"t":"scm","d":"h","s":"432","q":"In the bug lifecycle chart, a valid bug is found to be already EXISTING in the tracker. Its status becomes:","o":[["Duplicate","Valid, then existing = yes leads to Duplicate."],["Rejected","This is for bugs that are not valid."],["Deferred","This is for bugs whose fix is delayed."],["Assigned","This is for valid, new bugs that are not delayed."]],"id":"3scm18"},{"u":3,"t":"scm","d":"h","s":"432","q":"In the bug lifecycle chart, a bug is closed and then REGRESSION testing fails. What happens?","o":[["It goes back to Open","Both a failed retest and failed regression testing lead back to Open."],["It becomes Rejected","Rejected follows the \"valid?\" check."],["It stays Closed","A failure reopens it."],["It becomes New","New is only for first reports."]],"id":"3scm19"},{"u":3,"t":"scm","d":"m","s":"428","q":"CVS improved on RCS by:","o":[["Allowing concurrent work without locking","CVS is based on RCS and adds concurrency and a web front end."],["Adding process modelling and policy checks","These are in ClearCase."],["Producing Windows installers","Installation tools do this."],["Tracking the bug lifecycle","Bugzilla and similar tools do this."]],"id":"3scm20"},{"u":3,"t":"scm","d":"m","s":"430","q":"A small installer that fetches prerequisites and updates the big bundle is a:","o":[["Bootstrapper","This is the slide's definition."],["Makefile","A Makefile tells Make how to build a program from source."],["Codeline","It is a group of files."],["Linter","A linter checks code style and installs nothing."]],"id":"3scm21"},{"u":3,"t":"scm","d":"m","s":"426","q":"How does the lecture separate a BUG from a DEFECT?","o":[["A bug comes from a coding fault; a defect deviates from needs","These are the two definitions given."],["A bug is found by real users; a defect is found by testers","The definitions are about cause and deviation. Either can be found by anyone."],["A bug has a high severity; a defect has a low severity","Severity is assigned in analysis."],["A bug is in documents; a defect is in code","A bug is the result of a coding fault."]],"id":"3scm22"},{"u":3,"t":"scm","d":"m","s":"433-434","q":"In a typical agile SCM flow, what happens straight after \"commit and push\"?","o":[["The CI pipeline runs automatically","Then come code review through a pull request, merge and deployment to staging."],["The change is merged to main","Merge comes after approval."],["A change board meets","A change board is a formal SCM role. Agile flow relies on automated CI and a pull request."],["The app is deployed to customers","The last step is automatic deployment to staging."]],"id":"3scm23"},{"u":3,"t":"scm","d":"e","s":"406","q":"Which fact about Google's monorepo was given?","o":[["2 billion lines and 40,000+ commits per day","With automated testing on each commit and instant rollback."],["2 million lines and 400 commits per day","Google's monorepo is about 1,000 times larger, with over 40,000 commits a day."],["50 million lines, the size of Windows 10","This is the Windows 10 figure."],["500,000 lines, reviewed once a week","This is roughly the size of Git or Redis."]],"id":"3scm24"},{"u":3,"t":"chg","d":"m","s":"436","q":"Change management gives priority to changes that are:","o":[["Most urgent and cost-effective","It makes system evolution a managed process."],["Requested first by customers","Order of arrival is not the criterion."],["Easiest and quickest to code","Effort is one input only."],["Proposed by developers","Anyone, including customers, can propose."]],"id":"3chg01"},{"u":3,"t":"chg","d":"m","s":"440","q":"Which is listed as a factor in change analysis?","o":[["The consequences of NOT making the change","Also the benefits, users affected, costs and the product release cycle."],["The seniority of the person who requested it","Change analysis weighs consequences, benefits, users affected, cost and the release cycle, not rank."],["The programming language of the fix","Language may affect cost, but it is not one of the five factors by itself."],["The number of comments in the code","Comments say nothing about the value of a change."]],"id":"3chg02"},{"u":3,"t":"chg","d":"h","s":"437","q":"In the change process chart, who checks a change request and closes it if it is INVALID?","o":[["Customer support","Support checks the CR, then closes it if invalid or registers it if valid."],["The change control board","The board assesses and selects valid CRs."],["The development team","They analyse implementation and cost or impact."],["The customer","The customer submits the CR."]],"id":"3chg03"},{"u":3,"t":"chg","d":"h","s":"437","q":"What comes directly BEFORE the board assesses a change request?","o":[["Cost and impact analysis","The flow is implementation analysis, cost/impact analysis, then assess CRs."],["Modifying the software","This follows selection."],["Testing the software","This follows modification."],["Closing the change request","This comes at the end."]],"id":"3chg04"},{"u":3,"t":"chg","d":"h","s":"437","q":"A modified system FAILS its test in the change process. What happens next?","o":[["The software is modified again","The Fail arrow returns to \"Modify software\"."],["The CR is closed","Closing follows a Pass."],["The CR goes back to the customer","The chart sends a failed test back to Modify software. The customer only submits the CR."],["The board rejects the CR","The board decided before the modification."]],"id":"3chg05"},{"u":3,"t":"chg","d":"m","s":"441","q":"In agile methods, refactoring is seen as:","o":[["A necessary part of development","It is not seen as an overhead."],["An overhead to be minimised","The slide says the opposite."],["A change needing customer approval","Programmers decide on changes that improve the software."],["A task for the release phase only","Agile teams improve the software continually, not in one phase."]],"id":"3chg06"},{"u":3,"t":"chg","d":"m","s":"443","q":"Which is a typical SBOM entry field?","o":[["Package version and checksum","Typical contents: name, version, origin, checksum, licence and relationships."],["The name and role of each developer","An SBOM lists components, not people."],["Test coverage by module","Coverage is a test metric. An SBOM is an inventory of components."],["Number of open bugs","Bug counts live in a tracker. An SBOM records what the software is made of."]],"id":"3chg07"},{"u":3,"t":"chg","d":"h","s":"444","q":"Your app uses library X, which itself uses a vulnerable log4j. How does an SBOM help?","o":[["It lists transitive dependencies, exposing log4j","You see the component even though you never added it directly."],["It patches log4j inside library X for you","An SBOM is an inventory and patches nothing."],["It blocks attackers from sending log messages","An SBOM is a document, so it has no effect while the app runs."],["It proves that library X never calls log4j","It lists components, not call behaviour."]],"id":"3chg08"},{"u":3,"t":"chg","d":"m","s":"445","q":"Match the SBOM standard from OWASP that suits security-focused workflows.","o":[["CycloneDX","It is lightweight and from OWASP."],["SPDX","This is from the Linux Foundation."],["SWID tags","This is an ISO standard for enterprise asset management."],["PURL","This is a package identifier used inside an entry."]],"id":"3chg09"},{"u":3,"t":"chg","d":"m","s":"446","q":"Which command-line tool is shown GENERATING an SBOM in several formats?","o":[["Syft","For example: syft myapp:latest -o cyclonedx-json."],["Nmap","Nmap discovers hosts and open ports on a network."],["JUnit","JUnit is a unit test framework for Java."],["Bugzilla","Bugzilla tracks defects through their lifecycle."]],"id":"3chg10"},{"u":3,"t":"chg","d":"h","s":"447","q":"What does the purl below tell you?","c":["\"purl\": \"pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1\""],"o":[["It is the Maven package log4j-core, version 2.14.1","A purl gives the ecosystem, the namespace, the name and the version."],["It is log4j-core, safe since version 2.14.1","A purl makes no statement about safety."],["It is a download link to the Apache-2.0 licence text","The licence is in a separate field."],["It is the checksum of log4j-core","A checksum is a hash."]],"id":"3chg11"},{"u":4,"t":"met","d":"m","s":"5","q":"Ariane 5 had a backup inertial reference system. Why did the redundancy not help?","o":[["Both units ran the same software and failed the same way","The overflow hit the backup, then the same overflow hit the primary. Redundant software is a single point of failure."],["The backup had been removed to reduce launch weight","The backup was present and failed first."],["The backup used a different sensor that had no power","Both ran the same reused code."],["The primary was damaged by the backup's exhaust heat","The failure was in software."]],"id":"4met01"},{"u":4,"t":"met","d":"h","s":"5","q":"The module that failed on Ariane 5 had worked on Ariane 4. What made the same code fail?","o":[["Higher horizontal velocity overflowed a 16-bit integer","The flight profile broke an old assumption, so the float to integer conversion overflowed."],["The code was recompiled with a newer, faulty compiler","No compiler fault is described."],["The payload was heavier than the maximum allowed","The payload was lost, but it was not the cause."],["The 16-bit value was widened to 64 bits by mistake","The conversion was from 64-bit to 16-bit."]],"id":"4met02"},{"u":4,"t":"met","d":"m","s":"6","q":"\"App doesn't crash during peak registration\" is the example for which ISO 9126 characteristic?","o":[["Reliability","Does it work consistently?"],["Functionality","Does it work correctly, such as saving to the database."],["Efficiency","Does it use resources well, such as handling 1000 users without slowdown."],["Maintainability","Can we fix or enhance it easily."]],"id":"4met03"},{"u":4,"t":"met","d":"h","s":"6","q":"A system gives correct results and never crashes, but slows to a crawl at 1000 users. Which ISO 9126 characteristic is weak?","o":[["Efficiency","Handling 1000 concurrent users without slowdown is the efficiency example."],["Reliability","It works consistently and does not crash."],["Functionality","The results are correct."],["Usability","Ease of use is not what is described."]],"id":"4met04"},{"u":4,"t":"met","d":"m","s":"6","q":"\"New event type added in under 2 hours\" measures:","o":[["Maintainability","Can we fix or enhance it easily?"],["Portability","Can it run elsewhere?"],["Usability","Usability asks whether it is easy to use. This example is about how fast developers can extend it."],["Efficiency","Does it use resources well?"]],"id":"4met05"},{"u":4,"t":"met","d":"m","s":"13","q":"By the IEEE 1061 definition, what is the OUTPUT of a software quality metric?","o":[["A single numerical value","The inputs are software data, and the output is one number showing the degree of an attribute."],["A list of defects to be fixed","Defects may be input data."],["A pass or fail decision","A decision may use the metric, but the metric is a number."],["A set of test cases","Test cases are not the output."]],"id":"4met06"},{"u":4,"t":"met","d":"m","s":"12","q":"Hubbard describes measurement as:","o":[["A quantitatively expressed reduction of uncertainty","Based on one or more observations."],["A way to remove all uncertainty from decisions","Reduction, not removal."],["A target that teams must be rewarded for reaching","This leads to Goodhart's law."],["A proof that one thing causes another","Measurement alone does not show causation."]],"id":"4met07"},{"u":4,"t":"met","d":"h","s":"20","q":"Which chain of reasoning supports the claim \"everything is measurable\"?","o":[["If we care about it, it is detectable, so it exists in some amount","Detectable means detectable in an amount, and an amount can be measured."],["If it is measurable, we care about it, so it must be a target","This runs backwards and adds a target."],["If it has no unit, it cannot matter, so we can ignore it","The argument is about indirect detection."],["If it is expensive, it must be important, so we count its cost","The argument is about detectability and amount. Cost plays no part in it."]],"id":"4met08"},{"u":4,"t":"met","d":"m","s":"18","q":"Which is listed as a NON-TRIVIAL quality to measure?","o":[["Code elegance","Also maintainability, fairness in decision making, collaboration and creativity."],["Lines of code","Described as easy to measure."],["Number of files","Counting files is trivial, so it needs no indirect measure."],["On-time release","A process quality that is easy to observe."]],"id":"4met09"},{"u":4,"t":"met","d":"m","s":"22","q":"Why count logical statements in place of raw lines?","o":[["Formatting and blank lines stop affecting the number","Normalising also means ignoring comments or pretty printing first."],["It removes the effect of the programming language","Language differences need a language factor."],["It measures the quality of the design directly","It is still only a size measure."],["It counts only the lines reached by tests","Counting lines reached by tests is coverage, which needs a test run."]],"id":"4met10"},{"u":4,"t":"met","d":"h","s":"23","q":"The language table gives C a statement factor of 1, Java 2.5 and Python 6. What does a size of 100 statements suggest?","o":[["100 Python statements do about as much as 600 C statements","The factor expresses how much one statement does relative to C."],["100 C statements do about as much as 600 Python statements","This is reversed. One Python statement does as much as about 6 in C."],["100 Java statements do about as much as 250 Python statements","Java is 2.5 and Python is 6, so it is about 42 Python statements."],["100 statements do the same work in every language","The table exists because they do not."]],"id":"4met11"},{"u":4,"t":"met","d":"h","s":"24","q":"A program has 64 operators and operands in total, 16 of them distinct. What is its Halstead volume?","o":[["256","Volume = 64 x log2(16) = 64 x 4."],["1024","This is 64 x 16 without the log."],["384","This is 64 x 6, using log2(64)."],["80","This adds the two numbers."]],"id":"4met12"},{"u":4,"t":"met","d":"m","s":"25","q":"In the Unit 4 slide, cyclomatic complexity is roughly equal to:","o":[["The number of decisions","It is based on the control flow graph and measures linearly independent paths."],["The number of operators","That is closer to Halstead."],["The number of classes","That is an object-oriented count."],["The number of comments","Comments have no effect."]],"id":"4met13"},{"u":4,"t":"met","d":"h","s":"25","q":"What is the cyclomatic complexity of this code, and how many complete paths run through it?","c":["if (c1) { f1(); } else { f2(); }","if (c2) { f3(); } else { f4(); }"],"o":[["Complexity 3, with 4 paths","Two decisions + 1 = 3 independent paths, while 2 x 2 = 4 complete paths exist."],["Complexity 4, with 4 paths","Complexity counts independent paths, which is 3."],["Complexity 2, with 4 paths","Remember the + 1."],["Complexity 3, with 2 paths","The two choices combine, so there are 4 paths."]],"id":"4met14"},{"u":4,"t":"met","d":"m","s":"26","q":"Which pair are both OBJECT-ORIENTED metrics?","o":[["Depth of inheritance tree; object class coupling","Both are on the list with methods per class and number of child classes."],["Halstead volume; lines of code","Both are general size metrics."],["Function points; mean time between failures (MTBF)","One is size and one is reliability."],["Statement coverage; number of child classes","Number of child classes is object-oriented, but statement coverage is a test metric."]],"id":"4met15"},{"u":4,"t":"met","d":"m","s":"29","q":"Comparing a module's metrics with typical values from many projects and reporting deviations is:","o":[["Benchmarking","Monitor many projects or modules and get typical values."],["Trend analysis","That follows one measure over time."],["Fault seeding","Fault seeding plants faults to judge a test process."],["Instrumentation","Instrumentation adds logging to watch execution."]],"id":"4met16"},{"u":4,"t":"tmet","d":"e","s":"33","q":"Function points measure a system's size from:","o":[["The functionality delivered to the user","They use the functional view, not development deliverables."],["The number of source lines written","Counting source lines gives SLOC, which depends on language and style."],["The number of developer hours spent","Hours measure effort, which can be estimated FROM function points."],["The number of test cases that pass","That is test progress."]],"id":"4tmet01"},{"u":4,"t":"tmet","d":"m","s":"34","q":"Which function point component is \"Google Calendar API\" the example for?","o":[["External interface file (EIF)","A shared data source."],["Internal logical file (ILF)","Database tables such as Events and Users."],["External input (EI)","The example for EI is the registration form, a data input screen."],["External inquiry (EQ)","The example for EQ is searching for events."]],"id":"4tmet02"},{"u":4,"t":"tmet","d":"m","s":"34","q":"Which pairing is correct in the Event Manager example?","o":[["Search events: external inquiry (EQ)","User queries are EQ."],["Event calendar view: external input (EI)","Displays are external outputs."],["Users table: external interface file (EIF)","Own database tables are ILF."],["Registration form: external output (EO)","Data input screens are EI."]],"id":"4tmet03"},{"u":4,"t":"tmet","d":"h","s":"36","q":"Using the weights EI 7, EO 5, EQ 3, ILF 4, EIF 3, what is the count for 4 EI, 2 EO, 3 EQ, 5 ILF and 2 EIF?","o":[["73","28 + 10 + 9 + 20 + 6 = 73."],["16","This only adds the counts."],["75","This is the total in the class example."],["67","This leaves out the external interface files."]],"id":"4tmet04"},{"u":4,"t":"tmet","d":"h","s":"36","q":"An app is 120 function points. At 10 FP per person-month, about how long would THREE developers take in the ideal case?","o":[["4 months","120 / 10 = 12 person-months, shared by 3."],["12 months","This is the effort for one developer."],["36 months","This multiplies by 3."],["40 months","This divides 120 by 3 and skips productivity."]],"id":"4tmet05"},{"u":4,"t":"tmet","d":"m","s":"37","q":"\"Faults found in a module / total faults in the product\" defines:","o":[["Defect density of modules","This is the description in the table."],["Fault density of the program","That is faults relative to program SIZE."],["Defect distribution by phase","That is the percentage per SDLC phase."],["Defect leakage","That compares UAT defects with earlier ones."]],"id":"4tmet06"},{"u":4,"t":"tmet","d":"h","s":"37","q":"12 defects were found in UAT and 80 before UAT. What is defect leakage by the slide's formula?","o":[["15%","(12 / 80) x 100."],["13%","This divides by 92, the total."],["85%","This is 100 - 15."],["667%","This is 80 / 12."]],"id":"4tmet07"},{"u":4,"t":"tmet","d":"h","s":"37","q":"A server has an MTBF of 250 hours. What is its failure rate?","o":[["0.004 failures per hour","Failure rate is the inverse of MTBF, 1/250."],["0.25 failures per hour","This divides 250 by 1000."],["250 failures per hour","This is the MTBF itself."],["0.04 failures per hour","This is 1/25."]],"id":"4tmet08"},{"u":4,"t":"tmet","d":"m","s":"32","q":"In the test measurement tree, function, statement, decision and condition fall under:","o":[["Evaluation of tests performed","These are the coverage measures."],["Evaluation of the program under test","This covers program measurements, defect types and density."],["Program size","This covers lines of code and function points."],["Defect density","This covers types and levels."]],"id":"4tmet09"},{"u":4,"t":"tmet","d":"m","s":"39-43","q":"Which four metrics does the autonomous vehicle case study discuss?","o":[["Code coverage, model accuracy, failure rate, mileage","These are numbered 1 to 4."],["Lines of code, velocity, throughput, cycle time","These are process metrics from Unit 3."],["Halstead volume, coupling, fan-in, mileage","Mileage is one of the four. Halstead volume and coupling are code metrics from elsewhere in the lecture."],["Code coverage, licence count, mileage, cost","Licence count and cost are not discussed."]],"id":"4tmet10"},{"u":4,"t":"tmet","d":"h","s":"41","q":"A vision model has 90% accuracy on a labelled test set. What does this NOT tell you?","o":[["How it performs on roads unlike those in the test set","Accuracy holds for the test inputs only."],["How many of the test inputs were recognised correctly","It says this directly: 90%."],["That some of the test inputs were recognised wrongly","10% were wrong."],["That the test set was labelled with ground truth","Accuracy needs labels."]],"id":"4tmet11"},{"u":4,"t":"tmet","d":"h","s":"42-43","q":"A company reports only \"20 million miles driven\". Why is this weak evidence of safety alone?","o":[["It ignores how many failures occurred and how bad","Mileage is a proxy. Failure rate needs failures per mile and the conditions driven."],["It is a process metric, so it has no unit at all","Miles driven does have a unit. Its weakness is that it says nothing about failures."],["It can be computed only from statement coverage","It is unrelated to coverage."],["It decreases as more vehicles are added","More vehicles add miles, so the figure would rise."]],"id":"4tmet12"},{"u":4,"t":"tmet","d":"m","s":"45","q":"The coverage paradox study found the link between coverage and effectiveness to be:","o":[["Low to moderate once suite size is controlled for","Suite size was a confounder in earlier studies."],["Strong in every case, whatever the suite size","The study found the link is only low to moderate once suite size is held fixed."],["Negative, so higher coverage finds fewer bugs","The link is weak but still positive."],["Impossible to measure in any way","The study did measure it, over test suites of controlled size."]],"id":"4tmet13"},{"u":4,"t":"tmet","d":"m","s":"46","q":"In the coffee and cancer example, smoking is the:","o":[["Confounder","It influences both the exposure and the outcome."],["Outcome","Cancer is the outcome."],["Exposure","Coffee is the exposure."],["Measure","It is a hidden variable here."]],"id":"4tmet14"},{"u":4,"t":"tmet","d":"h","s":"47","q":"Why does higher coverage often appear alongside better bug detection?","o":[["More diverse tests raise both","Coverage is a side effect, not the cause."],["Covered lines cannot hold bugs","A line can run in a test and still be wrong. Coverage only shows it was executed."],["Coverage tools repair faults they find","Coverage tools measure execution and never change the code."],["Bug trackers record coverage first","A bug tracker stores reports. It has no effect on coverage."]],"id":"4tmet15"},{"u":4,"t":"tmet","d":"h","s":"49","q":"Requests: 95% take 200 ms, 4% take 1,000 ms, 1% take 30,000 ms. How much does the slowest 1% add to the average?","o":[["300 ms","0.01 x 30,000 = 300. This is more than the 190 ms from the fastest 95%."],["30 ms","This uses 0.1%."],["190 ms","This is the share of the fast 95%."],["40 ms","This is the share of the 4%."]],"id":"4tmet16"},{"u":4,"t":"tmet","d":"m","s":"49","q":"What should you look at besides the average response time?","o":[["The 50th, 95th and 99th percentiles","They show the slow tail that an average hides."],["The smallest value seen in each hour","It hides every slow request."],["The sum of all the response times","It depends on traffic."],["The number of servers in use","It is not a response time."]],"id":"4tmet17"},{"u":4,"t":"tmet","d":"m","s":"51","q":"\"Teams with more commits have more bugs, so we should commit less.\" What is wrong?","o":[["It treats correlation as causation","Ask what the confounder is, such as the amount of work done."],["It uses a product metric for a person","Mixing up metric types is a different mistake. The flaw here is the causal claim."],["It ignores lines of code as a target","A target would be worse."],["It depends on too small a sample size","Even a huge sample would not turn this correlation into a cause."]],"id":"4tmet18"},{"u":4,"t":"tmet","d":"e","s":"53","q":"Goodhart's law warns that:","o":[["A measure that becomes a target stops being good","This is the statement on the slide."],["A measure without a target is of no practical use","Measures without targets can still inform decisions. The law warns about targets."],["Every target must be measured twice","Measuring twice does not stop people gaming a target."],["Measures improve when they are rewarded","Rewards tend to make people game the measure, so it gets worse as an indicator."]],"id":"4tmet19"},{"u":4,"t":"tmet","d":"m","s":"54-55","q":"Paying per bug fixed led developers to:","o":[["Introduce bugs to fix later","The company moved to team-based bonuses."],["Report fewer working hours","The reward was per fix, so hours worked did not matter."],["Open 3.5 million fake accounts","This was the account target case."],["Write meaningless tests for coverage","This was the 100% coverage mandate."]],"id":"4tmet20"},{"u":4,"t":"tmet","d":"h","s":"55-56","q":"A manager rewards \"low number of reported bugs per developer\". Which side effect is MOST likely?","o":[["Bugs go unreported, or testing gets lighter","People avoid finding or logging bugs, so the number falls without quality rising."],["Developers add extra bugs in order to fix them","This comes from rewarding FIXED bugs."],["Developers write needless documentation","This comes from rewarding documentation."],["Developers write longer code than needed","This comes from rewarding lines of code."]],"id":"4tmet21"},{"u":4,"t":"tmet","d":"m","s":"sample","q":"Risk management for software quality is mainly about:","o":[["Spotting threats to quality and planning for them","This matches the idea in your sample paper."],["Removing all the metrics that might later be gamed","Metrics are used with care."],["Moving the responsibility for quality to users","Responsibility stays with the team."],["Delaying a release until no defects remain","Absence of defects cannot be shown."]],"id":"4tmet22"},{"u":4,"t":"sec","d":"m","s":"73-74","q":"In the lecture, the \"Big-3\" of network security are:","o":[["Authentication, authorization, confidentiality","This is the list on the slide."],["Confidentiality, integrity and availability","This is the well-known CIA triad, but not the lecture's Big-3."],["Encryption, firewalls, passwords","These are mechanisms."],["Sniffing, spoofing, person-in-the-middle","These are attacks that the Big-3 protect you from."]],"id":"4sec01"},{"u":4,"t":"sec","d":"m","s":"75","q":"Which of the Big-3 protects against SPOOFING?","o":[["Authentication","It tells you with whom you are communicating."],["Confidentiality","It protects against sniffing."],["Authorization","It decides what a known user may do."],["None of them","Authentication confirms identity, which is exactly what a spoofer fakes."]],"id":"4sec02"},{"u":4,"t":"sec","d":"h","s":"75","q":"Protection from a person-in-the-middle attack needs:","o":[["Authentication and confidentiality","You must know who you are talking to, and others must not read or change messages."],["Authorization and authentication","Authorization does not stop interception."],["Confidentiality alone","You could have a confidential channel to the attacker."],["Authorization alone","It governs privileges only."]],"id":"4sec03"},{"u":4,"t":"sec","d":"h","s":"74","q":"According to the slides, what does confidentiality typically NOT hide?","o":[["That communication took place","\"Others can know that communication occurred.\""],["The content of the messages sent","Content is protected."],["Changes made by intermediaries","They cannot change what was said."],["Replayed messages","Protection from replay is typically included."]],"id":"4sec04"},{"u":4,"t":"sec","d":"m","s":"70-71","q":"Plugging into a subnet and listening to passing traffic is ____, while faking a source IP address is ____.","o":[["sniffing; spoofing","Sniffing listens. Spoofing pretends to be someone else."],["spoofing; sniffing","This is reversed. Sniffing is passive listening; spoofing is pretending."],["sniffing; phishing","Phishing is not covered here."],["tampering; spoofing","Listening does not alter traffic."]],"id":"4sec05"},{"u":4,"t":"sec","d":"m","s":"71","q":"Fooling a DNS server into giving out wrong IP addresses is:","o":[["DNS spoofing","A named form of spoofing on the slide."],["E-mail spoofing","E-mail spoofing fakes the sender of a message."],["Packet sniffing","Sniffing only listens to traffic and changes no answers."],["Replay attack","That resends captured messages."]],"id":"4sec06"},{"u":4,"t":"sec","d":"m","s":"69","q":"What can a person-in-the-middle do that a passive sniffer can NOT?","o":[["Change messages before they arrive","They can read and alter messages in transit."],["Read unencrypted messages","A sniffer can read unencrypted traffic as well."],["See that two hosts are talking to each other","A sniffer can see this as well."],["Capture packets on the subnet","Capturing packets is exactly what a sniffer does."]],"id":"4sec07"},{"u":4,"t":"sec","d":"h","s":"73-74","q":"A logged-in student opens the URL for editing other students' marks, and the server allows it. Which of the Big-3 failed?","o":[["Authorization","The identity is known, but the privilege to perform the operation was not checked."],["Authentication","The student was correctly identified."],["Confidentiality","No one intercepted the messages."],["All three","The student was identified and no one intercepted traffic. Only the privilege check is missing."]],"id":"4sec08"},{"u":4,"t":"sec","d":"e","s":"sample","q":"Availability, as a security property, means:","o":[["Authorised users can reach it when needed","This is the meaning used in your sample paper."],["Nobody but the sender is able to read the data","This is confidentiality."],["Data is not altered without permission","Keeping data unaltered is integrity."],["Users are who they claim to be","This is authentication."]],"id":"4sec09"},{"u":4,"t":"priv","d":"m","s":"63","q":"Meta's EUR 1.2 billion fine in 2023 was for:","o":[["Sending EU user data to the US without safeguards","A transfer violation."],["Tracking users for targeted advertising without consent","That was Amazon's EUR 746 million fine in 2021."],["Giving engineers in China access to EU user data","That was TikTok's EUR 530 million fine in 2025."],["Failing to report that drivers had been hacked","That was Uber, fined $148 million."]],"id":"4priv01"},{"u":4,"t":"priv","d":"h","s":"65","q":"Amazon argued \"no data breach occurred\". Why was it still fined?","o":[["The advertising system lacked proper user consent","Regulators said the whole system was the violation, not a breach."],["The breach was proved later by 10,000 complaining users","They complained about tracking."],["The regulators fine each company once per year","GDPR fines follow violations. There is no yearly quota."],["The data had been moved to servers in China","Transfers to China were the TikTok case."]],"id":"4priv02"},{"u":4,"t":"priv","d":"m","s":"64","q":"In the TikTok case, what did the regulator say ByteDance could not guarantee?","o":[["Privacy \"essentially equivalent\" to the EU's","This is the key detail on the slide."],["That the app would be available in every EU country","The concern was protection of data sent outside the EU, not availability of the app."],["That its source code would be opened","GDPR does not ask for source code to be opened."],["That adverts would be shown to adults only","The fine was about data transfers and access, not about who sees adverts."]],"id":"4priv03"},{"u":4,"t":"priv","d":"m","s":"83","q":"Warren and Brandeis (1890) wrote about privacy in response to:","o":[["Instantaneous photographs and newspapers","\"What is whispered in the closet shall be proclaimed from the house-tops.\""],["Telephone records kept by banks and shops","The quote speaks of photographs and newspapers entering private life."],["Government computers and their databases","Computers came decades after 1890."],["The first e-mail networks","E-mail came about 80 years after the article."]],"id":"4priv04"},{"u":4,"t":"priv","d":"m","s":"85","q":"Letting users review and correct their data falls under which FTC principle?","o":[["Access / participation","Users should be able to review and correct their information."],["Notice / awareness","This is about disclosing practices."],["Choice / consent","This is about opt-in and opt-out."],["Integrity / security","This is about secure, limited access."]],"id":"4priv05"},{"u":4,"t":"priv","d":"h","s":"85","q":"Which two FTC principles are marked as CORE principles on the slide?","o":[["Notice and choice","Notice/Awareness and Choice/Consent are marked core."],["Access and enforcement","Access and enforcement are principles 3 and 5, with no core label."],["Integrity and access","Integrity and access are principles 4 and 3, with no core label."],["Notice and enforcement","Notice is core, but the other core principle is choice."]],"id":"4priv06"},{"u":4,"t":"priv","d":"m","s":"86","q":"Match the law to its area: HIPAA, FERPA, COPPA.","o":[["Health, education, children online","Each is a US sector law."],["Education, health, children online","The first two are swapped."],["Health, children online, education","The last two are swapped."],["Finance, education, health","HIPAA is health and COPPA is for children."]],"id":"4priv07"},{"u":4,"t":"priv","d":"m","s":"86","q":"India's data protection law named in the slides is the:","o":[["DPDP","Digital Personal Data Protection Act."],["CCPA","California's state law."],["GDPR","GDPR is the European Union's regulation."],["FERPA","FERPA protects student education records in the US."]],"id":"4priv08"},{"u":4,"t":"priv","d":"m","s":"89","q":"Replacing names with random codes before analysis is an example of:","o":[["Data minimization","De-identification, pseudonymization and anonymization are listed here."],["Selective data collection","This is about not collecting data in the first place."],["Data retention policy","This is about how long data is kept."],["Privacy audit","This is a review process."]],"id":"4priv09"},{"u":4,"t":"priv","d":"e","s":"89","q":"Privacy-by-Design means:","o":[["Building privacy in from the start","\"Not bolting it on late.\""],["Hiring a lawyer after launch","Legal review after launch is bolting privacy on late."],["Encrypting backups once a year","Encryption is one mechanism. Privacy-by-Design shapes the whole system."],["Asking users to protect themselves","The design must do so."]],"id":"4priv10"},{"u":4,"t":"priv","d":"h","s":"91","q":"\"Ca
