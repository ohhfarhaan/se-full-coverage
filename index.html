n someone correlate a student's registrations to learn interests or social circle?\" Which LINDDUN threat is this?","o":[["Linking","Associating data items to learn about a person or group."],["Identifying","Learning who a person is."],["Detecting","Deducing involvement by observation."],["Non-repudiation","Being unable to deny an action."]],"id":"4priv11"},{"u":4,"t":"priv","d":"h","s":"91","q":"\"Are we collecting phone numbers even though email would suffice?\" Which LINDDUN threat is this?","o":[["Data disclosure","Excessive collecting, storing or sharing of data."],["Unawareness and unintervenability","Users not informed or not able to act."],["Non-compliance","Non-compliance is deviating from law and best practice, such as GDPR."],["Identifying","Learning the identity of a person."]],"id":"4priv12"},{"u":4,"t":"priv","d":"h","s":"91","q":"\"Does attendance at an event create a permanent record?\" Which LINDDUN threat is this?","o":[["Non-repudiation","The person cannot deny having attended."],["Detecting","This is about noticing involvement."],["Linking","This is about connecting data."],["Data disclosure","This is about excess data."]],"id":"4priv13"},{"u":4,"t":"priv","d":"m","s":"91","q":"\"Do users know data is collected? Can they delete their account?\" concerns:","o":[["Unawareness and unintervenability","Users lack information or control."],["Non-compliance with regulations","This asks whether GDPR measures are documented."],["Detecting of user involvement","This is about observation."],["Linking of separate data items","This is about correlation."]],"id":"4priv14"},{"u":4,"t":"priv","d":"m","s":"90","q":"The basic approach to threat modelling in the lecture is to:","o":[["Use a taxonomy of possible threats","A systematic method to identify threats and mitigations, for both security and privacy."],["Wait for an incident and then respond","It is done ahead of time."],["Fuzz every input with random data","That is a test technique."],["Rely on developers' intuition","A taxonomy organises the analysis."]],"id":"4priv15"},{"u":4,"t":"cov","d":"e","s":"99","q":"Statement coverage requires that:","o":[["Every statement runs at least once","This is the slide's definition."],["Every statement runs exactly once","\"At least\", not \"exactly\"."],["Every path runs at least once","That is path coverage."],["Every condition is both true and false","That is condition coverage."]],"id":"4cov01"},{"u":4,"t":"cov","d":"m","s":"100","q":"In \"if (a > 0 || b == null)\", how many decisions and conditions are there?","o":[["1 decision, 2 conditions","The whole expression is a decision made of two atomic conditions."],["2 decisions, 1 condition","This is reversed. The whole expression is one decision containing two conditions."],["2 decisions, 2 conditions","The whole is one decision."],["1 decision, 1 condition","The || joins two atomic conditions."]],"id":"4cov02"},{"u":4,"t":"cov","d":"h","s":"100-105","q":"Tests (a=true, b=false) and (a=false, b=true) are run on \"if (a || b)\". Which coverage is achieved? (Assume both operands are evaluated.)","o":[["Full condition coverage, but not full decision coverage","a and b each take both values, yet a || b is true both times."],["Full decision coverage, but not full condition coverage","The decision is never false."],["Both full condition and full decision coverage","The decision is never false."],["Neither kind of coverage in full","Condition coverage is full."]],"id":"4cov03"},{"u":4,"t":"cov","d":"h","s":"103-104","q":"In avgAbs, which condition stays uncovered by avgAbs(null) and avgAbs(-5, 3)?","c":["if (numbers == null || numbers.length == 0)","    throw new IllegalArgumentException();","for (int i = 0; i < numbers.length; ++i) {","    double d = numbers[i];","    if (d < 0) sum -= d; else sum += d;","}"],"o":[["numbers.length == 0 being TRUE","null short-circuits, and (-5, 3) makes it false. avgAbs() is needed."],["numbers == null being FALSE","avgAbs(-5, 3) makes it false."],["d < 0 being FALSE","The value 3 makes it false."],["i < numbers.length being FALSE","It is false when the loop ends."]],"id":"4cov04"},{"u":4,"t":"cov","d":"h","s":"103-107","q":"Two tests are run: avgAbs(null) and avgAbs(-5, 3). What DECISION coverage do they reach?","c":["if (numbers == null || numbers.length == 0) throw ...","for (int i = 0; i < numbers.length; ++i)","    if (d < 0) sum -= d; else sum += d;"],"o":[["100%","The first decision is true then false, the loop test is true then false, and d < 0 is true then false."],["83%","This would need one missing outcome out of six."],["67%","No two outcomes are missing."],["50%","Each decision takes both outcomes."]],"id":"4cov05"},{"u":4,"t":"cov","d":"m","s":"104","q":"Why is numbers.length == 0 not evaluated for avgAbs(null)?","o":[["The first part is true, so || short-circuits","numbers == null is true, so the right side is skipped."],["The length of a null array is always 0","Reading it would throw an exception."],["The compiler removes the second check for speed","It stays in the code."],["The exception is thrown before the if","It is thrown inside the if."]],"id":"4cov06"},{"u":4,"t":"cov","d":"m","s":"106","q":"On the control flow graph, decision coverage is equivalent to:","o":[["Edge coverage","The slide says so."],["Node coverage","That corresponds to statement coverage."],["Path coverage","Path coverage needs every complete path, which is stronger than covering every edge."],["Class coverage","Covering classes says nothing about the edges inside one method."]],"id":"4cov07"},{"u":4,"t":"cov","d":"h","s":"105","q":"Every decision outcome is covered. Which is guaranteed?","o":[["Every reachable statement has run","Decision coverage implies statement coverage, for code reached through those decisions."],["Every condition took both values","a || b can be covered with b never true."],["Every complete path has run","Loops and sequences give many more paths."],["The code has no defects","Coverage alone does not ensure correctness."]],"id":"4cov08"},{"u":4,"t":"cov","d":"m","s":"108-109","q":"What target does the lecture suggest for code coverage, and why not 100%?","o":[["80%, since the last part costs too much","Diminishing returns: the last 10% may need 50% more test code."],["100%, since anything less is hiding real bugs","The lecture argues against this."],["50%, since half the code is dead","The slide says dead code is one reason the last part is hard, not that half the code is dead."],["95%, since tools cannot measure more","Tools can measure 100%."]],"id":"4cov09"},{"u":4,"t":"cov","d":"m","s":"109","q":"Which is a reason for the effort rising sharply near 100% coverage?","o":[["Dead code paths and rare error conditions","Along with rare edge cases."],["Coverage tools get slower at each percent","The cost comes from writing tests for rare cases, not from tool speed."],["Tests start to fail at random","Randomly failing tests are a separate problem called flakiness."],["Public APIs must be tested last","Public APIs are a focus area."]],"id":"4cov10"},{"u":4,"t":"cov","d":"m","s":"109","q":"Where does Google's approach focus testing effort?","o":[["High-risk code, complex logic, public APIs","Security, payments and data are named as high risk."],["Generated code, code comments and log files","These are low risk. Google aims at code where failures hurt most."],["Code written by new developers only","Risk and complexity decide the focus, not the author."],["Code with the most lines only","Size is not on the list."]],"id":"4cov11"},{"u":4,"t":"cov","d":"m","s":"94","q":"In Google's coverage stack, what sits at the BOTTOM?","o":[["Coverage instrumentation (Gcov, JaCoCo)","Then build integration (Blaze), automation, and visualization and data analytics on top."],["Visualization of coverage and data analytics","These are at the top."],["Coverage automation","This is in the middle."],["Build system integration (Blaze)","This is second from the bottom."]],"id":"4cov12"},{"u":4,"t":"cov","d":"h","s":"40","q":"A function has 4 if-else outcomes and tests execute 3 of them. All lines run. What can you say?","o":[["Branch coverage is 75%, so an outcome is untested","3 of 4 outcomes. Full line coverage can still leave a branch untested."],["Branch coverage is 100%, since all lines ran","An if without else shows why not."],["Statement coverage is 75%, as for branches","All lines ran, so it is 100%."],["The function is free of defects in 3 branches","Coverage does not prove correctness."]],"id":"4cov13"},{"u":4,"t":"cov","d":"m","s":"110","q":"Which is a takeaway on code coverage?","o":[["It is useful but does not ensure correctness","It is useful, intuitive and not sufficient."],["It is too hard to interpret for daily use","It is described as intuitive."],["It is not used by companies in industry today","It is well known and used."],["It makes code reviews unnecessary","Reviews find design and readability problems that coverage cannot see."]],"id":"4cov14"},{"u":4,"t":"eth","d":"e","s":"112","q":"The Volkswagen code was unethical because it:","o":[["Detected emission tests and changed engine behaviour","The engine ran clean in tests and emitted up to 40 times the limit on the road."],["Failed to detect emission tests because of a bug","The detection worked as planned. The code was written on purpose to cheat."],["Leaked the location of drivers to advertisers","The scandal was about emissions, not about personal data."],["Was copied from a rival without a licence","The fines were for cheating on emissions, not for copying."]],"id":"4eth01"},{"u":4,"t":"eth","d":"m","s":"113","q":"Which decision made the Therac-25 race condition deadly?","o":[["Removing the hardware locks","Overconfident engineers took away the physical safeguard."],["Adding a second, slower processor","The race condition was within 8 seconds of operator input. No processor was added."],["Keeping the source code of the machine secret","Secrecy of the code was not the cause. The missing hardware interlock let the fault reach patients."],["Using a 16-bit velocity value","This was Ariane 5."]],"id":"4eth02"},{"u":4,"t":"eth","d":"h","s":"113, U3 79","q":"Which lesson links Therac-25 with the smart toaster in Unit 3?","o":[["Keep a safeguard that does not depend on software","The toaster's thermal fuse and Therac's hardware locks play the same role."],["Replace hardware safety with very well-tested software","This is what went wrong with Therac-25."],["Use a more accurate model to control the hardware","Accuracy gives no guarantee."],["Test the hardware only after release","Testing after release is too late for a safety-critical device."]],"id":"4eth03"},{"u":4,"t":"eth","d":"m","s":"115","q":"\"Engagement is up 15% after your change. Do you investigate WHY?\" In the Instagram case this question is about:","o":[["Whether a metric win is hiding harm to users","The algorithm delivered toxic content while engagement rose."],["Whether the A/B test ran for enough days","A statistical point, not the ethical one."],["Whether the server can handle more traffic","Traffic capacity is an engineering question, not the ethical one raised here."],["Whether the change should be patented","Patents are unrelated to whether the change harms users."]],"id":"4eth04"},{"u":4,"t":"eth","d":"m","s":"117","q":"What is the lecture's lesson from Twitter's photo cropping?","o":[["Intent does not excuse impact","Biased data and no fairness testing led to a harmful result."],["Cropping should always be done by hand","The point is about testing for fairness before release, whether cropping is automatic or not."],["Bias appears only if engineers want it","It arose without intent."],["Larger images reduce bias","Image size does not cure a model trained on biased data."]],"id":"4eth05"},{"u":4,"t":"eth","d":"h","s":"117","q":"Which three engineering choices produced the biased cropping?","o":[["Biased data, no fairness test, wide rollout","\"Trained on biased data, didn't test for fairness, deployed it to millions.\""],["Weak passwords, no logging, late security patches","These are security failings."],["Long functions, no comments, no reviews","These are code quality failings."],["Low coverage, slow builds, big releases","These are process failings."]],"id":"4eth06"},{"u":4,"t":"eth","d":"m","s":"119, 125","q":"Why is the Domino's case hard for rule-based ethics?","o":[["The accessibility law is older than websites","The ADA dates from 1990, so the law could not foresee the web."],["The company had no website of its own at the time","It had one that was not accessible."],["The law clearly exempts online orders","The act does not mention websites at all, since it was written before them."],["The users had agreed to the terms","The dispute was about access for blind users, not about terms of use."]],"id":"4eth07"},{"u":4,"t":"eth","d":"m","s":"124","q":"What does research say about a code of ethics?","o":[["It does not seem to change developers' choices","Hence the three questions as a practical reminder."],["It halves the number of ethical violations","No such effect was found. The finding is that decisions did not change."],["It affects managers but not developers","The slide speaks of software developers, with no such split."],["It makes developers leave the profession","The finding was about decisions, not about careers."]],"id":"4eth08"},{"u":4,"t":"eth","d":"m","s":"123","q":"Giving credit for intellectual property and honouring copyrights are part of:","o":[["The ACM code of ethics","It also covers avoiding harm, honesty, fairness, privacy and confidentiality."],["The FTC principles","These are about personal information."],["The GPL freedoms","These are about use, study and sharing."],["The LINDDUN taxonomy","This is about privacy threats."]],"id":"4eth09"},{"u":4,"t":"eth","d":"h","s":"127","q":"A feature predicts event attendance from students' social media. Which is one of the three questions for human flourishing?","o":[["Does my software respect the humanity of the users?","The others are about amplifying positive or negative behaviour, and about the effect of its quality on others."],["Does my software raise engagement for the users?","This is a metric question."],["Does my software collect more than its rivals?","Collecting more than rivals goes against respect for users' humanity."],["Does my software reach the planned coverage?","Coverage is a test metric. The questions are about people and society."]],"id":"4eth10"},{"u":4,"t":"eth","d":"m","s":"126","q":"Which is one of the five domains of human flourishing?","o":[["Meaning and purpose","With happiness, health, character and virtue, and close social relationships."],["Wealth and income","The five are happiness, health, meaning, character and relationships. Wealth is not among them."],["Speed and efficiency","These describe productivity. The five domains are about a person's wellbeing."],["Fame and influence","Close social relationships is on the list, but fame is not."]],"id":"4eth11"},{"u":4,"t":"eth","d":"m","s":"122","q":"Which is named as an open IP concern with LLMs?","o":[["Who owns the IP in LLM outputs","Also whether training data was obtained illegally, and whether sensitive input should be given."],["Whether LLMs may be used offline","Offline use is a deployment matter and raises no IP question."],["How many parameters a model may have","Model size is a technical choice, not an ownership question."],["Which language an LLM is written in","The implementation language does not decide who owns the output."]],"id":"4eth12"},{"u":4,"t":"oss","d":"e","s":"135","q":"Which right is said to come only \"often\", not always, with open-source software?","o":[["Redistributing derivative works","The slide writes \"(Often) right to redistribute derivative works\"."],["Viewing all of the source code","Always part of the definition."],["Modifying the code","Always part of the definition."],["Creating your own derivative works","Always part of the definition."]],"id":"4oss01"},{"u":4,"t":"oss","d":"m","s":"134","q":"Trademark differs from copyright in that it protects:","o":[["The name and logo of a product","Copyright protects creative works, software included."],["The source code of a product","Source code is a creative work, so copyright protects it."],["The idea behind a product","Ideas and inventions are the subject of patents."],["The price of a product","No intellectual property right protects a price."]],"id":"4oss02"},{"u":4,"t":"oss","d":"m","s":"134","q":"Open-source software is generally:","o":[["Copyrighted, with a licence granting use","Copyright stays with contributors or a maintaining entity."],["In the public domain, with no legal owner","Public domain is an alternative to copyright."],["Patented, with royalties waived","Patents are separate. Open source rests on copyright plus a licence."],["Unlicensed, so anyone may use it","Without a licence, no permission is given."]],"id":"4oss03"},{"u":4,"t":"oss","d":"m","s":"138-140","q":"Why was early UNIX released with source code freely available?","o":[["AT&T could not sell it as an OS product","It was barred from making an OS a product."],["AT&T wanted to compete with Linux servers","Linux came in 1991."],["Richard Stallman had placed it under the GPL","The GPL came later and GNU is \"not Unix\"."],["Berkeley owned the copyright to UNIX","It was created at Bell Labs."]],"id":"4oss04"},{"u":4,"t":"oss","d":"m","s":"141","q":"\"Free as in speech, not as in beer\" means the software:","o":[["Gives liberties, whatever its price","Freedom to run, study, change and share."],["Costs nothing, whatever its licence","This is \"free as in beer\"."],["May be used only for non-profit work","Freedom 0 allows any purpose."],["May be discussed but never sold","Free software may be sold. The freedoms are about what users can do with it."]],"id":"4oss05"},{"u":4,"t":"oss","d":"h","s":"141","q":"Which FSF freedom lets you share YOUR MODIFIED version?","o":[["Freedom 3","Distribute copies of your modified versions."],["Freedom 0","Run the code for any purpose."],["Freedom 1","Study and change the code."],["Freedom 2","Redistribute copies of the original."]],"id":"4oss06"},{"u":4,"t":"oss","d":"h","s":"143, 163","q":"A company links a GPL library into a closed-source product that it sells. What is the consequence?","o":[["The product would have to be GPL as well","Copyleft is transitive to linked code, which is why companies avoid it."],["The product must only give credit to the author","This is closer to MIT or BSD."],["The library becomes proprietary","Licences of the library do not change."],["Nothing, if the library is unmodified","This is true for LGPL libraries with dynamic binding, not GPL."]],"id":"4oss07"},{"u":4,"t":"oss","d":"h","s":"164","q":"A proprietary app dynamically links an UNMODIFIED LGPL library. Is this allowed?","o":[["Yes, as that is not a derivative work","Proprietary code can depend on LGPL libraries that are not modified."],["No, all the app code must become LGPL","This is the GPL-like effect that LGPL avoids."],["No, LGPL code can never be used in paid products","Proprietary code can depend on LGPL libraries, paid or not."],["Yes, but the app may not be sold","There is no such ban."]],"id":"4oss08"},{"u":4,"t":"oss","d":"m","s":"165-166","q":"Which statement on MIT and Apache licences is correct?","o":[["Both are permissive; Apache gives no trademark rights","The Apache licence does not grant permission to use the project's trademark."],["Both are copyleft; MIT is the stricter of the two","Copyleft describes the GPL family. MIT and Apache are both permissive."],["MIT demands that modifications stay under MIT","It has few restrictions."],["Apache demands that source code is distributed","The slide says it is not required."]],"id":"4oss09"},{"u":4,"t":"oss","d":"m","s":"167","q":"Under BSD, what must be included in source AND binary?","o":[["The copyright statement","And the holder does not endorse extensions without written consent."],["The complete source code","BSD lets you ship binaries alone. Supplying source is a GPL demand."],["A patent application","Patents play no part in the BSD conditions listed."],["The list of users","The licence asks for the notice only, with no record of users."]],"id":"4oss10"},{"u":4,"t":"oss","d":"m","s":"168","q":"A photo may be shared with credit, but NOT changed. Which Creative Commons licence fits?","o":[["CC-BY-ND","Attribution and no derivatives."],["CC-BY","Derivatives are allowed."],["CC-BY-SA","Derivatives are allowed under the same licence."],["MIT","A software licence that allows changes."]],"id":"4oss11"},{"u":4,"t":"oss","d":"m","s":"169","q":"MySQL's dual-licence model works because:","o":[["Companies pay to avoid the GPL's obligations","They either open their application or buy a business-friendly licence."],["Users may choose between MIT and BSD","Both are permissive, so companies would have nothing to pay to avoid."],["The GPL version is free for schools only","Anyone can use the GPL version if they accept its terms."],["Each buyer gets the source for two years","The paid licence sells freedom from GPL terms, not access to source."]],"id":"4oss12"},{"u":4,"t":"oss","d":"h","s":"170","q":"After the split, LibreOffice can copy changes from OpenOffice, but not the reverse. Why?","o":[["Their licences are compatible only one way","OpenOffice went to Apache, and LibreOffice chose a licence that can take Apache code but not give back."],["OpenOffice is written in another language","They share a common code base, as LibreOffice was forked from OpenOffice."],["LibreOffice has a patent on its changes","The barrier is the licence on the code, not a patent."],["Oracle bought LibreOffice from its community","Oracle owned OpenOffice."]],"id":"4oss13"},{"u":4,"t":"oss","d":"m","s":"172","q":"Why do projects require a Contributor Licence Agreement?","o":[["Without it, contributors own even small fixes","That can cause legal trouble for the project later."],["It makes contributors employees of the project","Contributors stay volunteers or keep their own employer."],["It gives up the copyright of all past work","It is scoped to that project."],["It replaces the licence of the project","The project licence still governs users. The CLA covers the contributor's side."]],"id":"4oss14"},{"u":4,"t":"oss","d":"m","s":"151","q":"Which describes the BAZAAR model?","o":[["Open, organic development with wide participation","Linux is the example."],["A core group works centrally and releases when done","This is the cathedral."],["A company sells closed binaries","Selling closed binaries is proprietary software."],["Developers are assigned features by a board","Central assignment is closer to the cathedral. In a bazaar anyone can contribute."]],"id":"4oss15"},{"u":4,"t":"oss","d":"m","s":"151","q":"Which projects are given as CATHEDRAL examples?","o":[["GNU Emacs and GCC in the 1990s","With Chrome and IntelliJ as \"sort-of\" examples today."],["Linux and the Apache web server","Linux is the bazaar example."],["Apache Kafka and the Python language","They are in the governance part."],["Firefox and NumPy","They are in the governance part."]],"id":"4oss16"},{"u":4,"t":"oss","d":"m","s":"145-146","q":"What did Netscape do in January 1998?","o":[["Opened the source of a proprietary product","It was the first company to do so (Mozilla)."],["Bundled its browser with Windows 95","Microsoft did this with Internet Explorer."],["Released its own browser under the GNU GPL","It made a new licence."],["Founded the Free Software Foundation","The FSF is Richard Stallman's foundation and dates from the 1980s."]],"id":"4oss17"},{"u":4,"t":"oss","d":"m","s":"146","q":"\"____ is a development methodology; ____ is a social movement.\" Which fits Stallman's quote?","o":[["Open source; free software","This is his distinction."],["Free software; open source","This is reversed. Stallman sees free software as the movement."],["The bazaar; the cathedral","These are development models."],["Copyleft; copyright","These are legal ideas."]],"id":"4oss18"},{"u":4,"t":"oss","d":"h","s":"148","q":"\"Many eyes\" is listed as BOTH an advantage and a disadvantage of open source. Why?","o":[["More people find faults, for good or ill","Users report and fix more bugs, but attackers can find weaknesses first."],["More people pay, but fewer contribute","\"Eyes\" refers to people reading the code, not paying for it."],["More forks appear, but none are maintained","Forking appears under the control point, not under many eyes."],["More licences apply, but none are valid","Licences do not multiply with the number of readers."]],"id":"4oss19"},{"u":4,"t":"oss","d":"m","s":"154","q":"Which project is paired with the right kind of governance?","o":[["TensorFlow: managed by a for-profit firm","Google. Also Chromium, Moby, Ubuntu, PyTorch and Java."],["Firefox: managed by a for-profit firm","Mozilla is a non-profit."],["Chromium: managed by a community","It is managed by Google."],["Python: managed by Oracle","It is the PSF; Oracle manages Java."]],"id":"4oss20"},{"u":4,"t":"oss","d":"h","s":"157","q":"A company keeps an internal fork of a library. What is the main cost, and a listed remedy?","o":[["Hard to sync with upstream; contribute changes back","Another option is an internal owner who keeps the fork up to date."],["Slower to compile; rewrite it in another language","Build time is not the trouble. The trouble is merging upstream changes into your fork."],["Loses copyright; buy a commercial licence","Forking does not remove your copyright in your own changes."],["Breaks the GPL; publish the binaries only","Publishing only binaries would itself break the GPL if you distribute."]],"id":"4oss21"},{"u":4,"t":"oss","d":"m","s":"160","q":"In the 2021 chart, which are the two most popular open-source licences?","o":[["Apache 2.0, then MIT","About 34% and 30%."],["MIT, then GPL 3.0","GPL 3.0 is about 10%."],["GPL 2.0, then GPL 3.0","They are about 10% each."],["BSD 3, then Apache 2.0","BSD 3 is about 6%."]],"id":"4oss22"},{"u":4,"t":"pat","d":"e","s":"174","q":"For a patent, an invention must be:","o":[["New, useful and non-obvious","The title of the slide."],["New, popular and cheap","Popularity and price have no role. The idea must be new, useful and non-obvious."],["Useful, secret and complex","The invention must be disclosed."],["Old, proven and public","A patent needs novelty, so something old and public fails."]],"id":"4pat01"},{"u":4,"t":"pat","d":"m","s":"175","q":"What right does a patent give its holder?","o":[["To stop others making, using or selling it","For 20 years."],["To freely make, use and sell the new invention","The slide says patents do NOT give you this right."],["To copy the source code of rivals","Copying rivals' code would infringe their copyright."],["To use a name and logo","Names and logos are protected by trademark."]],"id":"4pat02"},{"u":4,"t":"pat","d":"h","s":"176","q":"Two teams write different code for the same patented method. Which is true?","o":[["Both may infringe the patent, without any copying","A patent covers the idea; copyright covers the expression."],["Neither can infringe, since their code is different","Patents cover ideas, not the text of code."],["Both infringe copyright, since the method is the same","Copyright does not cover ideas."],["Only the second team infringes, since it was later","Neither owns the patent."]],"id":"4pat03"},{"u":4,"t":"pat","d":"m","s":"176","q":"Unlike patents, copyright:","o":[["Arises automatically","Patents are issued by an office after an application."],["Covers ideas","Copyright covers expression. Patents cover ideas."],["Needs public disclosure","Disclosure is part of a patent application. Copyright needs none."],["Must be granted by an office","Patents are granted by an office. Copyright comes with the work itself."]],"id":"4pat04"},{"u":4,"t":"pat","d":"m","s":"177","q":"Why must an applicant disclose technical details?","o":[["A patent trades disclosure for exclusive rights","Encouraging disclosure is one reason patents exist."],["The office wants to build the invention itself","The office examines applications. It does not build inventions."],["It puts the invention into the public domain at once","The rights last 20 years."],["It proves the invention has been sold before","Prior sale would count against novelty."]],"id":"4pat05"},{"u":4,"t":"pat","d":"h","s":"179","q":"What did Alice v. CLS Bank (2014) decide about abstract ideas?","o":[["Running one on a generic computer is not enough","It struck down \"do it on a computer\" patents."],["Any idea run on a computer can be patented","This is the opposite. Generic computer implementation was not enough."],["All software patents are void","Software patents still exist. Abstract ideas on a generic computer were rejected."],["Banks are exempt from software patents","CLS Bank won on the merits of the claim. Banks have no exemption."]],"id":"4pat06"},{"u":4,"t":"pat","d":"m","s":"182","q":"PNG, Opus and AV1 are examples of:","o":[["Formats made to avoid patented ones","PNG for GIF, Opus for MP3, AV1 for H.265."],["Patents held by non-practising entities","They were created to AVOID patent problems."],["Licences used for open data","Open data uses licences such as Creative Commons. These are file and media formats."],["Standards for an SBOM","Those are SPDX, CycloneDX and SWID."]],"id":"4pat07"},{"u":4,"t":"pat","d":"m","s":"183","q":"Carmack's complaint is about which problem?","o":[["Independent discovery is no defence","You may be barred from your own solution as someone filed first."],["Patents cost too little to obtain","US software patents cost $15,000 to $45,000, and cost is a separate complaint."],["Patents expire too quickly","The complaint on terms is that they are long."],["Formats are incompatible","Incompatibility is the complaint behind PNG and GIF. Carmack speaks of solving it yourself."]],"id":"4pat08"},{"u":4,"t":"pat","d":"m","s":"185, 187","q":"A firm makes no products but sues coffee shops for offering Wi-Fi. It is a:","o":[["Non-practising entity","Also called a patent troll."],["Benevolent dictator","A benevolent dictator guides an open-source project, as in early Python or Linux."],["Core contributor","A core contributor writes code with push access."],["Dual licensor","A dual licensor sells a real product under two licences, like MySQL."]],"id":"4pat09"},{"u":4,"t":"pat","d":"h","s":"181","q":"Why does a 20-year term with long pendency suit software badly?","o":[["Software is often outdated well before the patent ends","Software applications were pending for about 25 months on average, and the term is far longer than most products last."],["Software cannot be described in a patent application","Software patents are granted often. The trouble is their timing and vagueness."],["Software is released before it can be written down","The problem is how long the patent lasts, not when code is released."],["Software patents expire while still pending","The term is 20 years and pendency about 2, so they outlive the product instead."]],"id":"4pat10"},{"u":4,"t":"pat","d":"m","s":"184","q":"Why is it said that only LARGE organisations benefit?","o":[["Challenging patents needs time and money","In the US each side also pays its own legal fees."],["Small companies cannot legally apply for patents","Anyone may apply. Small firms are held back by cost and expertise."],["Large ones receive patents without a fee","Large firms pay the same kinds of fees but can afford them."],["The loser pays all the costs in the US","This is the European rule."]],"id":"4pat11"},{"u":4,"t":"pat","d":"m","s":"190","q":"The Open Invention Network and License on Transfer are examples of:","o":[["Alternative licensing models","With the Defensive Patent License."],["Patent troll companies","They are responses to trolls."],["Copyleft software licences","They are about patents."],["Patent offices","A patent office grants patents. These are agreements between companies."]],"id":"4pat12"},{"u":4,"t":"lvl","d":"m","s":"197","q":"Which level mainly finds INTERFACE errors between components?","o":[["Integration testing","It finds bugs that unit testing missed."],["Unit testing","It checks each unit by itself."],["System testing","It assesses the entire system."],["Acceptance testing","It checks that needs are met."]],"id":"4lvl01"},{"u":4,"t":"lvl","d":"m","s":"214-217","q":"In the example, who carries out SYSTEM testing?","o":[["A QA team separate from developers","Level 3 is done by QA."],["The developers who wrote the code","They do unit testing."],["Customer representatives","They do acceptance testing."],["The change control board","It decides on changes."]],"id":"4lvl02"},{"u":4,"t":"lvl","d":"h","s":"215","q":"A test runs registerStudent(), saveToDatabase() and sendConfirmationEmail() together. Which level is this?","o":[["Integration","It checks how two or more components interact."],["Unit","That would test registerStudent() alone."],["System","That would be a full user flow such as login to payment."],["Acceptance","That would ask whether a business rule is met."]],"id":"4lvl03"},{"u":4,"t":"lvl","d":"h","s":"217","q":"\"Can a student register for exactly 3 events per week?\" is a test at which level?","o":[["Acceptance","It checks a business requirement and is the final quality gate."],["Integration","No chain of components is tested."],["Unit","No single function is named."],["Smoke","That checks the most important functions of a build."]],"id":"4lvl04"},{"u":4,"t":"lvl","d":"m","s":"198","q":"System testing checks compliance with the:","o":[["Software requirement specification","On a completely integrated system, as a black box."],["Coding standard agreed by the team","That is for reviews and linters."],["Unit test plan","A unit test plan guides tests of single units, not of the whole system."],["Licence terms of each library used","That is compliance on licensing."]],"id":"4lvl05"},{"u":4,"t":"lvl","d":"m","s":"199","q":"Deciding whether a build is fit for further testing is the job of:","o":[["Smoke and sanity testing","They make sure that the most important functions work."],["Recovery testing","That checks restart after a disaster."],["Localization testing","That checks a target culture."],["Scalability testing","That checks scaling up and down."]],"id":"4lvl06"},{"u":4,"t":"lvl","d":"h","s":"202-203","q":"Expected peak is 1,000 users. Test A uses 1,200 users to see behaviour. Test B raises users until the system breaks. They are:","o":[["A: load, B: stress","Load uses normal or above-average usage. Stress finds the breaking point."],["A: stress, B: load","This is reversed. Going until it breaks is the stress test."],["A: smoke, B: soak","Smoke checks main functions, and soak runs for long."],["A: soak, B: smoke","Soak means long duration and smoke means a quick check. Neither describes A or B."]],"id":"4lvl07"},{"u":4,"t":"lvl","d":"m","s":"199","q":"Checking that a system restarts properly after a power failure is:","o":[["Recovery testing","Restart after a disaster or unanticipated shutdown."],["Installation testing","It checks install and removal."],["Platform testing","It checks different environments."],["Compliance testing","Compliance testing checks internal and external standards."]],"id":"4lvl08"},{"u":4,"t":"lvl","d":"h","s":"202","q":"After stopping the server, a lock file remains and blocks the next start. Which test should catch this?","o":[["Startup and shutdown","Shutdown tests check for uncleared lock files and inconsistent data."],["Boundary value analysis","It uses boundary values."],["Usability and training","It looks at ease of use."],["Localization to a culture","It looks at a target culture."]],"id":"4lvl09"},{"u":4,"t":"lvl","d":"m","s":"200","q":"Verifying that ALL components are removed when an app is uninstalled is part of:","o":[["Installation testing","The slide includes both install and removal."],["Destructive testing","That makes the application fail."],["Security testing","That uncovers vulnerabilities."],["Regression testing","That looks for side effects of change."]],"id":"4lvl10"},{"u":4,"t":"lvl","d":"m","s":"207","q":"What is \"big-bang\" integration?","o":[["Build units separately, then combine all at once","\"Hope for the best.\""],["Add one unit at a time and then test after each one","Adding units gradually is incremental integration."],["Start from the UI and go inwards","Starting at the UI and going inwards is top-down."],["Start from the database and go outwards","Starting at the data layer and going outwards is bottom-up."]],"id":"4lvl11"},{"u":4,"t":"lvl","d":"h","s":"206-207","q":"Why is a failure after big-bang integration hard to debug?","o":[["All problems appear together at one time","Cascading interdependencies stop you solving one at a time."],["The modules were never tested by themselves","They were, separately."],["Stubs are still in place for all the modules","Big-bang combines the real modules."],["The compiler cannot link many modules","The real modules link and run. The difficulty is telling which one is at fault."]],"id":"4lvl12"},{"u":4,"t":"lvl","d":"m","s":"209","q":"Which is a BENEFIT of incremental integration?","o":[["Errors are easier to isolate and fix","Good for customers and developer morale."],["No stubs are ever needed for testing","Stubs are listed as a challenge of incremental integration, so they may be needed."],["All modules can be written by one person only","The benefit is for isolating errors. It does not change who writes the modules."],["System testing can be skipped","System testing still follows, since it checks the whole system end to end."]],"id":"4lvl13"},{"u":4,"t":"lvl","d":"h","s":"211-212","q":"A team finds serious UI design flaws only at the very end of integration. Which approach did it most likely use?","o":[["Bottom-up","High-level and UI flaws are not discovered until late."],["Top-down","UI is first, so its flaws appear early."],["Sandwich","UI is connected early to bottom-level parts."],["Continuous","Continuous integration is a practice of merging often. It does not say which layer is first."]],"id":"4lvl14"},{"u":4,"t":"lvl","d":"h","s":"211","q":"Which drawback goes with TOP-DOWN integration?","o":[["Many lower-level stubs are needed","And tough design decisions can be postponed."],["The UI is seen very late","Top-down starts with the UI, so it is seen first. Bottom-up shows it late."],["Upper-level drivers must be written","Upper-level code to drive lower layers is needed in bottom-up."],["It cannot be used if UI needs are clear","It makes sense when UI requirements are clear."]],"id":"4lvl15"},{"u":4,"t":"lvl","d":"m","s":"213","q":"A project's database schema is critical, and it is not agile. Which approach does the lecture suggest?","o":[["Bottom-up","UI clear means top-down; schema critical means bottom-up; most agile projects use sandwich."],["Top-down","This suits clear UI requirements."],["Sandwich","This suits most agile projects."],["Big-bang","This is not recommended."]],"id":"4lvl16"},{"u":4,"t":"lvl","d":"m","s":"238","q":"Which is NOT a reason to use a stub?","o":[["The real one has full branch coverage","Coverage does not create a need for a stub."],["The real component has not been built yet","This is the first listed reason: component B does not exist yet."],["The real component charges cards","Side effects are a listed reason."],["The real component is a slow database","Slowness is a listed reason."]],"id":"4lvl17"},{"u":4,"t":"lvl","d":"m","s":"239","q":"What is the key point about removing a stub?","o":[["Code changes should be minimal","\"Minimize code changes when you remove the stub.\""],["All tests should be deleted","The tests stay useful, now running against the real component."],["The database should be reset","The stub protected the real database, so nothing in it needs resetting."],["The interface should be redesigned","This would mean many changes."]],"id":"4lvl18"},{"u":4,"t":"lvl","d":"m","s":"205","q":"In the acceptance categories, verifying the installation in the target environment is:","o":[["Installation testing","It may be identical to system testing in a new environment."],["Qualification testing","It checks behaviour against customer requirements."],["Alpha and beta testing","Trial use by a small representative set."],["Performance testing","It checks capacity and response time."]],"id":"4lvl19"},{"u":4,"t":"lvl","d":"m","s":"221","q":"Stress testing, as a form of performance testing, means:","o":[["Overloading the system to see how it fails","Performance tests usually raise the load steadily; stress goes beyond."],["Running the system at normal load for one full day","Closer to a soak test."],["Testing one function with many inputs","Many inputs to one function is closer to unit testing or fuzzing."],["Checking the system on many operating systems","That is platform testing. Stress testing is about overload."]],"id":"4lvl20"},{"u":4,"t":"pen","d":"e","s":"223","q":"What separates penetration testing from a real attack?","o":[["It is authorised and gives a report","It simulates an attack and recommends fixes."],["It uses entirely different attack tools","It uses the same tools as attackers."],["It never exploits a weakness","Exploitation is one of the stages."],["It is fully automatic","It combines scanning with manual work."]],"id":"4pen01"},{"u":4,"t":"pen","d":"m","s":"224","q":"A tester gets some credentials but no source code. Which type is it?","o":[["Gray-box","Partial knowledge, a hybrid approach."],["Black-box","Black-box testers have public information only, with no credentials given."],["White-box","White-box testers know the source code and architecture."],["Glass-box","Another name for white-box."]],"id":"4pen02"},{"u":4,"t":"pen","d":"h","s":"224","q":"A company wants the MOST REALISTIC picture of an outside attacker. Which type fits, and what does it give up?","o":[["Black-box; it may be less thorough","White-box can be more thorough by using internal insight."],["White-box; it may be less thorough","White-box is the more thorough one."],["Gray-box; it needs full source code","Gray-box has partial knowledge."],["Black-box; it needs the architecture","Black-box knows only public information."]],"id":"4pen03"},{"u":4,"t":"pen","d":"h","s":"225","q":"What is the correct order of the penetration testing stages?","o":[["Reconnaissance, scanning, assessment, exploitation, reporting","The five phases on the slide."],["Scanning, reconnaissance, exploitation, assessment, reporting","Reconnaissance is first."],["Reconnaissance, exploitation, scanning, assessment, reporting","Exploitation follows assessment."],["Reconnaissance, scanning, exploitation, assessment, reporting","Assessment prioritises targets before exploitation."]],"id":"4pen04"},{"u":4,"t":"pen","d":"m","s":"225","q":"Using WHOIS and Shodan to learn about a target belongs to:","o":[["Reconnaissance","Gathering information from public sources."],["Scanning","Probing for open ports and services."],["Exploitation","Exploitation attacks confirmed weaknesses to prove impact, much later."],["Reporting","Documenting findings."]],"id":"4pen05"},{"u":4,"t":"pen","d":"m","s":"227","q":"Which tool is matched to its purpose?","o":[["SQLMap: automates SQL injection","Discovery and exploitation."],["Nmap: analyses captured packets","Nmap maps hosts and ports; Wireshark analyses packets."],["Wireshark: an exploitation framework","Wireshark analyses packets. The exploitation framework is Metasploit."],["OWASP ZAP: fuzzes the Linux kernel","ZAP scans web apps; Syzkaller fuzzes the kernel."]],"id":"4pen06"},{"u":4,"t":"pen","d":"m","s":"226","q":"Which standard is said to mandate regular pentests?","o":[["PCI DSS","It is for payment card data."],["ISO 9126","ISO 9126 is the quality model with six characteristics."],["IEEE 1061","A quality metrics standard."],["SPDX","SPDX is an SBOM format from the Linux Foundation."]],"id":"4pen07"},{"u":4,"t":"pen","d":"m","s":"228","q":"In the 2023 case, what did 372 vulnerabilities represent in possible cost?","o":[["About $2.6M a day in downtime","$2.591M per day if exploited."],["About 5.2M stolen guest records","That figure is from the Marriott breach of 2020."],["About 10,000 bugs fixed","That is roughly the number of bugs OSS-Fuzz has found."],["About $400M in payload","This was Ariane 5."]],"id":"4pen08"},{"u":4,"t":"pen","d":"e","s":"230","q":"Fuzzing is a ____ technique that feeds a program ____ inputs.","o":[["dynamic; random or malformed","The program is run and watched for crashes."],["static; random or malformed","The program is executed."],["dynamic; carefully specified","Inputs are unexpected."],["static; carefully specified","Fuzzing runs the program, so it is dynamic, and its inputs are random or malformed."]],"id":"4pen09"},{"u":4,"t":"pen","d":"m","s":"231","q":"A fuzzer takes a valid PNG and flips bits in it. It is:","o":[["Mutation-based","It modifies valid sample inputs."],["Generation-based","This creates inputs from a model or grammar."],["White-box","This is about knowledge of the source."],["Property-based","This checks stated properties."]],"id":"4pen10"},{"u":4,"t":"pen","d":"h","s":"231","q":"A parser rejects almost all mutated files in its first check. Which fuzzer is likely to reach deeper code?","o":[["One that builds inputs from the grammar","Generation-based inputs are syntactically valid, so they pass the first checks."],["One that sends purely random bytes","They would be rejected even sooner."],["One with no feedback about coverage","It would not know which inputs go deeper."],["One that replays the same valid file","It would never explore anything new."]],"id":"4pen11"},{"u":4,"t":"pen","d":"h","s":"232","q":"In a coverage-guided fuzzer, what happens to an input that reaches a NEW branch?","o":[["It is favoured and mutated further","This is the feedback-driven loop of AFL and libFuzzer."],["It is discarded, as its branch is covered","It is kept as a seed."],["It is reported as a crash","Reaching a branch is not a crash."],["It is used once more and then removed","It is used to create more."]],"id":"4pen12"},{"u":4,"t":"pen","d":"m","s":"232","q":"Why run the target with AddressSanitizer while fuzzing?","o":[["To detect memory errors without a crash","Sanitizers reveal errors during execution."],["To make the target run faster","Sanitizers slow it down."],["To generate valid inputs from a given grammar","The fuzzer does this."],["To hide the source from the tester","A sanitizer changes the build to report errors. It hides nothing."]],"id":"4pen13"},{"u":4,"t":"pen","d":"m","s":"234","q":"Which fuzzer targets the LINUX KERNEL?","o":[["Syzkaller","It uses system call models."],["Hypothesis","A Python property-based testing library."],["libFuzzer","For C/C++ libraries, built into LLVM/Clang."],["BooFuzz","A network protocol fuzzer."]],"id":"4pen14"},{"u":4,"t":"pen","d":"m","s":"235","q":"OSS-Fuzz found two critical OpenSSL issues in 2022. In which part?","o":[["The Punycode parser","Stack buffer overflows, CVE-2022-3602 and CVE-2022-3786."],["The heartbeat extension","The heartbeat extension was the 2014 Heartbleed bug."],["The random number generator","The two CVEs were stack buffer overflows in parsing, not weak randomness."],["The certificate store","The overflows were in decoding Punycode names, not in storing certificates."]],"id":"4pen15"},{"u":4,"t":"pen","d":"h","s":"233, 236","q":"Which statement best compares pentesting and fuzzing?","o":[["Pentesting is high-level; fuzzing digs into low-level code","They find different bugs and are complementary."],["Pentesting replaces fuzzing in web systems","They complement each other."],["Fuzzing finds weak passwords; pentesting finds memory bugs","This is reversed. Memory bugs are what fuzzing finds best."],["Both need full knowledge of the source code","Neither always needs it."]],"id":"4pen16"},{"u":4,"t":"evo","d":"e","s":"249","q":"Analysing a program to represent it at a HIGHER level than source code is:","o":[["Reverse engineering","This is the slide's definition."],["Forward engineering","This regenerates an improved program."],["Code refactoring","This restructures modules."],["Inventory analysis","This lists the applications."]],"id":"4evo01"},{"u":4,"t":"evo","d":"m","s":"248","q":"How many activities does the reengineering model have, and how are they arranged?","o":[["Six, in a cycle","Inventory, documents, reverse engineering, code, data, forward engineering."],["Six, strictly in sequence","It is a cyclical model."],["Four, in a cycle","The support model has four."],["Three, in sequence","The slide says six activities, drawn as a cycle."]],"id":"4evo02"},{"u":4,"t":"evo","d":"h","s":"248-250","q":"In the cycle, which activity comes directly AFTER document restructuring?","o":[["Reverse engineering","Order: inventory, document restructuring, reverse engineering, code, data, forward engineering."],["Code refactoring","This comes after reverse engineering."],["Forward engineering","Forward engineering is the last of the six activities."],["Inventory analysis","This comes before document restructuring."]],"id":"4evo03"},{"u":4,"t":"evo","d":"m","s":"250","q":"Dissecting the current data architecture and reviewing data structures is:","o":[["Data refactoring","Data models, objects and attributes are identified."],["Document restructuring","This is about documentation."],["Code refactoring","This is about modules."],["Inventory analysis","This is about applications."]],"id":"4evo04"},{"u":4,"t":"evo","d":"m","s":"247","q":"\"Before you start rebuilding, be sure you understand how the original was built\" matches which activity?","o":[["Reverse engineering","It recovers the design of the existing program."],["Forward engineering","This is the rebuild itself."],["Release management","Release management brings changes to users. It does not recover a design."],["Regression testing","Regression testing checks for side effects. It does not recover a design."]],"id":"4evo05"},{"u":4,"t":"evo","d":"m","s":"256","q":"A tax rule changes, and billing software is updated after delivery to stay usable. This is:","o":[["Adaptive maintenance","It reacts to a changing environment."],["Corrective maintenance","It repairs reported problems."],["Perfective maintenance","It adds features or improves structure."],["Preventive maintenance","It finds faults before users do."]],"id":"4evo06"},{"u":4,"t":"evo","d":"h","s":"257","q":"A team rewrites messy but working code after delivery to improve its structure. No user has reported a problem. This is:","o":[["Perfective maintenance","Better program structure is listed under perfective."],["Preventive maintenance","This detects and corrects FAULTS before users find them."],["Corrective maintenance","There was no reported problem."],["Adaptive maintenance","The environment has not changed."]],"id":"4evo07"},{"u":4,"t":"evo","d":"h","s":"257","q":"A team runs a static analyser on shipped code and fixes a latent buffer overflow no one has hit. This is:","o":[["Preventive maintenance","The fault is corrected before users discover it."],["Perfective maintenance","This would add features or improve structure."],["Corrective maintenance","This repairs problems found by users after delivery."],["Adaptive maintenance","This follows a change in the environment."]],"id":"4evo08"},{"u":4,"t":"evo","d":"h","s":"255-257","q":"Which pair are both REACTIVE maintenance?","o":[["Corrective and adaptive","Reactive work is like firefighting and cannot be planned."],["Perfective and preventive","Both are proactive and can be scheduled."],["Corrective and preventive","Preventive is proactive."],["Adaptive and perfective","Perfective is proactive."]],"id":"4evo09"},{"u":4,"t":"evo","d":"m","s":"253","q":"Which is a sign of maintainable software?","o":[["Modularity and understandable design patterns","With coding standards and self-documenting code."],["Its original author is always available to help","It is made by people who know they may not be around."],["It has never been changed since release","Useful software keeps changing. Maintainable code makes that change easy."],["It has been written in one file","This is the opposite of modularity."]],"id":"4evo10"},{"u":4,"t":"evo","d":"m","s":"254","q":"Maintenance begins and ends when?","o":[["From release, for the product's whole life","Bug reports return within days."],["One year after release, and lasts for a year","Bug reports arrive within days of release, so it cannot wait a year."],["After retirement, and lasts five years","Support ends around then."],["Before testing, and ends at release","Maintenance is after delivery."]],"id":"4evo11"},{"u":4,"t":"evo","d":"m","s":"258","q":"In agile maintenance, what about an URGENT customer request during a sprint?","o":[["It may interrupt the scheduled sprint","The slide says to allow this."],["It must wait for the next release","Urgent requests may interrupt."],["It goes to the change board for a month","Formal boards are slow. Agile maintenance lets urgent requests interrupt."],["It is always refused","The advice is to allow urgent requests to interrupt the sprint."]],"id":"4evo12"},{"u":4,"t":"evo","d":"m","s":"261","q":"Which item is part of RELEASE MANAGEMENT in the slide?","o":[["Infrastructure-as-code","With integration, CI, build specifications, and deployment and release."],["Requirements elicitation","Elicitation happens when requirements are gathered, well before a release."],["Threat taxonomy","A threat taxonomy such as LINDDUN belongs to threat modelling."],["Function point counting","Function points estimate size, which is used in planning."]],"id":"4evo13"},{"u":4,"t":"evo","d":"h","s":"262","q":"Which is the order of product phases in the retirement timeline?","o":[["Active, restricted, legacy, obsolete","As shown on the lower arrow."],["Active, legacy, restricted, obsolete","Restricted comes before legacy."],["Restricted, active, obsolete, legacy","Active is first and obsolete is last."],["Active, obsolete, legacy, restricted","Obsolete is the last phase, after legacy."]],"id":"4evo14"},{"u":4,"t":"evo","d":"m","s":"264","q":"Which are the four stages of the iterative software support model?","o":[["Initiate, innovate, evaluate, produce","The cycle on the slide. The last stage is \"Produce and market\"."],["Plan, do, check, act, then repeat again","This is the general quality cycle, not the support model on the slide."],["Inventory, reverse, refactor, forward","These are activities of reengineering."],["Active, restricted, legacy, obsolete","From the retirement timeline."]],"id":"4evo15"},{"u":4,"t":"evo","d":"m","s":"266","q":"Why should support staff have a database of past defects?","o":[["To diagnose similar defects quickly","It stores characteristics, cause and cure."],["To rank developers by the bugs they made","The records hold characteristics, cause and cure, so they help diagnosis, not ranking."],["To calculate function points","Function points measure size from functionality, not from past defects."],["To stop users from reporting bugs","Users still report bugs. The database makes answering them faster."]],"id":"4evo16"},{"u":4,"t":"evo","d":"m","s":"265","q":"Software supportability is the capability of:","o":[["Supporting a system over its product life","It includes equipment, facilities, labour and other resources."],["Passing every planned test before the release","This is a test result."],["Running unchanged on many different platforms","Running elsewhere is portability, one of the ISO 9126 characteristics."],["Being sold under two licences","This is dual licensing."]],"id":"4evo17"}]</script>
<script id="app">
(() => {
'use strict';
const TOPICS = {
  3: [['ai','AI for software engineering'],['ml','Engineering ML systems'],['code','Implementation and coding style'],['rev','Testable code and code review'],
      ['arch','Understanding existing code'],['stat','Static analysis'],['cicd','CI/CD, DevOps and DevSecOps'],['test','Testing principles and test design'],
      ['insp','Inspections and stages of testing'],['perf','Performance and chaos engineering'],['dyn','Dynamic testing and cyclomatic complexity'],
      ['scm','Configuration management (SCM)'],['chg','Change management and SBOM']],
  4: [['met','Software quality and metrics'],['tmet','Test metrics, function points, Goodhart’s law'],['sec','Network security'],['priv','Privacy, GDPR and LINDDUN'],
      ['cov','Code coverage'],['eth','Ethics'],['oss','Open source and licences'],['pat','Software patents'],['lvl','Integration, system and acceptance testing'],
      ['pen','Penetration testing and fuzzing'],['evo','Software evolution and maintenance']]
};
const FLAT = [3,4].flatMap(u => TOPICS[u].map(([t, name]) => ({u, t, name, k:u + t})));
const TNAME = Object.fromEntries(FLAT.map(x => [x.k, x.name]));
const DN = {e:'Easy', m:'Moderate', h:'Hard'}, DL = {e:1, m:2, h:3}, LET = 'ABCD';
const KEY = 'full-coverage-se-v1';
const put = (...k) => root.replaceChildren(...k.flat(Infinity).filter(Boolean));
const root = document.getElementById('app-root'), live = document.getElementById('live');
let Q = [], BY = {}, keys = null;

/* ---------- saved progress (this browser only) ---------- */
let S = {r:{}, b:{}, runs:{}, cur:null, tab:'unit-3', lv:'a', mock:{unit:'b', n:'50', lv:'a'}};
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) S = Object.assign(S, {r:o.r || {}, b:o.b || {}, runs:o.runs || {}, cur:o.cur || null, tab:o.tab || 'unit-3', lv:o.lv || 'a', mock:Object.assign(S.mock, o.mock)}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- helpers ---------- */
function el(tag, at, ...kids) {

}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

const isOk = q => S.r[q.id] && S.r[q.id][1], isNo = q => S.r[q.id] && !S.r[q.id][1];

const slideRef = q => q.s === 'sample' ? 'From your sample paper' : 'Unit ' + q.u + ' PDF, slide ' + q.s;
const level = d => el('span', {class:'lvl'}, [1,2,3].map(i => el('i', {class:i <= DL[d] ? 'x' : ''})), el('em', {}, DN[d]));
const meter = (ok, no, n, cls) => el('div', {class:'meter', 'aria-hidden':'true'}, el('span', {class:cls || 'ok', style:'width:' + 100 * ok / n + '%'}), el('span', {class:'no', style:'width:' + 100 * no / n + '%'}));
function nav(h) { if (location.hash === '#' + h) route(); else location.hash = h; }

/* ---------- starting and resuming ---------- */
function makeRun(list, name, mode) { return {ids:list.map(q => q.id), perm:list.map(() => shuffle([0,1,2,3])), picks:list.map(() => null), at:0, mode:mode || 'now', name, done:false, streak:0}; }
function begin(key, list, name, mode, fresh) {
  const r = S.runs[key];
  if (fresh || !r || r.done || !answered(r)) S.runs[key] = makeRun(shuffle(list), name, mode);
  S.cur = key; save(); nav('quiz');
}
const bySet = (u, t, lv) => Q.filter(q => (!u || q.u === u) && (!t || q.t === t) && (lv === 'a' || q.d === lv));
const tkey = (u, t, lv) => 't' + u + (t || 'all') + '-' + lv;

/* ---------- home ---------- */
function home(tab) {
  keys = null;
  S.tab = tab; save();
  const ok = Q.filter(isOk).length, no = Q.filter(isNo).length, saved = Object.keys(S.b).filter(i => BY[i]).length;
  const cnt = u => Q.filter(q => q.u === u).length;
  const tabs = [['unit-3','u3','Unit 3',cnt(3) + ' questions'],['unit-4','u4','Unit 4',cnt(4) + ' questions'],['mock','ux','Mock test','All topics mixed'],['revise','ux','Revise',no || saved ? no + ' wrong, ' + saved + ' saved' : 'Wrong and saved']];
  const cur = S.cur && S.runs[S.cur], open = cur && !cur.done && answered(cur) ? cur : null;

  put(
    el('header', {class:'top'},
      el('div', {}, el('h1', {tabindex:'-1'}, 'Software Engineering MCQs'), el('p', {}, el('b', {style:'color:var(--ink)'}, Q.length + ' questions'), ' from your Unit 3 and Unit 4 slides. Pick a topic to start.')),
      el('div', {class:'done num'}, el('b', {}, ok + no), ' of ' + Q.length + ' done' + (ok + no ? ', ' + pct(ok, ok + no) + '% right' : ''), meter(ok, no, Q.length))),
    open ? el('div', {class:'resume'}, el('span', {}, 'You stopped at question ' + (open.at + 1) + ' of ' + open.ids.length + ' in ', el('b', {}, open.name)), el('button', {class:'btn go', id:'resume', onclick:() => nav('quiz')}, 'Continue')) : null,
    el('div', {class:'tabs', role:'tablist', 'aria-label':'What to practise'}, tabs.map(([id, c, name, sub]) =>
      el('button', {class:'tab ' + c, id:'tab-' + id, role:'tab', 'aria-selected':String(id === tab), 'aria-controls':'panel', onclick:() => nav(id)}, el('b', {}, name), el('span', {class:'num'}, sub)))),
    el('section', {class:'panel', id:'panel', role:'tabpanel', 'aria-labelledby':'tab-' + tab}, tab === 'mock' ? mockPanel() : tab === 'revise' ? revisePanel() : unitPanel(+tab.slice(-1))),
    el('footer', {class:'foot'}, el('span', {}, 'Your progress is saved in this browser.'), resetBtn()));
}
function resetBtn() {
  let armed = false;
  const b = el('button', {class:'btn bare', id:'reset', onclick:() => {
    if (!armed) { armed = true; b.textContent = 'Press again to erase all progress'; setTimeout(() => { armed = false; b.textContent = 'Reset my progress'; }, 4000); return; }
    S.r = {}; S.b = {}; S.runs = {}; S.cur = null; save(); home(S.tab);
  }}, 'Reset my progress');
  return b;
}
function card(u, t, lv) {
  const list = bySet(u, t, lv), key = tkey(u, t, lv), run = S.runs[key], n = list.length;
  const word = lv === 'a' ? 'question' : DN[lv].toLowerCase() + ' question';
  let act = 'Start';
  if (!n) act = 'None at this level';
  else if (run && run.done) act = 'You got ' + rightN(run) + ' of ' + run.ids.length + '. Practise again';
  else if (run && answered(run)) act = answered(run) + ' of ' + run.ids.length + ' done. Continue';
  const name = t ? TNAME[u + t] : 'All of Unit ' + u;
  return el('button', {class:'card' + (t ? '' : ' all'), id:'card-' + u + (t || 'all'), disabled:!n, onclick:() => begin(key, list, name, 'now')},
    el('span', {class:'name'}, name), el('span', {class:'ct num'}, plural(n, word) + (t ? '' : ', every topic mixed')),
    t ? el('span', {class:'cells', 'aria-hidden':'true'}, list.map(q => el('i', {class:'d-' + q.d + (isOk(q) ? ' ok' : isNo(q) ? ' no' : '')}))) : null,
    el('span', {class:'act num'}, act));
}
function pills(name, items, value, on) {
  return el('div', {class:'pills'}, items.map(([v, t]) => [el('input', {type:'radio', name, id:name + '-' + v, value:v, checked:value === v, onchange:() => on(v)}), el('label', {for:name + '-' + v}, t)]));
}
function unitPanel(u) {
  return [
    el('fieldset', {class:'filter'}, el('legend', {class:'vh'}, 'Difficulty'), el('span', {'aria-hidden':'true'}, 'Difficulty'),
      pills('lv', [['a','All'],['e','Easy'],['m','Moderate'],['h','Hard']].map(([v, t]) => [v, t + ' ' + bySet(u, '', v).length]), S.lv, v => { S.lv = v; home(S.tab); document.getElementById('lv-' + v).focus(); })),
    el('div', {class:'cards u' + u}, card(u, '', S.lv), TOPICS[u].map(([t]) => card(u, t, S.lv))),
    el('div', {class:'key u' + u}, el('span', {}, 'Each small square is one question:'), ['e','m','h'].map(d => el('span', {}, el('i', {class:'d-' + d}), DN[d])), el('span', {}, el('i', {class:'ok'}), 'You got it right'), el('span', {}, el('i', {class:'no'}), 'You got it wrong'))];
}
function mockPanel() {
  const m = S.mock;
  const start = el('button', {class:'btn go big', id:'mock-start', onclick:() => { const l = pool(); begin('mock', shuffle(l).slice(0, want(l)), 'Mock test', 'end', true); }});
  const pool = () => Q.filter(q => (m.unit === 'b' || String(q.u) === m.unit) && (m.lv === 'a' || (m.lv === 'mh' ? q.d !== 'e' : q.d === 'h')));
  const want = l => m.n === 'all' ? l.length : Math.min(+m.n, l.length);
  const note = el('p', {class:'note num'});
  const sync = () => { const l = pool(); start.textContent = 'Start test with ' + plural(want(l), 'question'); note.textContent = 'Picked at random from ' + l.length + ' questions.'; save(); };
  const f = (key, title, items) => el('fieldset', {}, el('legend', {}, title), pills('mock-' + key, items, m[key], v => { m[key] = v; sync(); }));
  const box = el('div', {class:'box'}, el('div', {}, el('h2', {}, 'Mock test'), el('p', {class:'note', style:'margin-top:6px'}, 'You see your score and every explanation after you submit.')),
    f('unit', 'Unit', [['b','Both units'],['3','Unit 3'],['4','Unit 4']]),
    f('n', 'Number of questions', [['25','25'],['50','50'],['100','100'],['all','All']]),
    f('lv', 'Difficulty', [['a','All'],['mh','Moderate and hard'],['h','Hard only']]),
    el('div', {}, start, note));
  note.style.marginTop = '10px';
  sync();
  return box;
}
function revisePanel() {
  const wrong = Q.filter(isNo), saved = Q.filter(q => S.b[q.id]), fresh = Q.filter(q => !S.r[q.id]);
  const c = (id, name, list, empty, sub) => el('button', {class:'card', id:'rev-' + id, disabled:!list.length, onclick:() => begin('rev-' + id, list, name, 'now', true)},
    el('span', {class:'name'}, name), el('span', {class:'ct num'}, list.length ? plural(list.length, 'question') : empty), el('span', {class:'ct'}, list.length ? sub : ''), el('span', {class:'act'}, list.length ? 'Start' : 'Nothing yet'));
  return el('div', {class:'cards u3'},
    c('wrong', 'Questions you got wrong', wrong, 'Wrong answers will collect here.', 'They leave this list once you get them right.'),
    c('saved', 'Questions you saved', saved, 'Press Save on a question to keep it here.', 'Press Saved on a question to remove it.'),
    c('new', 'Questions you have not tried', fresh, 'You have tried every question.', 'From both units, mixed.'));
}

/* ---------- quiz ---------- */
function record(id, good) { const r = S.r[id] || [0, 0]; S.r[id] = [r[0] + 1, good ? 1 : 0]; }
function optNode(q, perm, i, st) {
  const oi = perm[i], [tx, why] = q.o[oi], right = oi === 0, chosen = st.pick === oi;
  let cls = 'opt';
  if (st.show) cls += ' lock' + (right ? ' good' : chosen ? ' bad' : '') + (st.fresh && (right || chosen) ? ' fresh' : '');
  else if (chosen) cls += ' sel';
  const kids = [el('span', {class:'k', 'aria-hidden':'true'}, LET[i]), el('span', {class:'tx'}, tx)];
  if (st.show) kids.push(el('span', {class:'why'}, el('b', {}, right ? (chosen ? 'Correct' : 'Correct answer') : chosen ? 'Your answer is wrong' : 'Why not this one'), why));
  return {cls, kids};
}
function quiz() {
  const run = S.runs[S.cur];
  if (!run || run.done) return nav(S.tab);
  const n = run.ids.length, q = BY[run.ids[run.at]], perm = run.perm[run.at], now = run.mode === 'now';
  const cls = i => (run.picks[i] == null ? '' : now ? (run.picks[i] === 0 ? 'ok' : 'no') : 'had') + (i === run.at ? ' cur' : '');

  const list = el('ol', {class:'opts'}), verdict = el('div', {class:'verdict'}), hint = el('p', {class:'hint'});
  const nextBtn = el('button', {class:'btn go nx', id:'next', onclick:next});
  const saveBtn = el('button', {class:'btn', id:'bookmark', onclick:mark});
  const grid = el('div', {class:'grid'}, run.ids.map((id, i) => el('button', {class:cls(i), 'aria-label':'Question ' + (i + 1), 'aria-current':i === run.at ? 'true' : null, onclick:() => go(i)}, String(i + 1))));
  const tally = el('p', {class:'num'});
  const finBtn = el('button', {class:'btn', id:'finish', onclick:finish}, now ? 'Finish and see score' : 'Submit test');
  const pal = el('aside', {class:'pal', 'aria-label':'All questions in this set'}, el('h3', {}, plural(n, 'question')), tally, grid, finBtn);
  const palT = el('button', {class:'btn pal-t', id:'pal-toggle', 'aria-expanded':'false', onclick:() => { const o = pal.classList.toggle('open'); palT.setAttribute('aria-expanded', o); palT.textContent = o ? 'Hide list' : 'All ' + n + ' questions'; }}, 'All ' + n + ' questions');

  function sync() {
    const a = answered(run), g = rightN(run);
    tally.textContent = now ? (a ? a + ' done, ' + g + ' right' : 'Tap a number to jump to it') : a + ' answered, ' + (n - a) + ' left';
    finBtn.disabled = !a;
    bar.replaceChildren(...meter(now ? g : a, now ? a - g : 0, n, now ? 'ok' : 'had').children);
    grid.children[run.at].className = cls(run.at);
    const on = !!S.b[q.id]; saveBtn.textContent = on ? 'Saved' : 'Save'; saveBtn.setAttribute('aria-pressed', on);
    nextBtn.classList.toggle('go', run.picks[run.at] != null || run.at === n - 1);
    nextBtn.disabled = run.at === n - 1 && !a;
    nextBtn.textContent = run.at === n - 1 ? (now ? 'See score' : 'Submit test') : run.picks[run.at] == null ? 'Skip' : 'Next';
  }
  function draw(fresh) {
    const p = run.picks[run.at], show = now && p != null;
    list.replaceChildren(...[0,1,2,3].map(i => {
      const o = optNode(q, perm, i, {pick:p, show, fresh});
      return el('li', {}, show ? el('div', {class:o.cls}, o.kids) : el('button', {class:o.cls, id:'opt-' + i, 'aria-pressed':p === perm[i] ? 'true' : null, onclick:() => choose(i)}, o.kids));
    }));
    hint.textContent = now ? 'Choose an answer to see the explanation.' : 'Choose an answer. You can change it until you submit.';
    hint.hidden = show;
    verdict.className = 'verdict' + (show ? p === 0 ? ' ok' : ' no' : '');
    verdict.replaceChildren(show ? el('b', {}, p === 0 ? 'Right' + (fresh && run.streak > 2 ? ', ' + run.streak + ' in a row' : '') : 'Wrong, it is ' + LET[perm.indexOf(0)]) : '');
    sync();
  }
  function choose(i) {
    if (now && run.picks[run.at] != null) return;
    run.picks[run.at] = perm[i];
    if (now) {
      const good = perm[i] === 0;
      run.streak = good ? run.streak + 1 : 0;
      record(q.id, good);
      live.textContent = good ? 'Right. ' + q.o[0][1] : 'Wrong. ' + q.o[perm[i]][1] + ' The answer is ' + q.o[0][0] + '. ' + q.o[0][1];
    }
    save(); draw(true);
    nextBtn.focus({preventScroll:true});
    const hit = list.querySelector('.good'); if (hit) hit.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  function go(i) { if (i < 0 || i >= n) return; run.at = i; save(); quiz(); }
  function next() { run.at < n - 1 ? go(run.at + 1) : answered(run) && finish(); }
  function mark() { S.b[q.id] ? delete S.b[q.id] : S.b[q.id] = 1; save(); sync(); }
  let armed = false;
  function finish() {
    const left = n - answered(run);
    if (!now && left && !armed) {
      armed = true; pal.classList.add('open'); palT.textContent = 'Hide list'; palT.setAttribute('aria-expanded', 'true');
      verdict.replaceChildren(el('b', {}, left + ' not answered')); finBtn.textContent = 'Submit anyway'; if (run.at === n - 1) nextBtn.textContent = 'Submit anyway';
      live.textContent = plural(left, 'question') + ' not answered. Press again to submit.';
      return;
    }
    if (!now) run.ids.forEach((id, i) => { if (run.picks[i] != null) record(id, run.picks[i] === 0); });
    run.done = true; save(); nav('score');
  }
  const head = el('h2', {tabindex:'-1'}, q.q);
  const bar = el('div', {class:'meter', 'aria-hidden':'true'});
  put(el('section', {class:'quiz u' + q.u},
    el('div', {class:'bar'}, el('button', {class:'btn', id:'exit', onclick:() => nav(S.tab)}, S.tab.startsWith('unit') ? '← All topics' : '← Home'), el('span', {class:'where'}, run.name), palT),
    bar,
    el('div', {class:'q'},
      el('div', {class:'meta'}, el('span', {class:'tp num'}, 'Question ' + (run.at + 1) + ' of ' + n), level(q.d), el('span', {}, slideRef(q)), TNAME[q.u + q.t] !== run.name ? el('span', {}, TNAME[q.u + q.t]) : null),
      head, q.c ? el('pre', {class:'code', tabindex:'0'}, q.c.join('\n')) : null, hint, list,
      el('div', {class:'dock'}, el('button', {class:'btn', id:'prev', disabled:run.at === 0, onclick:() => go(run.at - 1)}, 'Back'), saveBtn, verdict, nextBtn),
      el('p', {class:'keys'}, 'Keyboard: ', el('kbd', {}, 'A'), ' to ', el('kbd', {}, 'D'), ' answer, ', el('kbd', {}, 'Enter'), ' next, ', el('kbd', {}, '←'), ' back, ', el('kbd', {}, 'S'), ' save')),
    pal));
  draw(false);
  const c = grid.children[run.at]; grid.scrollTop = c.offsetTop - grid.clientHeight / 2 + 20;
  scrollTo(0, 0); head.focus({preventScroll:true});
  keys = e => {
    const k = e.key.toLowerCase();
    if (k.length === 1 && 'abcd'.includes(k)) choose('abcd'.indexOf(k));
    else if (k.length === 1 && '1234'.includes(k)) choose(+k - 1);
    else if (k === 'arrowright') next();
    else if (k === 'arrowleft') go(run.at - 1);
    else if (k === 's') mark();
    else if (k === 'enter' && !(document.activeElement instanceof HTMLButtonElement) && run.picks[run.at] != null) next();
    else return;
    e.preventDefault();
  };
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !keys || !root.querySelector('.quiz')) return;
  if (e.target instanceof HTMLInputElement || (e.target instanceof HTMLPreElement && e.key.startsWith('Arrow'))) return;
  keys(e);
});

/* ---------- results ---------- */
function report() {
  keys = null;
  const key = S.cur, run = S.runs[key];
  if (!run || !run.done) return nav(S.tab);
  const list = run.ids.map(id => BY[id]), n = list.length, good = rightN(run), ans = answered(run);
  const missed = list.filter((q, i) => run.picks[i] != null && run.picks[i] !== 0), skip = list.filter((q, i) => run.picks[i] == null), skipped = n - ans;
  const group = f => { const m = new Map(); list.forEach((q, i) => { if (run.picks[i] == null) return; const k = f(q), g = m.get(k) || {n:0, ok:0}; g.n++; if (run.picks[i] === 0) g.ok++; m.set(k, g); }); return [...m.entries()]; };
  const row = (name, g) => el('div', {class:'row'}, el('span', {}, name), meter(g.ok, g.n - g.ok, g.n), el('span', {class:'num'}, g.ok + ' / ' + g.n));
  const topics = group(q => q.u + q.t).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n);
  const tm = /^t(\d)(\w+)-(\w)$/.exec(key), idx = tm ? FLAT.findIndex(x => x.k === tm[1] + tm[2]) : -1;
  const nx = idx >= 0 ? FLAT[idx + 1] : null, nxList = nx ? bySet(nx.u, nx.t, tm[3]) : [];

  let only = missed.length > 0;
  const rev = el('div', {class:'rev'}), toggle = el('button', {class:'btn', id:'rev-toggle', onclick:() => { only = !only; fill(); }});
  function fill() {
    toggle.textContent = only ? 'Show all ' + n : 'Show only wrong ones'; toggle.hidden = !missed.length;
    rev.replaceChildren(...list.map((q, i) => {
      const pk = run.picks[i], st = pk == null ? 'sk' : pk === 0 ? 'ok' : 'no';
      if (only && st !== 'no') return null;
      const inner = el('div', {class:'in u' + q.u});
      const d = el('details', {}, el('summary', {}, el('span', {class:'tag ' + st}, {ok:'Right', no:'Wrong', sk:'Skipped'}[st]), el('span', {}, q.q)), inner);
      d.addEventListener('toggle', () => {
        if (!d.open || inner.firstChild) return;
        inner.append(el('div', {class:'meta'}, level(q.d), el('span', {}, TNAME[q.u + q.t]), el('span', {}, slideRef(q))));
        if (q.c) inner.append(el('pre', {class:'code', tabindex:'0'}, q.c.join('\n')));
        inner.append(el('ol', {class:'opts'}, [0,1,2,3].map(k => { const o = optNode(q, run.perm[i], k, {pick:pk, show:true}); return el('li', {}, el('div', {class:o.cls}, o.kids)); })));
      });
      return d;
    }).filter(Boolean));
  }
  fill();
  const again = () => key === 'mock' ? nav('mock') : begin(key, list, run.name, run.mode, true);
  const h = el('h1', {tabindex:'-1'}, run.name);
  put(el('section', {class:'rep'},
    el('div', {class:'bar'}, el('button', {class:'btn', id:'exit', onclick:() => nav(S.tab)}, S.tab.startsWith('unit') ? '← All topics' : '← Home')),
    el('div', {class:'score'}, el('div', {class:'big num'}, String(good), el('small', {}, ' / ' + ans)),
      el('div', {}, h, el('p', {class:'num'}, pct(good, ans) + '% right' + (skipped ? ', ' + skipped + ' skipped' : '') + '. ' + (missed.length ? 'Read why below, then retry the wrong ones.' : 'Everything you answered is right.')))),
    el('div', {class:'acts'},
      missed.length ? el('button', {class:'btn go', id:'retry', onclick:() => begin('retry', missed, run.name + ', wrong ones', 'now', true)}, 'Retry ' + plural(missed.length, 'wrong answer')) : null,
      nx && nxList.length ? el('button', {class:'btn' + (missed.length ? '' : ' go'), id:'next-topic', onclick:() => { S.tab = 'unit-' + nx.u; begin(tkey(nx.u, nx.t, tm[3]), nxList, nx.name, 'now'); }}, 'Next topic: ' + nx.name) : null,
      skipped ? el('button', {class:'btn', id:'skipped', onclick:() => begin('retry', skip, run.name + ', skipped ones', 'now', true)}, 'Answer ' + plural(skipped, 'skipped question')) : null,
      el('button', {class:'btn', id:'again', onclick:again}, key === 'mock' ? 'New mock test' : 'Do this set again')),
    topics.length > 1 ? [el('h2', {}, 'By topic, weakest first'), el('div', {class:'rows'}, topics.map(([t, g]) => row(TNAME[t], g))),
      el('h2', {}, 'By difficulty'), el('div', {class:'rows'}, group(q => q.d).sort((a, b) => DL[a[0]] - DL[b[0]]).map(([d, g]) => row(DN[d], g)))] : null,
    el('div', {class:'rev-h'}, el('h2', {}, 'Your answers'), toggle), rev));
  scrollTo(0, 0); h.focus({preventScroll:true});
}

/* ---------- routes ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h === 'quiz') quiz();
  else if (h === 'score') report();
  else { home(['unit-3','unit-4','mock','revise'].includes(h) ? h : S.tab); }
}
async function boot() {
  try {
    Q = window.BANK || (await Promise.all(['unit3.json', 'unit4.json'].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))).flat();
  } catch (e) { document.getElementById('boot').textContent = 'The questions did not load. Reload the page to try again.'; return; }
  Q.forEach(q => BY[q.id] = q);
  for (const k in S.runs) if (!S.runs[k].ids.every(id => BY[id])) delete S.runs[k];
  if (!S.runs[S.cur]) S.cur = null;
  addEventListener('hashchange', route);
  route();
}
boot();
})();
</script>
</body></html>
